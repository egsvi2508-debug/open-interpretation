<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Open Interpretation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: empty search → one result → tiles → windows. Score = all pages in one column, a marker above every bar.
   Bar window = excerpt + notes; connected bars shown as score excerpts to compare. Context = articles with a contents rail. */
:root{
  --paper:#F3F4F6; --surface:#FFFFFF; --sunk:#E9EBEF;
  --ink:#15171C; --muted:#5A6070; --faint:#8A90A0; --line:#D9DCE3;
  --pencil:#2347C8; --pencil-ink:#1B3AA8; --pencil-soft:rgba(35,71,200,.10); --pencil-mid:rgba(35,71,200,.24);
  --heat:#C98A0E; --heat-soft:rgba(217,162,27,.16);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --score-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101217; --surface:#171A21; --sunk:#1E222B; --ink:#E8EAF0; --muted:#A1A7B6; --faint:#727889; --line:#2A2F3B;
  --pencil:#8AA4FF; --pencil-ink:#A9BCFF; --pencil-soft:rgba(138,164,255,.12); --pencil-mid:rgba(138,164,255,.28);
  --heat:#E2B23C; --heat-soft:rgba(226,178,60,.16);
  --score-filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.95); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101217; --surface:#171A21; --sunk:#1E222B; --ink:#E8EAF0; --muted:#A1A7B6; --faint:#727889; --line:#2A2F3B;
  --pencil:#8AA4FF; --pencil-ink:#A9BCFF; --pencil-soft:rgba(138,164,255,.12); --pencil-mid:rgba(138,164,255,.28);
  --heat:#E2B23C; --heat-soft:rgba(226,178,60,.16);
  --score-filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.95); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit}
a{color:var(--pencil-ink)}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* home */
.home{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-top:22vh;padding-inline:16px}
.home .mark{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);font-weight:500;margin-bottom:26px}
.sform{width:100%;max-width:620px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.sform:focus-within{border-color:var(--pencil);box-shadow:0 0 0 4px var(--pencil-soft)}
.sform input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;padding:16px 8px 16px 24px;outline:none}
.sform input::-webkit-search-cancel-button{display:none}
.sform button{border:0;background:none;cursor:pointer;padding:12px 18px;color:var(--muted);display:grid;place-items:center}
.sform svg{width:20px;height:20px}
.res{width:100%;max-width:620px;margin-top:18px}
.res-item{display:flex;width:100%;text-align:left;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;cursor:pointer}
.res-item:hover{border-color:var(--pencil)}
.res-item b{font-family:var(--f-display);font-size:20px;font-weight:600;display:block}
.res-item span{color:var(--muted);font-size:14px}
.res-item i{margin-left:auto;font-style:normal;color:var(--pencil-ink);font-size:20px}
.res-none{color:var(--muted);padding:12px 4px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:12px;padding-block:10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--pencil)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:16px;height:16px}
.ptitle{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.ptitle b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{font-size:12px;color:var(--muted);display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button:hover{background:var(--sunk);color:var(--ink)}
.tabs button.on{background:var(--pencil-soft);color:var(--pencil-ink)}
.view{padding-block:28px 80px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,5vw,44px);line-height:1.05}

/* tiles */
.phead{padding-block:40px 28px}
.phead .comp{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil-ink);font-weight:600}
.phead h1{font-family:var(--f-display);font-weight:500;font-size:clamp(36px,7vw,64px);line-height:1.02;letter-spacing:-.02em;margin-top:8px}
.phead h1 em{font-style:italic;font-weight:400;color:var(--muted);font-size:.55em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--pencil);transform:translateY(-2px)}
.tile .num{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.tile b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.tile.big{grid-column:span 2;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tile.big .num{color:var(--paper);opacity:.6}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile{min-height:104px;padding:16px}.tile b{font-size:21px}}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--pencil-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;vertical-align:1px;text-decoration:none}
.chip:hover{border-color:var(--pencil);background:var(--pencil-soft)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wref{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--pencil);font-style:italic}
.wref:hover{color:var(--pencil-ink);background:var(--pencil-soft)}
.sec-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:30px 0 10px}

/* score */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:16px}
.seg button+button{border-left:1px solid var(--line)}
.mvhead{font-family:var(--f-display);font-size:26px;font-weight:600;margin:34px auto 12px;max-width:860px}
.mvhead:first-child{margin-top:0}
.sheet{position:relative;line-height:0;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:860px;margin:0 auto 16px}
.sheet img{width:100%;height:auto;display:block;filter:var(--score-filter)}
.bz{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:3px}
.bz:hover,.bz.flash{background:var(--pencil-soft);box-shadow:inset 0 0 0 1.5px var(--pencil)}
.mk{position:absolute;transform:translate(-1px,-40%);border:1px solid var(--pencil);background:var(--surface);color:var(--pencil-ink);border-radius:5px;padding:0 4px 1px;font-family:var(--f-mono);font-size:10.5px;line-height:1.35;cursor:pointer;display:flex;align-items:center;gap:2px;z-index:2}
.mk:hover{background:var(--pencil);color:var(--surface)}
.mk.has{background:var(--pencil);color:var(--surface)}
.mk i{width:5px;height:5px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--surface)}
@media (max-width:600px){.mk{font-size:8px;padding:0 2px}.mk i{width:3px;height:3px}}

/* excerpts */
.snip{position:relative;overflow:hidden;background:#fff;min-height:40px;border-radius:8px;border:1px solid var(--line);display:block;width:100%}
.snip img{position:absolute;display:block;max-width:none;filter:var(--score-filter)}
.snip .hl{position:absolute;top:0;bottom:0;background:var(--pencil-soft);box-shadow:inset 0 0 0 2px var(--pencil);border-radius:3px}
button.snipbtn{border:0;padding:0;background:none;cursor:pointer;text-align:left;display:block;width:100%}
button.snipbtn:hover .snip{border-color:var(--pencil)}
.cmp{display:grid;gap:14px}
.cmp-item .cap{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:14px}
.cmp-item .cap b{font-family:var(--f-mono);font-size:13px;font-weight:500}
.cmp-item .cap span{color:var(--muted)}

/* bar window */
.bhead h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1}
.bhead .sub{color:var(--muted);margin-top:6px}
.bnav{display:flex;gap:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
.box h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.box h4{font-family:var(--f-display);font-size:22px;font-weight:600;margin-bottom:8px}
.box .src{font-size:12px;color:var(--faint);font-family:var(--f-mono);margin-top:10px}
.ip{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ip:first-of-type{border-top:0;padding-top:0}
.ip b{font-size:14px}
.ip small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:480px){.ip{grid-template-columns:1fr;gap:2px}}
.mot{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.mot:first-of-type{border-top:0;padding-top:0;margin-top:0}
.mot-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mot-h b{display:flex;gap:8px;align-items:center;font-size:15px}
.mot-h b i{width:10px;height:10px;border-radius:50%}
.mot-h button{border:0;background:none;color:var(--pencil-ink);font-weight:600;font-size:14px;cursor:pointer;padding:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.thumbs .cap{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.none{color:var(--faint);font-size:14px}

/* comments */
.cmt{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cmt:first-of-type{border-top:0;padding-top:2px}
.vote{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;padding:5px 0 4px;height:fit-content}
.vote svg{width:11px;height:11px}
.vote span{font-family:var(--f-mono);font-size:13px}
.vote:hover{border-color:var(--pencil)}
.vote.on{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.by{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.by b{color:var(--ink)}
.role{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.cmt p{font-size:15px;margin-top:3px}
.replies{margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
.compose{display:flex;gap:8px;margin-top:12px}
.compose textarea{flex:1;min-width:0;min-height:44px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:var(--paper);color:var(--ink)}
.compose textarea:focus{outline:none;border-color:var(--pencil)}
.btn{border:0;border-radius:10px;background:var(--pencil);color:var(--surface);font-weight:700;padding:0 16px;cursor:pointer;font-size:14px}
.btn.line{background:var(--surface);color:var(--pencil-ink);border:1px solid var(--line);padding:8px 14px}

/* context articles */
.ctx{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:860px){.ctx{grid-template-columns:1fr;gap:16px}}
.toc{position:sticky;top:130px;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.toc{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}}
.toc a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;padding:6px 10px;border-radius:8px;border-left:2px solid transparent}
.toc a:hover{color:var(--ink);background:var(--sunk)}
@media (max-width:860px){.toc a{border:1px solid var(--line);background:var(--surface);font-size:13px;padding:4px 10px}}
.toc a .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:8px}
article.art{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px clamp(18px,4vw,36px);margin-bottom:18px;scroll-margin-top:130px}
article.art .kick{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
article.art h2{font-family:var(--f-display);font-weight:500;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:6px 0 16px}
article.art h3{font-size:15px;font-weight:700;margin:22px 0 8px}
article.art p{font-size:17px;line-height:1.7;max-width:68ch}
article.art p+p{margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.facts div{background:var(--paper);padding:10px 14px}
.facts span{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.facts b{font-weight:600;font-size:15px}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.art blockquote{margin:16px 0;padding:10px 18px;border-left:3px solid var(--pencil);font-family:var(--f-display);font-style:italic;font-size:19px}
.art blockquote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.art .rel{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.art .rel .label{margin-right:4px}
.art .srcl{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-top:10px}
.lines5{display:grid;gap:10px;margin-top:12px}
.lines5>div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lines5>div:first-child{border-top:0}
.lines5 b{font-family:var(--f-display);font-size:18px}
@media (max-width:520px){.lines5>div{grid-template-columns:1fr;gap:2px}}

/* structure, interp, connections, sources, discussion */
.fm{padding:18px}.fm+.fm{margin-top:14px}
.fm h3{font-family:var(--f-display);font-size:22px;font-weight:600;margin-bottom:12px}
.bands-x{overflow-x:auto}
.bands{display:flex;gap:2px;height:58px;min-width:620px}
.band{min-width:0;border:0;border-radius:5px;padding:6px 7px;text-align:left;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--sunk)}
.band:hover{outline:2px solid var(--pencil)}
.band b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.band small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band.g1{background:var(--pencil-soft)}.band.g2{background:var(--heat-soft)}.band.g3{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.q{margin-bottom:14px;overflow:hidden}
.q-h{padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.q-h b{font-size:18px}
.q-p{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.pos{padding:14px 20px;border-top:1px solid var(--line);border-right:1px solid var(--line);margin:-1px -1px 0 0;display:flex;flex-direction:column;gap:6px}
.pos .who{font-weight:700}
.pos .how{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pos p{font-size:15px;flex:1}
.agree{display:flex;align-items:center;gap:10px}
.agree button{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;flex:none}
.agree button.on{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.agree button svg{width:11px;height:11px}
.meter{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pencil)}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:36px;text-align:right}
.arcs{overflow-x:auto;padding:14px}
.arcs svg{display:block;min-width:700px;width:100%;height:auto}
.arc{fill:none;stroke-width:2;opacity:.75}
.node{cursor:pointer}
.mrow{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--pencil-soft)}
.mrow .mn{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.mrow .mn i{width:10px;height:10px;border-radius:50%}
.mrow .refs{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.mrow{grid-template-columns:1fr;gap:4px}}
.work{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.work:first-child{border-top:0}
.work b{display:block}.work span{font-size:14px;color:var(--muted)}
.srcg .s{padding:12px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}
.srcg .s:first-child{border-top:0}
.srcg .s small{display:block;color:var(--muted);font-size:13px}
.dl .cmt{padding:14px 18px}.dl .cmt:first-of-type{padding-top:14px}

/* map of music */
.mapwrap{max-width:860px;margin:0 auto}
.motif-card{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:center}
@media (max-width:700px){.motif-card{grid-template-columns:1fr}}

  links:['I-1','I-61','III-40'],
  c:[C('Lena K.','Student',61,'I think of it as a cello section tuning in the dark, not a piano figure. Fingers stay on the keys, no accent on the first note.'),
     C('M. Hartl','Teacher',44,'Count the upbeat as two real beats. Students rush it because it looks like an ornament, and then the theme starts in the wrong place.',[C('Jonas W.','Student',9,'This fixed my entry. I was treating it as a pickup flourish.')]),
     C('Imported · comment under a live recording','Imported',23,'My teacher studied in Moscow and called this opening “the floorboards creaking”. It has stuck with me for twenty years.')]},
 {id:'I-1',mv:'I',from:1,to:3,title:'Theme 1, first phrase',sec:'First theme · antecedent 1',tags:['phrasing','metre','tempo'],
  a:'Theme 1 is built from two pairs of question-and-answer phrases (mm. 1–4, 4–7, 7–12, 12–17). Every phrase is made of two-beat slurs written against a 3/4 bar, so the metre is constantly blurred. The first cadence (mm. 3–4) puts its accent on the second-to-last chord, while the inner voice falls B♭–A♭–G.',
  src:['Cho 2023, pp. 19–21, 54–55'],
  ip:[IP('Sándor','recording, Vox 1993','Separates every phrase: ritenuto and diminuendo into each cadence, then a clear breath.'),
      IP('Berman','recording, Chandos 1998; book 2008','Hardly separates the phrases in sound, but his book asks for the cadences in mm. 4, 7, 12 and 17 to be finished smoothly.'),
      IP('Both','tempo','Play the movement at about ♩ = 88–90.','syn'),
      IP('Cho','synthesis','Keep the two-beat slurs legato, let the four phrases breathe, and make each one sound different.','syn')],
  links:['I-4','I-107','Q-phrasing'],
  c:[C('Sofia R.','Performer',52,'The two-beat slurs are a trap. If you lift after every slur it turns into hiccups. I play the slurs with the fingers and the phrase with the arm.'),
     C('Daniel P.','Student',31,'Listening to Sándor and Berman back to back is the best lesson for this bar. Same notes, a completely different idea of where the phrase ends.'),
     C('Ana T.','Musicologist',18,'The 2-against-3 writing prepares the hemiolas in the development (mm. 107–109), which Berman calls Brahmsian. You can hear the seed here.')]},
 {id:'I-4',mv:'I',from:4,to:6,title:'Theme 1, the answer',sec:'First theme · consequent 1',tags:['voicing','cadence'],
  a:'The same melody as the first phrase with a different ending. Now the accent falls on the last chord and the inner voice climbs A♯–B–C, so the cadence leans forward into the next phrase instead of settling.',
  src:['Cho 2023, p. 21'],ip:[IP('Cho','thesis','Make the difference audible: the first cadence sinks, the second lifts.','syn')],links:['I-1'],
  c:[C('M. Hartl','Teacher',27,'Play only the inner voice of mm. 3–4 and then of mm. 6–7. Falling, then rising. Then put the melody back on top.'),
     C('Felix B.','Student',6,'Is the accent on the last chord a real accent or just weight? In my edition it looks almost like a tenuto.')]},
 {id:'I-7',mv:'I',from:7,to:11,title:'Theme 1, second pair',sec:'First theme · antecedent 2',tags:['phrasing'],
  a:'The second question phrase stretches to five bars (mm. 7–12). The risk here is losing the long line: the two-beat slurs should never break the larger shape.',
  src:['Cho 2023, pp. 20, 55'],ip:[IP('Sándor','recording','A clear breath before m. 7.'),IP('Berman','recording','Lets m. 7 grow out of the previous cadence without a gap.')],links:['I-1','I-12'],
  c:[C('Lena K.','Student',12,'Colour-coding the four phrases, like Cho does in her Example 5.1, was the first thing that helped me memorise this page.')]},
 {id:'I-12',mv:'I',from:12,to:16,title:'Last phrase, poco rit. and the 4/4 bar',sec:'First theme · consequent 2',tags:['tempo','metre'],
  a:'The last phrase of the theme (mm. 12–17). Watch the written poco rit. and the a tempo pp right after it, and the single 4/4 bar (m. 16) that stretches the final cadence before the transition.',

  c:[C('Jonas W.','Student',14,'The 4/4 bar is the strangest moment on the page. One extra beat and the music seems to hold its breath.'),
     C('Sofia R.','Performer',9,'Don’t make the poco rit. too big. Prokofiev writes it and cancels it one bar later.')]},
 {id:'I-17',mv:'I',from:17,to:18,title:'Transition: the grace notes',sec:'Transition',tags:['ornaments','character'],
  a:'The transition combines three ideas: stepwise lines decorated with slurred grace notes, a two-note sigh turned upside down (the second note rises and takes the stress), and the oscillating sixteenths from the opening, now leaning on G.',
  src:['Cho 2023, pp. 21, 55–56','Sándor, On Piano Playing, p. 207'],
  ip:[IP('Sándor','edition 1967; book 1981','Slurred grace notes belong to the main note, so they go on the beat. His recording makes the transition dramatic.'),
      IP('Berman','book 2008','The slurred grace notes should be melodic. He plays the whole transition softly.'),
      IP('Cho','synthesis','Melodic, but let the sf and the articulation mark the change of character.','syn')],
  links:['Q-grace','I-19','I-37'],
  c:[C('Daniel P.','Student',38,'I tried Sándor’s on-the-beat grace notes and the passage suddenly sounded like Bartók. Makes sense, given who his teacher was.'),
     C('Ana T.','Musicologist',21,'Worth knowing: the rule “slurred = on the beat, unslurred = before the beat” comes from Sándor’s own book, not from Prokofiev.'),
     C('Mira S.','Student',4,'espress. and mp in m. 17 feel closer to Berman’s reading to me.')]},
 {id:'I-19',mv:'I',from:19,to:20,title:'The sf accents',sec:'Transition',tags:['dynamics','character'],
  a:'Two sf marks in a row (mm. 19 and 20, again in 25–26), inside an mp, espressivo passage. How hard should they be? Note also that the bass staff is empty here: the right hand alone carries the texture.',
  src:['Cho 2023, p. 56'],ip:[IP('Sándor','recording','Stresses the sf strongly, to set the transition apart from the gentle first theme.'),IP('Berman','recording','Keeps them inside a soft, melodic transition.')],
  links:['I-17','Q-grace'],
  c:[C('M. Hartl','Teacher',33,'An sf in mp is not an sf in f. Think of a sudden pang, not a hit.',[C('Daniel P.','Student',11,'I disagree a bit. Prokofiev wrote sf, not sfp. I think he wanted the shock.')])]},
 {id:'I-21',mv:'I',from:21,to:22,title:'Transition continues',sec:'Transition',tags:['tempo'],
  a:'Still no left hand. The sixteenth-note groups in the right hand begin to drive the music toward G, the dominant, where the oscillating figure of the opening returns.',
  src:['Cho 2023, p. 21'],ip:[],links:['I-up','I-37'],
  c:[C('Jonas W.','Student',7,'Without the left hand this is where it’s easiest to rush. I practise with the metronome on beats 2 and 3 only.')]},
 {id:'I-37',mv:'I',from:37,to:39,title:'Arriving in E-flat',sec:'Transition → second theme',tags:['tempo','harmony'],
  a:'The transition wanders through unstable keys before the second theme lands in E♭ major. Both pianists prepare the arrival.',
  src:['Cho 2023, pp. 21, 57'],ip:[IP('Sándor','recording','Slows down from m. 37 and plants the bass E♭ clearly.'),IP('Berman','recording; edition 2011','Calms tempo and dynamics and places the E♭ carefully.')],links:['I-40'],
  c:[C('Sofia R.','Performer',15,'The E♭ in the bass is the whole point. Everything before it should sound like searching.')]},
 {id:'I-40',mv:'I',from:40,to:60,title:'Second theme: two keys pulling',sec:'Second theme',tags:['harmony','ornaments','bitonality'],
  a:'Over an E♭ bass, the sweeping grace notes lead to D, so the music pulls between E♭ major and G minor at once. The chromatic left hand, marked il basso pesante, blurs the key further.',
  src:['Cho 2023, pp. 21, 56'],ip:[IP('Sándor','book 1981','These grace notes connect two notes and go before the beat.'),IP('Cho','synthesis','Relaxed fingers, attention in the fingertips, so the three or four grace notes sound even and brisk.','syn')],links:['I-37','I-162'],
  c:[C('Lena K.','Student',29,'Bitonal, but it shouldn’t sound “modern”. My teacher said: two memories playing at once.')]},
 {id:'I-61',mv:'I',from:61,to:70,title:'Closing section with a smirk',sec:'Closing',tags:['rhythm','humour'],
  a:'Ascending pairs of chords stress the third beat (rhythmic displacement). The left hand moves V–I while the right hand plays ii–V7 pairs. From m. 65 the opening murmur joins in. The final tonic chord gets a tiny neighbour grace note (D): a tongue-in-cheek ending.',
  src:['Cho 2023, p. 22'],ip:[],links:['I-up','I-194'],
  c:[C('Ana T.','Musicologist',19,'This is Prokofiev’s “scherzo-ish” line in miniature: a perfectly correct cadence with a smirk on it.')]},
 {id:'I-107',mv:'I',from:107,to:116,title:'Brahmsian hemiolas',sec:'Development B3',tags:['metre','voicing'],
  a:'Theme 1 appears twice in the left hand while the right hand plays its opening in hemiolas. In mm. 109–110 the transition idea sounds in both hands, the left hand crossing over the right.',
  src:['Cho 2023, p. 25','Berman 2008, p. 85'],ip:[IP('Berman','book 2008','Hears this passage as Brahmsian, because of the hemiolas.')],links:['I-1'],
  c:[C('Daniel P.','Student',17,'Play Brahms Op. 118 No. 1 the same week. You’ll hear exactly what Berman means.')]},
 {id:'I-117',mv:'I',from:117,to:125,title:'Three steps to the climax',sec:'Development C',tags:['dynamics','pedal point'],

 {id:'I-132',mv:'I',from:132,to:137,title:'Climax, silence, Neapolitan',sec:'Development C → recapitulation',tags:['silence','harmony'],

  c:[C('Sofia R.','Performer',41,'Count the silence. Every performer I admire holds it a little longer than written, but they all count it.')]},
 {id:'I-162',mv:'I',from:162,to:183,title:'Second theme, now in C major',sec:'Recapitulation',tags:['harmony','dynamics'],
  a:'The second theme returns in a clear C major, the grace notes now sweeping up to B, the leading tone. The dynamics are softer than in the exposition.',src:['Cho 2023, p. 28'],ip:[],links:['I-40'],c:[]},
 {id:'I-194',mv:'I',from:194,to:197,title:'An ironic last cadence',sec:'Closing',tags:['harmony','humour'],
  a:'A plain V–I with chromatic neighbour notes (C♯ and F♯) inside the chords. A dissonance in a consonant chord gives the ending an ironic edge.',src:['Cho 2023, p. 28'],ip:[],links:['I-61','III-222'],

 {id:'II-1',mv:'II',from:1,to:4,title:'Theme A: how to play the left-hand thirds',sec:'Theme A',tags:['articulation','pedal','orchestration'],
  a:'A dark theme in A minor rises slowly from the bass. Under it, repeated thirds climb a step every bar. There are no articulation or pedal marks, so every pianist has to decide how the thirds sound. The composer left two clues: his own recording, and his orchestral version.',
  src:['Cho 2023, pp. 29, 58–59','Berman 2008, pp. 94–95'],
  ip:[IP('Prokofiev','own recording, 1935','Detached and short, no pedal.','comp'),
      IP('Op. 29 bis','orchestral version, 1934','Bassoons and contrabassoon, tenuto over staccato; double basses pizzicato.','orch'),
      IP('Sándor','recording','Short and without pedal, but not staccatissimo.'),
      IP('Berman','recording; edition','Detached but a bit longer. His edition suggests short, shallow pedal.'),
      IP('Cho','synthesis','Longer than staccato, clearly detached. If you pedal, change on every eighth.','syn')],
  links:['Q-thirds','II-5','III-83','N-andante'],
  c:[C('M. Hartl','Teacher',72,'Before you decide on pedal, listen to Prokofiev’s own 1935 recording. It is completely dry, like bassoons. Then decide.'),
     C('Lena K.','Student',40,'Thinking “bassoons” changed my touch completely. Less finger, more weight, then release.'),
     C('Imported · comment under the composer’s recording','Imported',26,'He starts around ♩ = 48 and then moves the tempo from section to section. It sounds more like speech than a fixed pulse.'),
     C('Jonas W.','Student',5,'Shallow pedal on a dry Bösendorfer and on a big Steinway are two different things. Try both in the hall.')]},
 {id:'II-5',mv:'II',from:5,to:9,title:'Stretto',sec:'Theme A',tags:['counterpoint','voicing'],
  a:'Before the theme has finished, a second statement enters in the left hand (m. 5), moving against it in contrary motion. It passes to the right hand at the high D (m. 7), and a third, incomplete statement begins in m. 8: a fugal device inside a lyrical melody.',
  src:['Cho 2023, pp. 29–30'],ip:[],links:['II-1','II-25'],
  c:[C('Ana T.','Musicologist',24,'Mark each entry with a different coloured pencil. You need to know who has the theme at every moment.'),C('Mira S.','Student',6,'The hand-over at m. 7 is so hard to make seamless.')]},
 {id:'II-10',mv:'II',from:10,to:12,title:'First arrival',sec:'Theme A',tags:['harmony','dynamics'],
  a:'The stretto ends in a dissonant chord that resolves to a G major triad in m. 10, repeated in m. 12: the dominant of C major, the relative major. Note the ff > p inside a single bar.',
  src:['Cho 2023, p. 30'],ip:[],links:['II-5'],
  c:[C('Sofia R.','Performer',11,'ff > p within one bar. The decay matters more than the attack.')]},
 {id:'II-13',mv:'II',from:13,to:14,title:'Variation 1: four layers',sec:'Variation 1',tags:['texture','pedal','fingering'],
  a:'Four layers at once: the melody on top, broken-chord sixteenths in the alto, staccato leaping octaves in the tenor, and a half-note bass.',
  src:['Cho 2023, pp. 30–31, 59–60'],
  ip:[IP('Sándor & Berman','recordings','Both connect melody and bass with the pedal while keeping each voice’s articulation clear.'),
      IP('Berman','edition 2011','Fingering for the alto that keeps it even and quiet.'),
      IP('Cho','synthesis','Pedal on each half note of the bass, half-change on the alto’s last eighth; connect the melody with the fingers.','syn')],
  links:['II-15'],
  c:[C('M. Hartl','Teacher',35,'Practise soprano and bass alone until they sing. Then add the alto at a whisper. The tenor comes last.'),C('Felix B.','Student',9,'This is the bar where I finally understood what half pedal is for.')]},
 {id:'II-15',mv:'II',from:15,to:17,title:'Theme in the left-hand octaves',sec:'Variation 1',tags:['voicing','pedal'],

 {id:'II-22',mv:'II',from:22,to:23,title:'Climax: black keys against white',sec:'Variation 1',tags:['harmony'],
  a:'The tension peaks on D♭ major and bursts into D minor 9 (ii9 of C). Cho describes it as a contrast between black keys and white keys.',src:['Cho 2023, p. 32'],ip:[],links:['II-15'],c:[]},
 {id:'II-25',mv:'II',from:25,to:32,title:'Variation 2: a mirror',sec:'Variation 2',tags:['counterpoint','inversion'],

 {id:'II-33',mv:'II',from:33,to:35,title:'Quasi cadenza: the 12/8 question',sec:'Quasi cadenza',tags:['tempo','hand crossing'],
  a:'Forte octaves, trills, arpeggios and accented minor triads descending in the left hand. The metre suddenly changes to 12/8. How does the new pulse relate to the old one?',

      IP('Prokofiev','own recording, 1935','Slower and heavier: about ♩. = 46 here, against ♩ ≈ 72 just before.','comp'),

  links:['Q-cadenza','II-1'],

 {id:'II-36',mv:'II',from:36,to:38,title:'Bridge: two keys, very calm',sec:'Bridge',tags:['bitonality'],

 {id:'II-39',mv:'II',from:39,to:53,title:'Theme B: white keys, fairy tale',sec:'Theme B',tags:['tone','pedal'],

 {id:'II-71',mv:'II',from:71,to:80,title:'Themes A and B together',sec:'A + B combined',tags:['polymeter','pedal'],

 {id:'II-81',mv:'II',from:81,to:88,title:'Coda: A minor or A minor 7?',sec:'Coda',tags:['text question','voicing'],

  ip:[IP('Sándor','edition 1967','Last chord: A minor, no G. Rolls the chords slowly and lights up the C♯ in m. 86.'),

 {id:'III-1',mv:'III',from:1,to:1,title:'The opening flourish',sec:'A',tags:['gesture','history'],
  a:'A glissando-like run over almost three octaves, hands alternating. It recalls written-out improvisation in older keyboard music: Haydn’s Sonata Hob. XVI:50 (II), Mozart’s Fantasy K. 396, Bach’s Chromatic Fantasy BWV 903.',
  src:['Cho 2023, p. 41'],ip:[],links:['III-201','N-haydn'],
  c:[C('Sofia R.','Performer',34,'Curtain up. It’s not a scale, it’s a gesture. Practise it slowly with the arm only, then forget about the notes.'),C('Jonas W.','Student',12,'Hand alternation: I let the left hand start a hair early so the join never shows.')]},
 {id:'III-2',mv:'III',from:2,to:9,title:'Theme A: correct, with wrong notes',sec:'A · antecedent',tags:['harmony','fingering'],
  a:'A broken-chord accompaniment and a textbook I–N6–V–I progression, but appoggiaturas on the first beats produce “wrong notes”. In mm. 7–8 the wide arpeggios raise a fingering question.',

 {id:'III-10',mv:'III',from:10,to:17,title:'Alberti bass in tenths',sec:'A · consequent',tags:['technique','left hand'],

 {id:'III-25',mv:'III',from:25,to:39,title:'Bridge 1: a hidden pattern',sec:'Bridge 1',tags:['memory','harmony'],
  a:'The right hand’s groups of four rising sixteenths look irregular, but the first beats trace a whole-tone line (E–F♯–G♯–A♯–B♯–D…), every other arpeggio is a diminished chord, and the bass rises in major thirds (C–E–G♯). Knowing this makes the passage much easier to memorise.',

  c:[C('Lena K.','Student',49,'This one paragraph saved me a week of memory work. Exactly the kind of thing a teacher tells you once and you never forget.')]},

 {id:'III-43',mv:'III',from:43,to:66,title:'Theme B: uneasy',sec:'B',tags:['fingering','relaxation'],

 {id:'III-83',mv:'III',from:83,to:95,title:'Theme C: A-flat Lydian',sec:'C',tags:['tempo','tone','mode'],

 {id:'glance',t:'At a glance',body:`
   <div class="facts">

   <h3>Movements</h3>

    <li><span class="y">1947</span><span>${W('Sonata No. 9 in C major, Op. 103','Prokofiev Piano Sonata No.9')}</span></li></ol>`,src:'Cho 2023, ch. 1 and 4; IMSLP'},

 {id:'notebooks',t:'From old notebooks',body:`
   <p>The French subtitle, <i>d’après des vieux cahiers</i>, is literal. As a student at the St. Petersburg Conservatory, Prokofiev filled notebooks with sonatas and sketches. In 1917, already a recognised composer, he went back to them. Two finished works came out of that search: the one-movement ${W('Sonata No. 3, Op. 28','Prokofiev Piano Sonata No.3')}, built on a student sonata of 1907, and the three-movement Sonata No. 4, built on a student sonata of 1908 and on the slow movement of an abandoned ${W('Symphony in E minor','Prokofiev Symphony E minor 1908')} from the same year.</p>
   <p>He did the same thing in other works of these years, for example the ${W('Ballade for cello and piano, Op. 15','Prokofiev Ballade Op.15')}. Reworking old material was not a sign of running out of ideas. 1917 was one of the most productive years of his life, and the notebooks gave him themes he still believed in, which he now set with an adult technique.</p>
   <p>You can hear the student origins in the Classical frame: an exposition with two clear themes in the first movement, a stretto in the Andante, an Alberti bass in the finale. You can hear the 1917 composer in what happens inside that frame: the bitonal pull of the second theme (${B('I',40,'I · m. 40')}) and the “wrong notes” of the finale.</p>`,
   rel:[W('Sonata No. 3, Op. 28','Prokofiev Piano Sonata No.3'),W('Ballade, Op. 15','Prokofiev Ballade Op.15'),W('Sonata No. 1, Op. 1','Prokofiev Piano Sonata No.1')],src:'Cho 2023, pp. 18–19; Prokofiev, Autobiography, p. 27'},

 {id:'schmidthof',t:'Maximilian Schmidthof',body:`
   <p>The sonata is dedicated to the memory of Maximilian (Max) Schmidthof, Prokofiev’s closest friend at the Conservatory. They shared a taste for argument, philosophy and chess, and Schmidthof pushed Prokofiev’s reading in new directions.</p>
   <p>In April 1913 Schmidthof shot himself in a forest in Finland. Before he died he sent Prokofiev a farewell letter. The loss stayed with Prokofiev for years. He dedicated four works to Schmidthof:</p>
   <ol class="tl">
    <li><span class="y">1912</span><span>${W('Sonata No. 2 in D minor, Op. 14','Prokofiev Piano Sonata No.2')}, written while his friend was alive</span></li>
    <li><span class="y">1913</span><span>One of the ${W('Ten Pieces, Op. 12','Prokofiev 10 Pieces Op.12')}</span></li>
    <li><span class="y">1913</span><span>${W('Piano Concerto No. 2 in G minor, Op. 16','Prokofiev Piano Concerto No.2')}, to his memory</span></li>
    <li><span class="y">1917</span><span>Sonata No. 4, to his memory</span></li></ol>
   <p>This helps explain why the first two movements are so dark and inward compared with the Third and Seventh sonatas. The Andante in particular, with its low, slow theme rising out of the bass, is often heard as an elegy.</p>`,
   rel:[W('Piano Concerto No. 2, Op. 16','Prokofiev Piano Concerto No.2'),W('Sonata No. 2, Op. 14','Prokofiev Piano Sonata No.2')],src:'Cho 2023, p. 18; Robinson 2002; Wikipedia articles on Op. 14 and Op. 16'},

 {id:'y1917',t:'1917: the year around the sonata',body:`
   <p>Prokofiev wrote Sonata No. 4 in the year of two revolutions, in February and October 1917. While Petrograd was in turmoil, he wrote some of his best-known music:</p>
   <ol class="tl">
    <li><span class="y">1916–17</span><span>${W('Symphony No. 1 “Classical”, Op. 25','Prokofiev Symphony No.1')}: Haydn’s manner in a modern voice, the same Classical line heard in this sonata’s finale</span></li>
    <li><span class="y">1915–17</span><span>${W('Visions fugitives, Op. 22','Prokofiev Visions fugitives')}: twenty miniatures</span></li>
    <li><span class="y">1917</span><span>${W('Violin Concerto No. 1, Op. 19','Prokofiev Violin Concerto No.1')}</span></li>
    <li><span class="y">1917</span><span>${W('Sonata No. 3, Op. 28','Prokofiev Piano Sonata No.3')} and Sonata No. 4, Op. 29</span></li>
    <li><span class="y">1917</span><span>Cantata ${W('Seven, They Are Seven, Op. 30','Prokofiev Seven They Are Seven')}</span></li>
    <li><span class="y">1917</span><span>First sketches of ${W('Piano Concerto No. 3, Op. 26','Prokofiev Piano Concerto No.3')}</span></li></ol>
   <p>Next to the Classical Symphony, the Fourth Sonata shows the other side of that year: the same respect for Classical form, but turned inward.</p>`,
   rel:[W('Classical Symphony, Op. 25','Prokofiev Symphony No.1'),W('Visions fugitives, Op. 22','Prokofiev Visions fugitives'),W('Violin Concerto No. 1, Op. 19','Prokofiev Violin Concerto No.1')],src:'Boosey & Hawkes biography; Robinson 2002'},

 {id:'premiere',t:'Premiere and departure, April 1918',body:`
   <p>Prokofiev played the first performance himself in Petrograd on 17 April 1918. In the same weeks the Classical Symphony was premiered there under his baton. Shortly afterwards he left for Moscow and took the Trans-Siberian railway east, through Japan to the United States. He expected to be away for a few months. He stayed abroad for about nine years and settled in the Soviet Union for good only in 1936.</p>
   <p>The sonata therefore belongs to the last music he presented in Russia before emigrating. A. Gutheil published it in 1918. The copy used on this site carries a 1921 Breitkopf &amp; Härtel copyright line and is edited by F. H. Schneider.</p>
   <ol class="tl">
    <li><span class="y">17.4.1918</span><span>Premiere of Sonata No. 4, Petrograd</span></li>
    <li><span class="y">April 1918</span><span>Premiere of the ${W('Classical Symphony','Prokofiev Symphony No.1')}, Petrograd</span></li>
    <li><span class="y">May 1918</span><span>Leaves via Siberia and Japan for the USA</span></li>
    <li><span class="y">1936</span><span>Returns to the Soviet Union for good</span></li></ol>`,
   rel:[W('Classical Symphony, Op. 25','Prokofiev Symphony No.1')],src:'Cho 2023, p. 18; Symphony No. 1 histories'},

 {id:'andante',t:'The Andante’s double life',body:`
   <p>The slow movement began as orchestral music. In a diary entry of April 1917, Prokofiev describes looking for a new Andante for the sonata, failing to find a lost manuscript, and then remembering the Andante of his E-minor Symphony. He thought it would work on the piano too, and doubted the symphony itself would ever be revived.</p>
   <p>In 1934 he turned the movement back into orchestral music, published as ${W('Andante for orchestra, Op. 29 bis','Prokofiev Andante Op.29bis')}. A year later, in 1935, he recorded the piano version himself. These two documents are the strongest evidence we have for how he heard the movement:</p>
   <ol class="tl">
    <li><span class="y">Op. 29 bis</span><span>The repeated left-hand thirds go to bassoons (tenuto-staccato) and pizzicato basses ${B('II',1,'II · m. 1')}. In the Quasi cadenza the quarter note of 4/4 equals the dotted quarter of 12/8 ${B('II',33,'II · m. 33')}.</span></li>
    <li><span class="y">1935</span><span>Prokofiev plays the thirds short and dry, starts around ♩ = 48, takes the 12/8 slower than his own orchestral score, and plays the final chord as A minor 7 ${B('II',81,'II · m. 81')}.</span></li></ol>
   <p>A pianist working on this movement can therefore compare the score, the composer’s orchestration and the composer’s own playing. They do not always agree. See the Interpretations window.</p>`,
   rel:[W('Andante, Op. 29 bis','Prokofiev Andante Op.29bis'),W('Symphony in E minor (1908)','Prokofiev Symphony E minor')],src:'Cho 2023, pp. 18, 58–65; Berman 2008, pp. 94–97'},

 {id:'lines',t:'Prokofiev’s five lines',body:`
   <p>In his autobiography Prokofiev described his music through five “lines”. All five meet in this sonata.</p>
   <div class="lines5">
    <div><b>Classical</b><p>Forms, textures and cadences of Haydn, Mozart and Beethoven, whose sonatas his mother played to him. Here: sonata form in I, stretto in II ${B('II',5,'II · m. 5')}, sonata-rondo and Alberti bass in III ${B('III',10,'III · m. 10')}. Compare ${W('Classical Symphony','Prokofiev Symphony No.1')}.</p></div>
    <div><b>Modern</b><p>Bitonality, abrupt modulations, “wrong notes”. Here: E♭ major against G minor ${B('I',40,'I · m. 40')}, D minor over G major ${B('II',36,'II · m. 36')}, appoggiaturas on the beat ${B('III',2,'III · m. 2')}. Compare ${W('Sarcasms, Op. 17','Prokofiev Sarcasms')}.</p></div>
    <div><b>Toccata</b><p>Motoric repeated patterns, inspired by ${W('Schumann’s Toccata, Op. 7','Schumann Toccata Op.7')}. Here: the precipitato second bridge of the finale ${B('III',153,'III · m. 153')}. Compare ${W('Toccata, Op. 11','Prokofiev Toccata Op.11')} and ${W('Suggestion diabolique, Op. 4 No. 4','Prokofiev 4 Pieces Op.4')}.</p></div>
    <div><b>Lyrical</b><p>Long contemplative melodies, or simple naive ones. Here: both themes of the Andante ${B('II',39,'II · m. 39')} and theme C of the finale ${B('III',83,'III · m. 83')}. Compare the first theme of ${W('Sonata No. 8, Op. 84','Prokofiev Piano Sonata No.8')}.</p></div>
    <div><b>Scherzo-ish</b><p>Prokofiev disliked the word “grotesque” and preferred whimsy, laughter, mockery. Here: the smirking cadence ${B('I',61,'I · m. 61')}, the stuttering last bars ${B('III',222,'III · m. 222')}.</p></div></div>`,

   <p>Among the nine sonatas, No. 4 is one of the least played. The Third and Seventh dominate concert programmes, and the three “War Sonatas” (Nos. 6–8) have received most of the scholarly attention. The Fourth, with the Fifth and Ninth, has been comparatively neglected.</p>
   <p>Yet critics and performers have rated it highly. In 1948 the English pianist Frank Merrick counted Prokofiev’s sonatas among “true sonatas” in the line of Haydn, Mozart and Beethoven. Harlow Robinson notes that the work is less exhibitionistic than Prokofiev’s other piano music. Some consider it the masterpiece of the nine.</p>

/* ---------- 8 statistics ---------- */
function monoPath(P){ /* monotone cubic through points, no overshoot */
  const n=P.length,dx=[],dy=[],m=[],s=[];
  for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];dy[i]=P[i+1][1]-P[i][1];s[i]=dy[i]/dx[i]}
  m[0]=s[0];m[n-1]=s[n-2];
  for(let i=1;i<n-1;i++){m[i]=s[i-1]*s[i]<=0?0:(s[i-1]+s[i])/2}
  for(let i=0;i<n-1;i++){if(s[i]===0){m[i]=m[i+1]=0}else{const a=m[i]/s[i],b=m[i+1]/s[i],h=a*a+b*b;if(h>9){const k=3/Math.sqrt(h);m[i]=k*a*s[i];m[i+1]=k*b*s[i]}}}
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=` C${P[i][0]+h},${P[i][1]+m[i]*h} ${P[i+1][0]-h},${P[i+1][1]-m[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`}
  return d;
}
function statsView(){
  const order=['ppp','pp','p','mp','mf','f','ff'];
  const cnt=Object.fromEntries(order.map(k=>[k,DYN.filter(d=>d[0]===k).length]));
  const max=Math.max(...order.map(k=>cnt[k])),min=Math.min(...order.map(k=>cnt[k]));
  const most=order.filter(k=>cnt[k]===max)[0],least=order.filter(k=>cnt[k]===min)[0];
  const Wd=1000,H=230,pad=40,k=(Wd-2*pad)/TOTAL.I,X=b=>pad+b*k,Y=l=>190-l*26;
  /* level in force at every bar, then a gentle smoothing so the curve shows the overall shape */
  const lv=[];let cur=LEVEL.pp;for(let b=0;b<=TOTAL.I;b++){const ds=DYN.filter(d=>d[1]===b&&d[0]!=='sf');if(ds.length)cur=LEVEL[ds.at(-1)[0]];lv.push(cur)}
  const sig=2.5,sm=lv.map((_,b)=>{let s=0,w=0;for(let j=-8;j<=8;j++){const q=b+j;if(q<0||q>TOTAL.I)continue;const g=Math.exp(-(j*j)/(2*sig*sig));s+=lv[q]*g;w+=g}return s/w});
  const pts=sm.filter((_,b)=>b%2===0||b===TOTAL.I).map((l,i,arr)=>{const b=Math.min(i*2,TOTAL.I);return [X(b),Y(l)]});
  const line=monoPath(pts);
  let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Dynamic level across the movement">`;
  order.forEach((d,i)=>{s+=`<text x="${pad-10}" y="${Y(i)+4}" text-anchor="end" font-size="13" fill="var(--muted)" font-family="var(--f-display)" font-style="italic">${d}</text><line x1="${pad}" x2="${Wd-pad}" y1="${Y(i)}" y2="${Y(i)}" stroke="var(--line)" stroke-width="1"/>`});
  FORMS.I.groups.forEach(g=>{s+=`<text x="${X(g[1])}" y="${H-6}" font-size="12" fill="var(--muted)" font-family="var(--f-body)">${g[0]}</text>`});
  s+=`<path d="${line} L${X(TOTAL.I)},${Y(0)+6} L${pts[0][0]},${Y(0)+6} Z" fill="var(--pencil-soft)"/><path d="${line}" fill="none" stroke="var(--pencil)" stroke-width="3" stroke-linecap="round"/>`;
  s+='</svg>';
  return `<div class="view"><div class="vh"><h1>Statistics</h1></div>
   <div class="kpis kpi3">
     <div><span>Most common dynamic</span><b><i>${most}</i></b><small>${cnt[most]} times</small></div>
     <div><span>Least common dynamic</span><b><i>${least}</i></b><small>${cnt[least]} time, ${one(162)}</small></div>
     <div><span>Most common note</span><b>G</b><small>example value</small></div>
   </div>
   <div class="sec-title">Dynamic level, bar by bar</div>
   <div class="card"><div class="arcs">${s}</div></div></div>`;
}

/* ---------- example 2: three pieces linked by one bass line (Rosen, Music and Sentiment, pp. 24–25) ---------- */
const XP={
 cha:{comp:'J. S. Bach',t:'Chaconne',al:'bach chaconne',
  ctx:'Rosen quotes the opening of Bach’s Chaconne as an example of a bass that descends from the tonic to the dominant. A short repeating bass like this was a useful formula for serious music, and it survived for a long time.'},
 bee:{comp:'Ludwig van Beethoven',t:'Variations in C minor',al:'beethoven variations c minor',
  ctx:'Rosen quotes the theme of the Variations in C minor as another case of the same formula: serious, in the minor mode, over a bass that falls chromatically from the tonic to the dominant.'},
 sch:{comp:'Franz Schubert',t:'Sonata in C minor',al:'schubert sonata c minor',
  ctx:'Here the chromatic descent is in the tenor: C, B♭, A natural, A♭, G. Rosen suggests Schubert may have been thinking of the rhythm of Beethoven’s Variations in C minor, but adds that the motif was enough of a cliché that he could have found it elsewhere.'}
};
const CHAIN=['cha','bee','sch'];
const CHAIN_LINKS={'cha>bee':'the same formula','bee>sch':'perhaps the same rhythm'};
function findX(n){
  const toks=n.split(/[^a-z0-9]+/).filter(t=>t.length>=4&&!['minor','major','sonata','variations','sonate'].includes(t));
  if(!toks.length) return [];
  return CHAIN.filter(id=>{const words=XP[id].al.split(' ');return toks.some(t=>words.some(w=>w===t||w.startsWith(t)||lev(t,w)<=2))});
}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function formulaSvg(){
  const names=['C','B','B♭','A','A♭','G'], steps=[3,2,2,1,1,0], xs=[60,100,140,180,220,260];
  let s=`<svg viewBox="0 0 290 100" role="img" aria-label="A bass falling by semitones from C to G">`;
  for(let i=0;i<5;i++) s+=`<line x1="10" x2="285" y1="${16+i*10}" y2="${16+i*10}" stroke="var(--muted)" stroke-width="1"/>`;
  s+=`<text x="14" y="40" font-size="30" fill="var(--ink)" font-family="serif">𝄢</text>`;
  xs.forEach((x,i)=>{const y=56-steps[i]*5;
    if(names[i].includes('♭')) s+=`<text x="${x-17}" y="${y+5}" font-size="16" fill="var(--ink)" font-family="serif">♭</text>`;
    if(y>=56) s+=`<line x1="${x-10}" x2="${x+10}" y1="66" y2="66" stroke="var(--muted)"/>`;
    s+=`<ellipse cx="${x}" cy="${y}" rx="6.5" ry="5" transform="rotate(-20 ${x} ${y})" fill="var(--ink)"/><text x="${x}" y="92" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--f-mono)">${names[i]}</text>`});
  return s+'</svg>';
}

"loc":"pp. 103-124 (via Ravel d'après Ravel, p. 12)","bars":null,"type":"fact/claim","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L091","claim":"LH syncopation mm. 34-37; LH quarters mm. 43-47; m. 38 upbeat neighbours; top notes of mm. 38, 39, 41; honour the B in mm. 76-77.","source":"light1983","loc":"pp. 103-124","bars":"34-47, 76-77","type":"advice","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L092","claim":"Yvonne Lefébure played it to Ravel with a light staccato over the pedal; Ravel: 'That's it.'","source":"howat2009","loc":"p. 225","bars":null,"type":"fact (reported)","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L093","claim":"Perlemuter: Ravel wanted the opening theme 'souple et lié', hand light, fingers close to the keys.","source":"anppom2023","loc":"citing Perlemuter & Jourdan-Morhange 1970, p. 11","bars":"1-8","type":"advice (reported)","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L094","claim":"Perlemuter studied all of Ravel's piano music with him in 1927; Jeux d'eau was his first.","source":"perlemuter","loc":"pp. 5-6 (snippet)","bars":null,"type":"fact","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L095","claim":"Many pianists slow the final arpeggio 'as if the water were draining away'; Ravel wanted the end reached through shading, like a question mark.","source":"perlemuter","loc":"p. 7 (snippet)","bars":"84-85","type":"advice (reported)","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L096","claim":"Tharaud: m. 17 take the note with the LH thumb; m. 22 beat 2 take e with the RH; m. 54 beats 1-2 include the g in the LH chord.","source":"baerenreiter_southon","loc":"performance notes","bars":"17, 22, 54","type":"advice","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L097","claim":"Pedal devices: half and quarter pedals, the long pedal (jusqu'à la fin), a vibrating pedal that keeps basses and clears the treble; una corda wherever indicated.","source":"pavel2016","loc":"p. 83","bars":null,"type":"advice","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L098","claim":"m. 48 fermata with alternating cluster chords is the only real 'rest' in the piece.","source":"anppom2023","loc":"p. 4","bars":"48","type":"interpretation","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L099","claim":"Influence: Ravel's String Quartet, Shéhérazade, Miroirs, Gaspard; Ireland 'The Scarlet Ceremonies'; Griffes 'The Fountain of the Acqua Paola'; Debussy's Estampes.","source":"light1983","loc":"ch. II","bars":null,"type":"interpretation","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L100","claim":"Jardins sous la pluie (Debussy, Estampes) followed in 1903.","source":"perlemuter","loc":"p. 6 (snippet)","bars":null,"type":"fact","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L101","claim":"Main construction principle throughout: 'duplication' (immediate repetition of a short unit, then a 'totalization' that sums it up), a term from Ruwet and Țăranu; Fodor calls it a basic style element of Impressionism.","source":"fodor2022","loc":"p. 282 and n. 14","bars":"1-6","type":"interpretation","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L102","claim":"Opening: E-G#-B-D#-F# alternates with A-C#-E-G# (ninth missing), under the tetratonic C#-D#-F#-G# with E as pien note.","source":"fodor2022","loc":"p. 282","bars":"1-2","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L103","claim":"m. 4 repeats by sequence rather than duplication, each step in a different (elliptical hexatonic) tone system.","source":"fodor2022","loc":"p. 283","bars":"3-4","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L104","claim":"The bridge from m. 9 presents a free but audible inversion of theme A, duplicated and totalized in m. 10.","source":"fodor2022","loc":"p. 283","bars":"9-10","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L105","claim":"mm. 11-14: duplication turns into progressively faster fragmentation; harmony changes every two beats, then every beat.","source":"fodor2022","loc":"pp. 284-285","bars":"11-14","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L106","claim":"mm. 15-16: hidden two-part invertible counterpoint; the planes swap register in m. 16.","source":"fodor2022","loc":"p. 285","bars":"15-16","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L107","claim":"Theme B is tetratonic (C#-D#-F#-G#) over a B major 7/9 background with added sixth (G#) and fourth (E); in m. 22 the tetrachord drops a tone (B-C#-E-F#), together forming anhemitonic pentatony.","source":"fodor2022","loc":"pp. 286-287","bars":"19-23","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L108","claim":"Non-retrogradable rhythms (in Messiaen's sense) in the left hand of mm. 19-20 and in m. 22.","source":"fodor2022","loc":"pp. 287-288","bars":"19-22","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L109","claim":"Development in four stages: 24-28, 29-37, 38-50, 51-61.","source":"fodor2022","loc":"pp. 289-296","bars":"24-61","type":"structure","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L110","claim":"mm. 29-30 return a perfect fourth lower in mm. 31-32 ('a duplication of the duplication'); 33-34 are likewise duplicated in 35-36.","source":"fodor2022","loc":"pp. 290-292","bars":"29-36","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L111","claim":"The rapid ascending 32nd-note run at the end of m. 37, built on symmetrical structures, closes the second development stage in a quasi-improvised way.","source":"fodor2022","loc":"p. 292","bars":"37","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L112","claim":"From m. 44 a bitonal element enters (C#-E-G-A#-B# against Fx-A#-C#-E#), driving sequences at m. 45 and an ostinato of four chromatically rising chords in mm. 46-47.","source":"fodor2022","loc":"p. 293","bars":"44-47","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L113","claim":"mm. 48-49 act as a totalization in near-rubato rhythm: an anhemitonic pentatonic layer over a chromatic bass and a diminished-seventh sonority, preparing the bitonality of the last stage.","source":"fodor2022","loc":"pp. 292-294","bars":"48-49","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L114","claim":"mm. 53-55 use pole/antipole (axis) relations that Fodor sees as foreshadowing Bartók's axis system.","source":"fodor2022","loc":"pp. 294-295","bars":"53-55","type":"interpretation","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L115","claim":"mm. 60-61 combine three planes in different rhythms: G# pedal point, six-four chords, and parallel root-position chords.","source":"fodor2022","loc":"p. 296","bars":"60-61","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L116","claim":"Recapitulation from m. 62; mm. 67-69 feel metrically free; mm. 70-71 are a giusto 'rhythm island' with an F#/C pole-antipole ('acoustic bitonality').","source":"fodor2022","loc":"pp. 297-298","bars":"62-71","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L117","claim":"The cadenza (m. 72) uses only two chords, F#-A#-C# and C-E-G, in five formulas repeated 5, 1, 3, 8 and 2 times: a deliberate asymmetry that sounds improvised.","source":"fodor2022","loc":"pp. 298-300","bars":"72","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L118","claim":"mm. 73-74 and 75-76 are a duplicated pair; the held chord recalls mm. 29-30, so the recapitulation continues the development.","source":"fodor2022","loc":"p. 300","bars":"73-76","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L119","claim":"Theme B returns over a repetitive background (Fodor: m. 79, music example labelled m. 78), with independent sound planes from m. 81. Fodor's coda is 'm. 83-86' although the piece has 85 bars, so his late bar numbers may be off by one.","source":"fodor2022","loc":"pp. 300-301","bars":"78-81","type":"analysis","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L120","claim":"No real final cadence: the piece ends on the axis E-G#-B-D# prolonged by piano resonance.","source":"fodor2022","loc":"p. 301","bars":"83-85","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L121","claim":"Cortot called the piece 'cette poésie liquide' (Cortot 1932, p. 30).","source":"fodor2022","loc":"p. 280 n. 12","bars":null,"type":"fact","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L122","claim":"Ravel's 1905 Prix de Rome fugue, 'like Jeux d'eau', ended on a major-seventh chord (Orenstein, A Ravel Reader, p. 67).","source":"fodor2022","loc":"p. 281 n. 13","bars":"85","type":"fact","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L123","claim":"Saint-Saëns reportedly called the piece a cacophony (reported via Ivry 2000, p. 31; secondary).","source":"fodor2022","loc":"p. 301 n. 20","bars":null,"type":"fact","origin":"literature","confidence":"low","teacher":null,"bars_confidence":null},{"id":"L124","claim":"Form table: exposition A 1-18 and B 19-37; development 'C (third theme)' 38-50 and B 51-61; recapitulation A 62-72 and B 73-85. Differs from Light 1983 (departure 24-61).","source":"park2012","loc":"p. 36, Table 3","bars":"1-85","type":"structure","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L125","claim":"m. 6: sudden rapid arpeggio on a whole-tone scale ('rushing flow').","source":"park2012","loc":"pp. 43-44","bars":"5-7","type":"analysis","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L126","claim":"m. 19: the pentatonic second theme is in the left hand, with right-hand parallel seconds under una corda.","source":"park2012","loc":"pp. 44-45","bars":"19-20","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L127","claim":"m. 38: a 'third theme' in the left hand against contrary-motion right-hand arpeggios forming an ambiguous eleventh chord.","source":"park2012","loc":"p. 45","bars":"38-39","type":"interpretation","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L128","claim":"m. 51: the varied second theme in parallel fourths over an A#/D polychord; compares Liszt, Villa d'Este mm. 158-160.","source":"park2012","loc":"pp. 35, 46","bars":"51","type":"analysis","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L129","claim":"mm. 27-28: staccatissimo open fifths leaping by octaves, then falling with the ritardando at the end of m. 28.","source":"park2012","loc":"pp. 49-50","bars":"27-28","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L130","claim":"mm. 62-65: theme A returns over a repeated G# pedal point, which drops an octave in mm. 64-65.","source":"park2012","loc":"pp. 47-48","bars":"62-65","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L131","claim":"m. 80: low open-fifth pedal (A-E) under pentatonic middle-voice melody and treble arpeggios.","source":"park2012","loc":"pp. 46, 48","bars":"80","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L132","claim":"Tremolo occurs twice, m. 26 and m. 48; m. 48 adds the descending glissando over almost the whole keyboard.","source":"park2012","loc":"pp. 51-52","bars":"26, 48","type":"fact","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L133","claim":"Damper pedal is marked to be held for long spans, at the end for about eight bars regardless of harmony; Park cites mm. 77-84 (the Schott print has 'Ped. jusqu'à la fin' from m. 81).","source":"park2012","loc":"p. 50","bars":"77-85","type":"fact","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L134","claim":"Ending: a pentatonic E-major arpeggio up and down the keyboard, closing on a tonic major-seventh chord with D# on top.","source":"park2012","loc":"pp. 58-59","bars":"84-85","type":"analysis","origin":"literature","confidence":"high","teacher":null,"bars_confidence":null},{"id":"L135","claim":"Ravel wanted the opening 'not too fast but without dragging', 'melodic but not sentimental'; it is 'often played quite articulated'; the theme is 'cheerful and gentle, not brisk' (Perlemuter's advice, quoted via Buga).","source":"buga2011","loc":"pp. 25-27 (citing Perlemuter & Jourdan-Morhange 1988)","bars":"1-6","type":"advice","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L136","claim":"Keep the fingers close to the keys and the hand light, turning quickly with each change of arpeggio direction, to get the 'très doux' without dragging.","source":"buga2011","loc":"p. 26","bars":"1","type":"advice","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L137","claim":"The thumb notes at each harmony change (D# then C#) form a hidden quasi-melodic line; play them with a slightly upright thumb and a more direct, 'glassy' touch rather than a silky one.","source":"buga2011","loc":"pp. 27-28","bars":"1","type":"advice","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L138","claim":"Avoid a dry crescendo toward the top of the rising arpeggios; shape instead, for an even, legato start.","source":"buga2011","loc":"p. 27","bars":"1-2","type":"advice","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L139","claim":"The E major and subdominant arpeggios of the opening can share one pedal without changing, since the upper-register mixture does not blur; adapt to the instrument.","source":"buga2011","loc":"p. 28","bars":"1-2","type":"advice","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L140","claim":"Both hands carry equal technical weight: the left hand's double fifths and sixths are as demanding as the right hand's arpeggios.","source":"buga2011","loc":"pp. 26-27","bars":"1-6","type":"advice","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L141","claim":"First theme: the thumb line D#→C# inside the right-hand ninth arpeggios is the theme itself.","source":"kikuchi_blog2009","loc":"§2","bars":"1","type":"analysis","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L142","claim":"Second theme moves to the left hand (C#→D#); the right-hand pianissimo seconds are harp-like writing, very hard to play exactly together.","source":"kikuchi_blog2009","loc":"§2","bars":"19-20","type":"analysis","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L143","claim":"mm. 36-38: the G# chord of m. 36 is lowered to G in m. 37 so that m. 38 can move by tritone to C#; an inserted passage smooths the Liszt-like augmented-fourth move. Turning point of the development.","source":"kikuchi_blog2009","loc":"§3","bars":"36-38","type":"analysis","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"L144","claim":"Do not slow down when the second theme first appears; keep the exposition tempo through all its harder later returns so the difficulty does not show.","source":"kikuchi_blog2009","loc":"§4","bars":"19-23","type":"advice","origin":"literature","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"M001","claim":"Play very lightly; know the weight of the piano's action.","source":"mc_pressler1992","loc":"video 7:08","bars":"1","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"stated"},{"id":"M002","claim":"First play the broken chords as solid chords to hear the harmony; then roll them only slightly, 'as if together', and in the direction Ravel marks.","source":"mc_pressler1992","loc":"video 9:07","bars":"1-8","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"stated"},{"id":"M003","claim":"If you hit a key it 'bites'; caress the key to soften the attack.","source":"mc_pressler1992","loc":"video 16:22","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":null},{"id":"M004","claim":"A swell is not a forte: feel the richness of the harmony without getting loud.","source":"mc_pressler1992","loc":"video 19:51","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":null},{"id":"M005","claim":"Where the figure passes between hands it must continue without a break.","source":"mc_pressler1992","loc":"video 29:40","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":null},{"id":"M006","claim":"The writing is 'by a pianist for the piano': the passage lies under the hand, it is not actually difficult.","source":"mc_pressler1992","loc":"video 36:04","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":null},{"id":"M007","claim":"In Q&A: not convinced Jeux d'eau influenced Debussy; calls Liszt's Villa d'Este its 'father' and finds later Debussy far more intricate.","source":"mc_pressler1992","loc":"video 38:38","bars":null,"type":"opinion","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":null},{"id":"M008","claim":"Brilliant but played 'like Liszt'; it should trickle like water (quotes the epigraph, 'c'est Versailles'): drops of water, not runs.","source":"mc_lefebure1976","loc":"video 0:08","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Yvonne Lefébure","bars_confidence":null},{"id":"M009","claim":"Do not play legato; the slurs are musical phrasing, not a touch instruction. Says she asked Ravel himself about the slurs.","source":"mc_lefebure1976","loc":"video 0:42","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Yvonne Lefébure","bars_confidence":null},{"id":"M010","claim":"Pedal 'vibrato' with Ravel (and Debussy): keep the foot in contact and only partly lift, so basses keep sounding while the upper notes are cleared.","source":"mc_lefebure1976","loc":"video 1:16","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Yvonne Lefébure","bars_confidence":null},{"id":"M011","claim":"Accents as discreet as possible.","source":"mc_lefebure1976","loc":"video 1:50","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Yvonne Lefébure","bars_confidence":null},{"id":"M012","claim":"A Ravel forte is not a fortissimo.","source":"mc_lefebure1976","loc":"video 2:26","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Yvonne Lefébure","bars_confidence":null},{"id":"M013","claim":"Left hand not legato; lift the hand barely, like drops; 'not too fast, do not tie'.","source":"mc_lefebure1976","loc":"video 3:02","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Yvonne Lefébure","bars_confidence":null},{"id":"M014","claim":"Not too loud; the atmosphere of a miracle, every fountain is a miracle.","source":"mc_voskresensky","loc":"video 0:07","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":null},{"id":"M015","claim":"Una corda use depends on piano and hall: in this room it made the sound grey, on a big concert grand keep it. The music must stay bright.","source":"mc_voskresensky","loc":"video 0:55","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":null},{"id":"M016","claim":"Ravel wrote where the pedals go but not where to change; change with the harmony and listen for 'dirt'.","source":"mc_voskresensky","loc":"video 2:50","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":null},{"id":"M017","claim":"A fountain always changes colour and image; be precise.","source":"mc_voskresensky","loc":"video 3:33","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":null},{"id":"M018","claim":"Even fortissimo is an image of water, never a heavy forte (heavy is stones).","source":"mc_voskresensky","loc":"video 4:51","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":null},{"id":"M019","claim":"Wait a little before changing the pedal so the harmony change is clean.","source":"mc_voskresensky","loc":"video 6:10","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":null},{"id":"M020","claim":"Portato with pedal differs from semi-staccato; distinguish the touches.","source":"mc_voskresensky","loc":"video 6:50","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":null},{"id":"M021","claim":"At the pianissimo subito wait a hair for the new harmony; do not change tempo, only show the new harmony.","source":"mc_voskresensky","loc":"video 8:12","bars":"24","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Mikhail Voskresensky","bars_confidence":"approx"},{"id":"M022","claim":"The four repetitions grow: start with flat fingers, each time slightly higher on the fingers with more weight.","source":"mc_korepanova","loc":"video 0:04","bars":"44-47","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Asiya Korepanova","bars_confidence":"approx"},{"id":"M023","claim":"Two-hand tremolo: land flat on the G-sharp; think of it as a trill between the thumbs; extensions let it be faster and heavier without fatigue.","source":"mc_korepanova","loc":"video 0:47","bars":"48","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Asiya Korepanova","bars_confidence":"stated"},{"id":"M024","claim":"Black-key glissando: fingers together, nails forward, so weight can be applied without skinning the fingers.","source":"mc_korepanova","loc":"video 1:26","bars":"48","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Asiya Korepanova","bars_confidence":"stated"},{"id":"M025","claim":"In this register connect lyrically with the fingers rather than relying on the pedal.","source":"mc_korepanova","loc":"video 2:49","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Asiya Korepanova","bars_confidence":null},{"id":"M026","claim":"Grow to forte and die back very soft; keep the una corda where it begins: Ravel states exactly where to release it ('3 Cordes').","source":"mc_korepanova","loc":"video 3:39","bars":"61-62","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Asiya Korepanova","bars_confidence":"stated"},{"id":"M027","claim":"The reprise is a 'mock recapitulation': it does not restate everything but leads to a quiet climax and straight into the cadenza and coda.","source":"mc_korepanova","loc":"video 4:17","bars":"62-72","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Asiya Korepanova","bars_confidence":"stated"},{"id":"M028","claim":"Everything is built on three main themes; later sections derive from them.","source":"mc_korepanova","loc":"video 5:28","bars":null,"type":"interpretation","origin":"human (teacher, from a
