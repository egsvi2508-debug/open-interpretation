uto-captions)","confidence":"medium (auto-captions)","teacher":"Asiya Korepanova","bars_confidence":null},{"id":"M029","claim":"The piece 'has suffered from tradition': rubato, slowing here and speeding there, ignored dynamics. Go back to the text as written; that is what makes it magical.","source":"mc_cassard","loc":"video 6:15","bars":null,"type":"opinion","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":null},{"id":"M030","claim":"♪=144 shows how Ravel imagined the flow; 138-148 is fine, but the student was much too slow and not pianissimo enough.","source":"mc_cassard","loc":"video 6:48","bars":"1","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"stated"},{"id":"M031","claim":"The first 12 bars are all pianissimo with no other dynamic, only small accents and portato.","source":"mc_cassard","loc":"video 7:25","bars":"1-12","type":"fact-check","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"stated"},{"id":"M032","claim":"The devices are Lisztian (arpeggios, independent hands, tremolos, alternating hands); the expression and musical idea are not. Calls Ravel a greater admirer of Liszt than of Debussy.","source":"mc_cassard","loc":"video 8:00","bars":null,"type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":null},{"id":"M033","claim":"The opening pages are scenery: no people, no sentiment. Find the colour, true pianissimo, even, no slowing.","source":"mc_cassard","loc":"video 8:35","bars":"1-18","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"stated"},{"id":"M034","claim":"Ravel writes only 'Très doux', ♪=144, pp and the two pedals; he never asks to 'sing' or for molto legato.","source":"mc_cassard","loc":"video 9:43","bars":"1","type":"fact-check","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"stated"},{"id":"M035","claim":"With the right tempo no accelerando is needed; where Ravel writes a diminuendo, the diminuendo itself makes the tempo feel slower, so do not add a ralentando.","source":"mc_cassard","loc":"video 11:26","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":null},{"id":"M036","claim":"The little 'rapide' runs go at once, without taking time.","source":"mc_cassard","loc":"video 12:37","bars":"18","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"stated"},{"id":"M037","claim":"When Ravel writes '3 Cordes' the mute is off and the melody may sing: the song should surge up as a surprise, served by the gliding left-hand chords.","source":"mc_cassard","loc":"video 13:12","bars":"19-21","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"stated"},{"id":"M038","claim":"Never a melody with accompaniment: keep everything mobile, never static, heavy or loud.","source":"mc_cassard","loc":"video 14:21","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":null},{"id":"M039","claim":"Use a vibrating (partial) pedal for changes so the harmonies keep their richness.","source":"mc_cassard","loc":"video 16:39","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":null},{"id":"M040","claim":"Left thumb too heavy; play on the tip, very sensitively.","source":"mc_cassard","loc":"video 17:10","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":null},{"id":"M041","claim":"The melody forms out of the droplets like a hidden picture in a dot puzzle; then it becomes 'flute and oboe' and can take a little more freedom.","source":"mc_cassard","loc":"video 20:16","bars":"29-30","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"approx"},{"id":"M042","claim":"A whole bar stays pianissimo; the crescendo starts late and is extremely short, 'lightning'; give the tremolo its full four beats.","source":"mc_cassard","loc":"video 23:43","bars":"24-26","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"approx"},{"id":"M043","claim":"The descending harmonies are evocative in themselves; diminish like light dimming, without adding a slowdown.","source":"mc_cassard","loc":"video 26:27","bars":"29-30","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Philippe Cassard","bars_confidence":"approx"},{"id":"M044","claim":"Some passages are rushed; not too fast overall, but certain passages hurry.","source":"mc_sebastiani1982","loc":"video 5:47","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":null},{"id":"M045","claim":"Some notes must ring out like a bell.","source":"mc_sebastiani1982","loc":"video 6:22","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":null},{"id":"M046","claim":"It is not a toccata; avoid dry gaps when changing the pedal.","source":"mc_sebastiani1982","loc":"video 7:28","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":null},{"id":"M047","claim":"In rotating figures with a trill-like middle, think of a trill: technically much easier to position.","source":"mc_sebastiani1982","loc":"video 8:38","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":null},{"id":"M048","claim":"Think horizontally; feel the left-hand figure in groups of two even under a long slur.","source":"mc_sebastiani1982","loc":"video 9:13","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":null},{"id":"M049","claim":"High in the piano, fill the sound with resonance; the transition was too dry.","source":"mc_sebastiani1982","loc":"video 10:26","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":null},{"id":"M050","claim":"Hand slightly diagonal, thumb not escaping; use the lateral wrist hinge.","source":"mc_sebastiani1982","loc":"video 11:45","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":null},{"id":"M051","claim":"The climax is 'a kind of water madness', not one Roman fountain but many small fountains at once.","source":"mc_sebastiani1982","loc":"video 13:15","bars":"48","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":"approx"},{"id":"M052","claim":"From ppp to fff there are six steps, so a given point is already forte and the next fortissimo: go without fear.","source":"mc_sebastiani1982","loc":"video 14:27","bars":"71-72","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Pía Sebastiani","bars_confidence":"approx"},{"id":"M053","claim":"Analyses the fast treble passage over a held F-sharp bass: the left-hand 'cluster' notes are chromatic neighbour tones resolving into right-hand chord tones, giving chains of half-diminished seventh chords a minor third apart (C, A, F-sharp, D-sharp).","source":"mc_akiya","loc":"video 1:49","bars":"72?","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Hidetoshi Akiya (秋谷秀俊)","bars_confidence":"low"},{"id":"M054","claim":"In theory one pedal cannot hold it all cleanly.","source":"mc_akiya","loc":"video 5:54","bars":"72?","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Hidetoshi Akiya (秋谷秀俊)","bars_confidence":"stated"},{"id":"M055","claim":"Play slowly enough that the pattern can be heard instead of a 'circus' speed; jazz chord thinking makes such passages easier to understand.","source":"mc_akiya","loc":"video 12:07","bars":"72?","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Hidetoshi Akiya (秋谷秀俊)","bars_confidence":"stated"},{"id":"M056","claim":"Many editions exist; recommends Roger Nichols' Peters edition for its corrections and notes, and advises comparing editions.","source":"mc_mok","loc":"video 7:05","bars":null,"type":"context","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M057","claim":"Points to a Japanese edition by Junko Okazaki, a Perlemuter student, that records Perlemuter's instructions, including detailed (half/quarter) pedal markings.","source":"mc_mok","loc":"video 8:49","bars":null,"type":"context","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M058","claim":"Perlemuter's rule: never slow down 'when you feel like it'; Ravel wrote everything as he wanted it.","source":"mc_mok","loc":"video 9:55","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M059","claim":"A tiny breath between sections is acceptable, without changing tempo.","source":"mc_mok","loc":"video 11:03","bars":"1-18","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M060","claim":"Describe the fountain from outside (admiring, at a distance) rather than being in the water; less sentimental, more objective.","source":"mc_mok","loc":"video 13:16","bars":null,"type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M061","claim":"Shows an 'all thumbs' fingering she says came from Ravel via Perlemuter (passage not identifiable from captions).","source":"mc_mok","loc":"video 17:26","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M062","claim":"At 'a tempo' (m. 29) match the opening tempo exactly; do not speed up.","source":"mc_mok","loc":"video 19:04","bars":"29","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M063","claim":"Sees a sonata-like main and second theme; play the second theme's marked diminuendi with care, 'like a treasured teacup'.","source":"mc_mok","loc":"video 20:17","bars":"19-23","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M064","claim":"The Latona fountain at Versailles throws delicate droplets, not heavy volumes; pedal depth should match the 'volume of water'.","source":"mc_mok","loc":"video 22:45","bars":null,"type":"context","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M065","claim":"Personal tip: pedal with the area between big toe and second toe for finer control.","source":"mc_mok","loc":"video 24:27","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M066","claim":"Make the left hand primary at the opening; the right hand is the water 'tripping around' it.","source":"mc_mok","loc":"video 25:31","bars":"1-8","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M067","claim":"In the development Ravel gives a new dynamic starting level every two bars (p, mp, f, ...): terrace the dynamics, do not crescendo continuously, no added accelerando.","source":"mc_mok","loc":"video 29:38","bars":"38-46","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M068","claim":"After the climax, no diminuendo until Ravel writes one.","source":"mc_mok","loc":"video 32:07","bars":"48-50","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M069","claim":"Use the una corda here with shallow damper pedal: the fountain is down to a trickle; let the pedal clear.","source":"mc_mok","loc":"video 32:43","bars":"51","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M070","claim":"Cadenza: follow Ravel's exact dynamic chain (cresc. to fff, mf to f, mf dim. to p) and let pedal depth follow the volume.","source":"mc_mok","loc":"video 38:31","bars":"72","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M071","claim":"Perlemuter's ending: lift hands and pedal together so the sound disappears with them.","source":"mc_mok","loc":"video 41:57","bars":"85","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":"stated"},{"id":"M072","claim":"Contrasts Ravel's water pieces: Une barque (a boat about to capsize), Ondine (you are in the water), Jeux d'eau (you stand and describe).","source":"mc_mok","loc":"video 44:25","bars":null,"type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M073","claim":"Una corda is a colour device, not a way to play softer; Perlemuter (a Cortot pupil) demanded legato without pedal.","source":"mc_mok","loc":"video 45:31","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Gwendolyn Mok (student of Vlado Perlemuter)","bars_confidence":null},{"id":"M074","claim":"Use a shaking (flutter) pedal to keep a halo over the notes instead of full changes.","source":"mc_naoumoff","loc":"video 5:56","bars":"1","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Emile Naoumoff","bars_confidence":"stated"},{"id":"M075","claim":"Hears the opening as two triads combined, E major and G-sharp minor: 'sweet, then bitter' as they clash and blend (the major-seventh sonority E-G#-B-D#).","source":"mc_naoumoff","loc":"video 8:19","bars":"1","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Emile Naoumoff","bars_confidence":"stated"},{"id":"M076","claim":"In a large hall do not play too soft from the start; Ravel's pp was conceived for intimate rooms.","source":"mc_naoumoff","loc":"video 12:19","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Emile Naoumoff","bars_confidence":null},{"id":"M077","claim":"Ravel's notation of 32nds versus sextuplets is precise and should be differentiated.","source":"mc_naoumoff","loc":"video 15:54","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Emile Naoumoff","bars_confidence":null},{"id":"M078","claim":"Cites Ravel's reported dictum that he wanted to be played, not interpreted.","source":"mc_naoumoff","loc":"video 19:14","bars":null,"type":"context","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Emile Naoumoff","bars_confidence":null},{"id":"M079","claim":"Names the chord at the end of the second line an augmented (German) sixth.","source":"mc_naoumoff","loc":"video 20:24","bars":"6","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Emile Naoumoff","bars_confidence":"approx"},{"id":"M080","claim":"Discusses the lowest written note standing in for a pitch missing from the keyboard.","source":"mc_naoumoff","loc":"video 44:38","bars":"49-50","type":"context","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Emile Naoumoff","bars_confidence":"approx"},{"id":"M081","claim":"The harmony rests mainly on ninth chords, which the teacher calls Ravel's great harmonic novelty.","source":"mc_spl","loc":"video ①3:07","bars":"1-8","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M082","claim":"Let the highest notes be luminous without insisting; the light comes from the treble, not the middle register.","source":"mc_spl","loc":"video ①3:39","bars":"1-8","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M083","claim":"Practise slowly, enjoying the resonance of the ninth chords.","source":"mc_spl","loc":"video ①4:15","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":null},{"id":"M084","claim":"Where a figure needs a little time, stretch the preceding eighths slightly rather than lengthening the last note.","source":"mc_spl","loc":"video ①6:07","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":null},{"id":"M085","claim":"Here the right hand comments on the left hand rather than the reverse.","source":"mc_spl","loc":"video ①6:40","bars":"19-23","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"approx"},{"id":"M086","claim":"When the texture animates (more water), do not accelerate or get nervous; keep the tempo.","source":"mc_spl","loc":"video ①7:13","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":null},{"id":"M087","claim":"The crescendo must be fed from inside by the 32nd-note figuration.","source":"mc_spl","loc":"video ①10:12","bars":"44-47","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"approx"},{"id":"M088","claim":"Make dynamic changes more subito; no ralentando: 'you cannot stop the water'.","source":"mc_spl","loc":"video ①11:55","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":null},{"id":"M089","claim":"Keep the pulse; do not slow down every two or four bars.","source":"mc_spl","loc":"video ①15:45","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":null},{"id":"M090","claim":"Articulation always clear, like a violinist's left hand; the wrist acts as the bow, free, with lateral motions to place each note.","source":"mc_spl","loc":"video ②0:28","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":null},{"id":"M091","claim":"The overall colour is sunny (fountains in a natural setting), with brief nostalgic moments.","source":"mc_spl","loc":"video ②1:01","bars":null,"type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":null},{"id":"M092","claim":"Do not start the accelerando too early; early accelerando thins the notes, and the passage lives on density.","source":"mc_spl","loc":"video ②2:08","bars":"44-45","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M093","claim":"The climax is the most intense point; do not be afraid of it.","source":"mc_spl","loc":"video ②2:48","bars":"48","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M094","claim":"After the huge cascade the music turns calmer and nostalgic.","source":"mc_spl","loc":"video ②3:23","bars":"51","type":"interpretation","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M095","claim":"Ravel's few pedal indications must really be observed.","source":"mc_spl","loc":"video ②3:55","bars":"51-60","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M096","claim":"'Cédez légèrement' is very little: small inflections only.","source":"mc_spl","loc":"video ②5:36","bars":"61","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M097","claim":"'Un peu plus lent' is only a little slower, because the truly expressive 'Lent' follows; do not become sentimental too early.","source":"mc_spl","loc":"video ②8:42","bars":"73-75","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M098","claim":"When Ravel wants a ralenti he writes it; slowing down does not create expression, colour does; be restrained yet intense, with full chords.","source":"mc_spl","loc":"video ②10:05","bars":"75","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M099","claim":"Give the long held note enough intensity at the start so it can stay suspended for its full length.","source":"mc_spl","loc":"video ②12:20","bars":"76-77","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"approx"},{"id":"M100","claim":"The 'rapide' starts at once, with no run-up.","source":"mc_spl","loc":"video ②13:47","bars":"77","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M101","claim":"No slowing at the end; even in pianissimo keep some tempo, 'little bells in the distance'; love the resonance.","source":"mc_spl","loc":"video ②16:16","bars":"84-85","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"(NHK Super Piano Lesson; teacher name to verify, see metadata)","bars_confidence":"stated"},{"id":"M102","claim":"Presents the piece as Ravel's answer to Liszt's Jeux d'eau à la Villa d'Este; calls it the first truly 'impressionist' piano piece while disliking the label.","source":"mc_thibaudet","loc":"video 6:09","bars":null,"type":"context","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":null},{"id":"M103","claim":"Wants far more dynamic gradations (pp, p, even softer) and more colours.","source":"mc_thibaudet","loc":"video 6:43","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":null},{"id":"M104","claim":"Play Ravel simply, without rubato: everything is written out (ritardandi are marked, rhythmic freedom is notated as triplets etc.); compares the classicism to Mozart.","source":"mc_thibaudet","loc":"video 7:17","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":null},{"id":"M105","claim":"Opening tempo should flow; the student's slower start was too slow. '2 Ped.' means the left (una corda) pedal; Ravel is imprecise about the right pedal, so change it by half or hold it longer instead of changing constantly.","source":"mc_thibaudet","loc":"video 8:58","bars":"1","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"stated"},{"id":"M106","claim":"Bring out Ravel's small accents like little bells.","source":"mc_thibaudet","loc":"video 10:34","bars":"1-8","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"stated"},{"id":"M107","claim":"At '2 Ped.' put the una corda down at once for a new sound and hold the damper through the bar.","source":"mc_thibaudet","loc":"video 11:56","bars":"16","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"approx"},{"id":"M108","claim":"Left-hand accented notes singing, never heavy.","source":"mc_thibaudet","loc":"video 13:51","bars":"19-23","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"approx"},{"id":"M109","claim":"Do not take time or make a ritardando before the new phrase.","source":"mc_thibaudet","loc":"video 16:30","bars":"28-29","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"approx"},{"id":"M110","claim":"Make the forte then the piano subito really sudden.","source":"mc_thibaudet","loc":"video 21:10","bars":"24","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"approx"},{"id":"M111","claim":"Use less pedal in chromatic passages or the texture blurs.","source":"mc_thibaudet","loc":"video 22:28","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":null},{"id":"M112","claim":"Hear the G-sharp ostinato as the structural thread; a sudden small motion 'like water moving'.","source":"mc_thibaudet","loc":"video 23:47","bars":"51-61","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"stated"},{"id":"M113","claim":"The rallentando must land exactly in the new (first) tempo, not under it.","source":"mc_thibaudet","loc":"video 28:49","bars":"61-62","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"stated"},{"id":"M114","claim":"This is the slowest point of the piece; notes Ravel's accent placement on a particular note.","source":"mc_thibaudet","loc":"video 30:47","bars":"75","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"approx"},{"id":"M115","claim":"In the light fast passage the effect matters more than every note: 'rather one note missing than perfect'; as light as possible.","source":"mc_thibaudet","loc":"video 32:10","bars":"72","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"approx"},{"id":"M116","claim":"The left-hand melody sings like a cello; leave the pedal down.","source":"mc_thibaudet","loc":"video 33:27","bars":"80-81","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"approx"},{"id":"M117","claim":"Ending: like circles on water growing and disappearing; no stopping, same pedal to the end, long final sound.","source":"mc_thibaudet","loc":"video 35:24","bars":"82-85","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Jean-Yves Thibaudet","bars_confidence":"stated"},{"id":"M118","claim":"The opening tempo was a little too fast: the shimmering sound was right, but some notes could not come out at that speed.","source":"mc_pressler1994","loc":"video 5:59","bars":"1","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"stated"},{"id":"M119","claim":"Feel which bars belong together in pairs; in this language 'the comma is in an unexpected place', so the phrasing must show where each group breaks.","source":"mc_pressler1994","loc":"video 7:29","bars":"1-8","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M120","claim":"Groups of four notes that go down must really get softer as they go down.","source":"mc_pressler1994","loc":"video 9:18","bars":"1-2","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M121","claim":"Practise the arpeggios as chords, slowly, until you know and hear every chord; the second chord is softer than the first. 'You are playing the most sensitive piece, so you can't be insensitive when you play those chords.'","source":"mc_pressler1994","loc":"video 13:13","bars":"1-8","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M122","claim":"For the big leaps, if the stretch is uncomfortable use the same finger and jump; practise slowly so the eyes learn which note you are jumping to.","source":"mc_pressler1994","loc":"video 19:19","bars":"25-26","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M123","claim":"fff is the loudest point of the piece; play the descent like a glissando, then keep going down to the softest sound.","source":"mc_pressler1994","loc":"video 21:02","bars":"48","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M124","claim":"Keep the arm loose and light; a stiff arm spoils the sound.","source":"mc_pressler1994","loc":"video 25:10","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":null},{"id":"M125","claim":"'A tempo, pianissimo': return to tempo and pp at once.","source":"mc_pressler1994","loc":"video 27:25","bars":"29","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M126","claim":"The same figure appears at the top, an octave lower and two octaves lower; give a little less sound each time it comes down.","source":"mc_pressler1994","loc":"video 30:33","bars":"34","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M127","claim":"At the end get softer each time, so the last one barely touches the keys; then hold.","source":"mc_pressler1994","loc":"video 40:18","bars":"84-85","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":"approx"},{"id":"M128","claim":"Summing up: the reason to play the piece is the beauty of its chords. Practise as slowly as possible, build a chord out of every arpeggio and repeat it until it is part of your hearing; speed comes easily, hearing the chords does not.","source":"mc_pressler1994","loc":"video 42:38","bars":null,"type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"Menahem Pressler","bars_confidence":null},{"id":"M129","claim":"The opening chord is the tonic of E major with an added major seventh and ninth: Ravel's 'stylish' water sound.","source":"mc_segawa","loc":"video 3:48","bars":"1","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M130","claim":"Do not hold the damper through the opening: Klaus Schilde (pupil of Marguerite Long) taught him to change pedal with the harmony, I (E maj7) to IV (A maj7).","source":"mc_segawa","loc":"video 5:18","bars":"1-2","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M131","claim":"Make a slight crescendo toward the subdominant (A maj7) chords; bar 3 begins on IV and has more lift. A subdominant on an off-beat should not be stressed.","source":"mc_segawa","loc":"video 10:03","bars":"1-3","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M132","claim":"From bar 4 almost everything is a dominant-type chord: C augmented 7/9, C#7(b5) with 13th; bright (+9) and dark (-9) dominants alternate. He notes the common view that Ravel favours dominants, Debussy subdominants.","source":"mc_segawa","loc":"video 16:24","bars":"4-6","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M133","claim":"Bar 6 uses the whole-tone scale; heard as an augmented dominant seventh.","source":"mc_segawa","loc":"video 25:53","bars":"6","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M134","claim":"The tonic passages could even be played without pedal; in any case better not to hold the pedal throughout.","source":"mc_segawa","loc":"video 30:24","bars":"7-8","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M135","claim":"From bar 9 the music moves to the relative C# minor (II7 = D# half-diminished); open fifths without a third give an 'Asian' colour, and a Neapolitan D major alternates with the C# minor tonic while the left hand clashes against it.","source":"mc_segawa","loc":"video 31:21","bars":"9-14","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M136","claim":"In theme B the right-hand melody runs in parallel fifths and octaves independent of the harmony; it reminds him of a Japanese children's song, with a gamelan-like flavour.","source":"mc_segawa","loc":"video 47:39","bars":"19-23","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M137","claim":"Reads the motto (a river god laughing as the water tickles him) into the passage after theme B: the god is tickled and 'screams'.","source":"mc_segawa","loc":"video 49:28","bars":"24-26","type":"context","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"approx"},{"id":"M138","claim":"A chain of dominant 7/9 chords leads to E-flat (D#) major 7 at bars 27-28; from bar 29 the music changes completely.","source":"mc_segawa","loc":"video 52:02","bars":"23-28","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M139","claim":"Bars 29-31: parallel dominant 7/+9/13 chords descend (C#7, B7, A7, G#7, then G7, F#7, E7) to an A# major tonic: a dominant a semitone below, the tonic a semitone above. Feel the tension of the chained dominants.","source":"mc_segawa","loc":"video 59:26","bars":"29-33","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M140","claim":"E7(+9) with clashing non-chord tones, then a long fifth to the A# tonic at bars 33-34.","source":"mc_segawa","loc":"video 65:55","bars":"33-34","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M141","claim":"Ravel's accents here mark appoggiaturas (semitone clashes against the chord, II7 of F# minor over A#). Feel these clashing appoggiaturas: 'this is the secret of playing Ravel well', as taught by Schilde in the Marguerite Long line. Bar 37 lands on G major.","source":"mc_segawa","loc":"video 68:14","bars":"35-37","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M142","claim":"From bar 38: C#7(-9) in a minor-key, uneasy colour; dominant and subdominant (II7) alternate. Play the note under the head of each slur lightly and small.","source":"mc_segawa","loc":"video 76:35","bars":"38-42","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"approx"},{"id":"M143","claim":"From bar 43 nearly every chord is a half-diminished II7 of a different minor key, each with clashing added tones.","source":"mc_segawa","loc":"video 84:52","bars":"43-47","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M144","claim":"Bar 51 starts the third part of the middle section: bright G#7(+9, 11, 13), the dominant of C# major, over a long G# dominant pedal (Orgelpunkt): 'crazy and genius'.","source":"mc_segawa","loc":"video 93:39","bars":"51-61","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M145","claim":"Bar 56 has an E chord with both the major and the minor third at once: a grotesque sound worth noticing.","source":"mc_segawa","loc":"video 100:46","bars":"56","type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M146","claim":"At the recapitulation (bar 62) the bass is in long half notes, so keep the pedal down, unlike the opening where it changes with the harmony; the G# bass leaves major and minor ambiguous, and this dominant feeling is crucial.","source":"mc_segawa","loc":"video 111:02","bars":"62-63","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M147","claim":"At the end, do not replay tied notes; treat the last voice as a separate voice; do not slow down.","source":"mc_segawa","loc":"video 119:40","bars":"84-85","type":"advice","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":"stated"},{"id":"M148","claim":"Summary: Ravel uses the three basic functions (tonic, dominant, subdominant) in an extremely complex way; knowing which chord you are on changes how it feels to play.","source":"mc_segawa","loc":"video 121:08","bars":null,"type":"analysis","origin":"human (teacher, from auto-captions)","confidence":"medium (auto-captions)","teacher":"瀬川玄 (Gen Segawa), pianist; pupil of Klaus Schilde, himself a pupil of Marguerite Long","bars_confidence":null},{"id":"C001","claim":"34 of 85 bars (40%) are under a pp or ppp marking (dynamics carried forward, hairpins ignored), plus the cadenza starting ppp. Light's 'half of the measures' is an overstatement by this count.","source":"schott","loc":"data/bars_verified.json","bars":null,"type":"data","origin":"computed","confidence":"high (counting rule stated)","teacher":null,"bars_confidence":null},{"id":"C002","claim":"22 time-signature changes by my count (2/4, 1/4, 3/4 and 4/4 bars), not counting the unbarred cadenza; Lewis gives 21.","source":"schott","loc":"data/bars_verified.json","bars":null,"type":"data","origin":"computed","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C003","claim":"Pitch-class weight over the whole piece (duration-weighted): G# 14.7%, C# 13.0%, E 11.6%, F# 10.0%, A 9.6%, B 9.2%. G#, not E, is the most present pitch class, matching the literature's 'G# as tonic surrogate'.","source":"atepp_score","loc":"data/score_stats.json","bars":null,"type":"data","origin":"computed","confidence":"medium (depends on MusicXML accuracy)","teacher":null,"bars_confidence":null},{"id":"C004","claim":"Scale collections per bar agree with the literature at m. 1 (E major, E-G#-B-D# major 7th), mm. 15-18 (pentatonic), mm. 26-28 (E-flat major 7th), mm. 70-72 (octatonic C/C#) and m. 85 (E major 7th).","source":"atepp_score","loc":"data/score_stats.json","bars":"1, 15-18, 26-28, 70-72, 85","type":"interpretation","origin":"computed (AI)","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C005","claim":"mm. 33-43 and the G# section mm. 51-56, 60-61 fit an octatonic collection (fit 0.80-1.00). The literature describes tritone cadences (32-35) and a 'third material' (38), but does not name octatonicism there: a possible addition to check by ear and score.","source":"atepp_score","loc":"data/score_stats.json","bars":"33-43, 51-56, 60-61","type":"interpretation","origin":"computed (AI)","confidence":"low-medium (needs human check)","teacher":null,"bars_confidence":null},{"id":"C006","claim":"m. 73 is a literal transposition of m. 29 up 8 semitones (note match 1.0); m. 74 a varied transposition of m. 30. This confirms Light's 'second-theme variant returns at m. 73' and pins its exact source: the m. 29 theme.","source":"atepp_score","loc":"data/internal_links.json","bars":"29, 73, 30, 74","type":"data","origin":"computed","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C007","claim":"mm. 62-64 vary mm. 1-3 note for note (note match 0.55-0.65, same pitch level), confirming m. 62 as the reprise of the opening over the new G# bass.","source":"atepp_score","loc":"data/internal_links.json","bars":"1-3, 62-64","type":"data","origin":"computed","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C008","claim":"x-x-y phrase plan in the development: m. 39 repeats m. 38 literally; m. 41 transposes mm. 38-39 down a fourth (-5); m. 42 transposes m. 40 down a fourth (match 0.98); m. 45 is m. 44 down a tone; m. 47 varies m. 46.","source":"atepp_score","loc":"data/internal_links.json","bars":"38-47","type":"data","origin":"computed","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C009","claim":"The G#-pedal section repeats itself a whole tone lower: mm. 51-55 return as mm. 56-59 (-2 semitones; m. 55 to m. 59 match 0.83).","source":"atepp_score","loc":"data/internal_links.json","bars":"51-59","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C010","claim":"m. 78-79 share the pitch collection of the second theme at mm. 19-20 (cosine 0.97+), and m. 83 repeats m. 82 literally.","source":"atepp_score","loc":"data/internal_links.json","bars":"19-20, 78-79, 82-83","type":"data","origin":"computed","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C011","claim":"Main tempo (mm. 2-11) in 13 distinct recordings: eighth = 132-204. Chamayou 133, Argerich 135 (1960), Tharaud 140, Grimaud 147 and Arrau 150 sit near Ravel's 144; Casadesus 169, Gieseking 171-204 and Richter 180-194 are 17-41% faster. Gieseking's 2020 remaster (10700, 4:02) runs 10% shorter than his other two files; whether it is another recording or a speed-shifted transfer is not known.","source":"atepp2022","loc":"data/performance_summary.json","bars":"2-11","type":"data","origin":"computed","confidence":"medium (automatic transcription + alignment)","teacher":null,"bars_confidence":null},{"id":"C012","claim":"All 8 pianists play the first bar slower than the following bars (median 0.84 of their tempo).","source":"atepp2022","loc":"checks","bars":"1","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C013","claim":"m. 29 'a tempo': all 8 pianists stay well below their opening tempo (median 0.72); bars 29-33 are the largest unmarked slowing in the piece. Mok asks for exactly the opening tempo here (M062).","source":"atepp2022","loc":"checks; unmarked_slowings","bars":"29-33","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C014","claim":"m. 61 'cédez légèrement' (yield slightly): median 0.66 of the previous bars' tempo, Chamayou and Tharaud 0.44. The NHK lesson asks for 'very little' (M096); Thibaudet wants the rallentando to land exactly in the first tempo (M113).","source":"atepp2022","loc":"checks","bars":"61","type":"data","origin":"computed","confidence":"medium (Argerich's bar flagged by the aligner)","teacher":null,"bars_confidence":null},{"id":"C015","claim":"m. 62 '1er Mouvement': 7 of 8 pianists do not return to their opening tempo (median 0.82).","source":"atepp2022","loc":"checks","bars":"62","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C016","claim":"m. 73 'Un peu plus lent qu'au début' (a little slower) is played about 40% slower than the opening (median 0.59); m. 75 'Lent' at 0.39.","source":"atepp2022","loc":"checks","bars":"73, 75","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C017","claim":"m. 84 'sans ralentir': 6 of 8 pianists keep the tempo of mm. 81-83 (median 0.99); Grimaud and Arrau slow by about 20%. The last bar cannot be measured.","source":"atepp2022","loc":"checks","bars":"84","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C018","claim":"Unmarked slowings (median pianist at least 12% under main tempo, no marking): mm. 1, 6, 23, 29-31, 33, 49, 62-64, 66, 71. m. 6 matches Howat/Casadesus' warning that the end of bar 6 'must not audibly slow'.","source":"atepp2022","loc":"unmarked_slowings","bars":"1, 6, 23, 29-31, 33, 49, 62-64, 66, 71","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C019","claim":"The accelerando (mm. 44-45) takes pianists to about 1.47x the tempo of mm. 38-41 by m. 46.","source":"atepp2022","loc":"checks","bars":"44-46","type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C020","claim":"Written dynamics vs performed MIDI velocity correlate only moderately (r = 0.62): pp bars median velocity 54, p 59, ff 72, fff 71. Pianists compress Ravel's range; fff is no louder than ff in the transcriptions.","source":"atepp2022","loc":"dynamics_vs_velocity","bars":null,"type":"data","origin":"computed","confidence":"low-medium (transcribed velocities)","teacher":null,"bars_confidence":null},{"id":"C021","claim":"Transcribed soft-pedal (CC67) data show no consistent link to Ravel's una corda markings (median 0 in both marked and unmarked bars): unusable as evidence.","source":"atepp2022","loc":"soft_pedal_test","bars":null,"type":"data quality","origin":"computed","confidence":"high (negative result)","teacher":null,"bars_confidence":null},{"id":"C022","claim":"Transcribed damper pedal is down almost the whole time from the climax onward (0.99 at mm. 26, 48, 49; 0.99-1.0 at mm. 80-82), but drops to 0-0.14 in mm. 83-85 against Ravel's 'Ped. jusqu'à la fin'. This is probably a transcription artefact; unverified.","source":"atepp2022","loc":"bars.damper_frac_median","bars":"80-85","type":"data quality","origin":"computed","confidence":"low","teacher":null,"bars_confidence":null},{"id":"C023","claim":"Tempo shapes are broadly shared: correlations between pianists 0.60-0.84 (closest Grimaud and Richter; furthest Tharaud and Arrau).","source":"atepp2022","loc":"pianist_tempo_shape_similarity","bars":null,"type":"data","origin":"computed","confidence":"medium","teacher":null,"bars_confidence":null},{"id":"C024","claim":"155 recordings linked in MusicBrainz (107 artist credits as written; some are one pianist in two scripts, e.g. Gilels / Гилельс). Median length 5:31 (146 with plausible length, range 3:55-6:48). The older ATEPP recordings (Gieseking, Richter, Casadesus, about 4:20-4:30) are much faster than this median.","source":"musicbrainz","loc":"raw/musicbrainz_recordings.json","bars":null,"type":"data","origin":"computed","confidence":"medium (reissues counted)","teacher":null,"bars_confidence":null},{"id":"C025","claim":"Wikidata gives 'opus number 30': 30 is the Marnat catalogue number (M. 30), not an opus number. Its premiere date is also only the year 1902 (correct: 5 April 1902). Data error to report.","source":"wikidata","loc":"Q1684076","bars":null,"type":"data quality","origin":"computed","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C026","claim":"The ATEPP MusicXML splits the unbarred cadenza (m. 72) into four measures (ATEPP 72-75) and uses Italian translations of Ravel's French markings; it lacks the m. 51 '1 Corde' (as Light says Demets does) and puts the una corda at m. 19 instead of m. 16.","source":"atepp_score","loc":"musicxml_cleaned.musicxml","bars":"16, 19, 51, 72","type":"fact (edition comparison)","origin":"computed","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C027","claim":"The ATEPP score's highest note is B7 (m. 68), its lowest A0 (mm. 49, 55, 59). Check B7 against the print before relying on it.","source":"atepp_score","loc":"score_stats.json","bars":"49, 55, 59, 68","type":"data","origin":"computed","confidence":"low-medium","teacher":null,"bars_confidence":null},{"id":"C028","claim":"Teachers disagree on touch: Lefébure (1976) says do not play legato, Ravel's slurs are phrasing only; Perlemuter reports Ravel wanted the opening 'souple et lié' with fingers close to the keys. Howat reports Ravel approving Lefébure's light staccato over the pedal.","source":"mc_lefebure1976","loc":"0:42; anppom2023 (Perlemuter 1970 p. 11); howat2009 p. 225","bars":"1-8","type":"interpretation (conflict)","origin":"synthesis (AI) of human sources","confidence":"high","teacher":null,"bars_confidence":null},{"id":"C029","claim":"Six teachers in the sample warn against adding rubato, ritardandi or accelerandi Ravel did not write (Cassard M029/M035, Mok via Perlemuter M058, the NHK lesson M088/M089/M098, Thibaudet M104/M109, Voskresensky M021, Naoumoff M078), as does Gaby Casadesus via Howat (L027, L039). The recordings show pianists still slow down, most at mm. 29-33, 61-62 and 73.","source":"mc_cassard","loc":"6:15 and others","bars":"29-33, 61-62, 73","type":"interpretation","origin":"synthesis (AI) of human + compute /* ---------- score (bar map, no scans) ---------- */
function jScore(){
  const seen=new Set();
  const sheets=JGEOM.map(pg=>{
    let m='';
    pg.systems.forEach(sys=>{for(let i=0;i<sys.xs.length-1;i++){
      const n=sys.first+i,x0=sys.xs[i],x1=sys.xs[i+1],bb=JBAR[n];
      const l=x0/10,t=(sys.y[0]-28)/13.38,w=(x1-x0)/10,h=(sys.y[1]-sys.y[0]+56)/13.38;
      const first=!seen.has(n); seen.add(n);
      m+=`<button class="bz"${first?` id="jbz-${n}"`:''} data-go="j-bar-${n}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%" aria-label="Bar ${n}"></button>`;
      if(first) m+=`<button class="mk${bb&&bb.cl.length?' has':''}" data-go="j-bar-${n}" style="left:${l+.4}%;top:${t+1.2}%" tabindex="-1">${n}</button>`;
    }});
    return `<div class="sheet"><img loading="lazy" src="${JIMG(pg.p)}" alt="Jeux d’eau, Schott edition, page ${pg.p}" width="1000" height="1338">${m}</div>`;
  }).join('');
  return `<div class="view"><div class="vh"><h1>Score</h1><div class="legend2"><span><i class="lg-has"></i>has claims pinned</span><span><i style="border:1px solid var(--pencil);background:var(--surface)"></i>no claims yet</span></div></div>
   <p class="jnote">Schott edition (plate S.&amp;Co. 4148), printed pp. 3–15; public domain. Bar numbers as in Light 1983 and Lewis 2005. Tap any bar. <a href="https://archive.org/details/jeuxdeaupourpian00rave" target="_blank" rel="noopener">Source scan on Internet Archive ↗</a></p>
   ${sheets}</div>`;
}

/* ---------- connections inside the piece ---------- */
const JKIND={'literal repeat':['var(--pencil)',''],'varied repeat':['var(--pencil)','5 4'],'literal transposition':['var(--heat)',''],'varied transposition':['var(--heat)','5 4'],'same harmony/collection':['var(--faint)','2 4']};
function jConn(){
  const Wd=1000,H=300,base=230,pad=30,k=(Wd-2*pad)/(JN-1),X=b=>pad+(b-1)*k;
  let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Repeats and transpositions between bars">`;
  JSECS.forEach(g=>{s+=`<rect x="${X(g[1])}" y="${base+8}" width="${X(g[2])-X(g[1])}" height="6" rx="3" fill="${g[3]===2?'var(--heat-soft)':'var(--pencil-soft)'}"/><text x="${X(g[1])}" y="${base+34}" fill="var(--muted)" font-family="var(--f-body)" font-size="13">${g[0]} · ${g[1]}–${g[2]}</text>`});
  JD.links.forEach(l=>{const x1=X(l.a),x2=X(l.b),h=Math.min(210,Math.abs(x2-x1)*.55+14),[c,d]=JKIND[l.kind]||['var(--muted)',''];
    s+=`<path class="arc" stroke="${c}" stroke-dasharray="${d}" d="M${x1},${base} C${x1},${base-h} ${x2},${base-h} ${x2},${base}"><title>m. ${l.a} → m. ${l.b} · ${l.kind} · match ${l.note_match}</title></path>`});
  s+=`<line x1="${X(1)}" y1="${base}" x2="${X(JN)}" y2="${base}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
  [...new Set(JD.links.flatMap(l=>[l.a,l.b]))].forEach(b=>{s+=`<circle class="node" data-go="j-bar-${b}" cx="${X(b)}" cy="${base}" r="6" fill="var(--pencil)" stroke="var(--surface)" stroke-width="2"><title>m. ${b}</title></circle>`});
  [1,10,20,30,40,50,60,70,80,85].forEach(b=>{s+=`<text x="${X(b)}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--faint)" font-family="var(--f-mono)">${b}</text>`});
  s+='</svg>';
  const kinds=Object.keys(JKIND).filter(kd=>JD.links.some(l=>l.kind===kd));
  return `<div class="view"><div class="vh"><h1>Connections</h1><div class="legend2">${kinds.map(kd=>`<span><i style="background:${JKIND[kd][0]};height:3px;width:16px"></i>${kd}</span>`).join('')}</div></div>
   <div class="card"><div class="arcs">${s}</div></div>
   <div class="card" style="margin-top:16px">${JD.links.map(l=>`<div class="mrow" style="cursor:default"><span class="mn"><i style="background:${(JKIND[l.kind]||['var(--muted)'])[0]}"></i>${esc(l.kind)}</span><span class="refs">${jChip(l.a)} → ${jChip(l.b)} · note match ${l.note_match}${l.transposition_semitones?` · ${l.transposition_semitones>0?'+':''}${l.transposition_semitones} semitones`:''}</span></div>`).join('')}</div>
   <div class="srcl" style="margin-top:8px">Computed from the ATEPP MusicXML: overlap of (pitch, onset) pairs, transposition-invariant. Claims C006–C010 discuss them against the literature.</div></div>`;
}

/* ---------- statistics ---------- */
function jStats(){
  const recs=JD.recs, med=a=>{const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
  const mt=med(recs.map(r=>r.main_tempo_eighth_bpm));
  const coll={};JD.bars.forEach(b=>{const k=(b.coll||'other').split('(')[0];coll[k]=(coll[k]||0)+1});
  const Wd=1000,pad=46,k=(Wd-2*pad)/(JN-1),X=b=>pad+(b-1)*k;
  const ax=(H)=>[1,10,20,30,40,50,60,70,80,85].map(b=>`<text x="${X(b)}" y="${H-4}" text-anchor="middle" font-size="12" fill="var(--faint)" font-family="var(--f-mono)">${b}</text>`).join('');
  const secBg=(t,h)=>JSECS.map(g=>`<rect x="${X(g[1])-k/2}" y="${t}" width="${(g[2]-g[1]+1)*k}" height="${h}" fill="${g[3]===2?'var(--heat-soft)':'transparent'}"/>`).join('');
  /* 1 dynamics + density */
  const Y=l=>200-l*22; let d1=`<svg viewBox="0 0 ${Wd} 250" role="img" aria-label="Written dynamic and note density per bar">${secBg(20,190)}`;
  ['ppp','pp','p','mp','mf','f','ff','fff'].forEach((t,i)=>{d1+=`<line x1="${pad}" x2="${Wd-pad}" y1="${Y(i)}" y2="${Y(i)}" stroke="var(--line)"/><text x="${pad-10}" y="${Y(i)+4}" text-anchor="end" font-size="13" fill="var(--muted)" font-family="var(--f-display)" font-style="italic">${t}</text>`});
  const mx=Math.max(...JD.bars.map(b=>b.dens||0));
  JD.bars.forEach(b=>{const h=(b.dens||0)/mx*120;d1+=`<rect x="${X(b.n)-k*.35}" y="${210-h}" width="${k*.7}" height="${h}" rx="2" fill="var(--pencil-mid)"><title>m. ${b.n}: ${b.dens} notes per quarter · ${b.dyn||'–'}</title></rect>`});
  const dp=JD.bars.filter(b=>JLEV[b.dyn]!=null);
  d1+=`<path d="${dp.map((b,i)=>(i?'L':'M')+X(b.n)+','+Y(JLEV[b.dyn])+(dp[i+1]?' L'+X(dp[i+1].n)+','+Y(JLEV[b.dyn]):'')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  d1+=ax(250)+'</svg>';
  /* 2 tempo */
  const lo=.2,hi=1.8,yT=v=>210-(Math.min(Math.max(v,lo),hi)-lo)/(hi-lo)*190;
  const tp=JD.bars.filter(b=>b.t!=null&&b.n!==72&&b.n!==85);
  let d2=`<svg viewBox="0 0 ${Wd} 250" role="img" aria-label="Tempo per bar relative to each pianist's main tempo">${secBg(20,190)}`;
  [.4,.6,.8,1,1.2,1.4,1.6].forEach(v=>{d2+=`<line x1="${pad}" x2="${Wd-pad}" y1="${yT(v)}" y2="${yT(v)}" stroke="var(--line)" stroke-width="${v===1?2:1}"/><text x="${pad-10}" y="${yT(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--f-mono)">${v.toFixed(1)}×</text>`});
  d2+=`<path d="M${tp.map(b=>X(b.n)+','+yT(b.tmax)).join(' L')} L${[...tp].reverse().map(b=>X(b.n)+','+yT(b.tmin)).join(' L')} Z" fill="var(--pencil-soft)"/>`;
  d2+=`<polyline points="${tp.map(b=>X(b.n)+','+yT(b.t)).join(' ')}" fill="none" stroke="var(--pencil)" stroke-width="2"/>`;
  JD.unmarked.forEach(n=>{const b=JBAR[n];if(b&&b.t!=null)d2+=`<circle cx="${X(n)}" cy="${yT(b.t)}" r="5" fill="var(--heat)" stroke="var(--surface)" stroke-width="2"><title>m. ${n}: ${b.t}× with no marking</title></circle>`});
  tp.forEach(b=>{d2+=`<rect x="${X(b.n)-k/2}" y="20" width="${k}" height="190" fill="transparent" data-go="j-bar-${b.n}" style="cursor:pointer"><title>m. ${b.n}: median ${b.t}× (range ${b.tmin}–${b.tmax}) · ≈ ${b.tq} ♩/min</title></rect>`});
  d2+=ax(250)+'</svg>';
  /* 3 recordings vs 144 */
  const rs=[...recs].sort((a,b)=>a.main_tempo_eighth_bpm-b.main_tempo_eighth_bpm),rh=26,H3=rs.length*rh+40,x0=230,xR=v=>x0+(v-120)/(210-120)*(Wd-x0-40);
  let d3=`<svg viewBox="0 0 ${Wd} ${H3}" role="img" aria-label="Main tempo of each recording against Ravel's eighth = 144">`;
  [120,144,160,180,200].forEach(v=>{d3+=`<line x1="${xR(v)}" x2="${xR(v)}" y1="6" y2="${H3-26}" stroke="${v===144?'var(--heat)':'var(--line)'}" stroke-width="${v===144?2:1}"/><text x="${xR(v)}" y="${H3-8}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--f-mono)">${v===144?'♪ = 144':v}</text>`});
  rs.forEach((r,i)=>{const y=18+i*rh;d3+=`<text x="${x0-12}" y="${y+4}" text-anchor="end" font-size="13" fill="var(--ink)" font-family="var(--f-body)">${esc(r.artist)} · ${esc((r.album_date||'').slice(0,4))}</text><circle cx="${xR(r.main_tempo_eighth_bpm)}" cy="${y}" r="6" fill="var(--pencil)" stroke="var(--surface)" stroke-width="2"><title>${esc(r.artist)}, ${esc(r.album)}: ♪ ≈ ${r.main_tempo_eighth_bpm}</title></circle>`});
  d3+='</svg>';
  const ck=JD.checks;
  return `<div class="view"><div class="vh"><h1>Statistics</h1></div>
   <div class="kpis">
     <div><span>Bars</span><b>${JN}</b><small>m. 72 is an unbarred cadenza</small></div>
     <div><span>Metre changes</span><b>22</b><small>C002 · Lewis counts 21</small></div>
     <div><span>Under pp or ppp</span><b>40%</b><small>34 of 85 bars · C001</small></div>
     <div><span>Most present pitch</span><b>G♯</b><small>14.7% of the sound · C003</small></div>
     <div><span>Recordings analysed</span><b>13</b><small>8 pianists · ATEPP</small></div>
     <div><span>Median main tempo</span><b>♪ ${Math.round(mt)}</b><small>Ravel: ♪ = 144</small></div>
   </div>
   <div class="sec-title">Written dynamic (line) and note density (bars)</div>
   <div class="card"><div class="arcs">${d1}</div></div>
   <div class="srcl" style="margin-top:6px">Dynamic carried forward from the last marking, hairpins ignored. Density: notes per quarter note, from the MusicXML. Shaded: departure, mm. 24–61.</div>
   <div class="sec-title">Tempo in the recordings, bar by bar</div>
   <div class="card"><div class="arcs">${d2}</div></div>
   <div class="srcl" style="margin-top:6px">Line: median of 8 pianists, as a multiple of each pianist’s main tempo (mm. 2–11). Band: slowest to fastest pianist. Orange dots: slowing of 12% or more where Ravel wrote nothing (C018). Tap a bar to open it.</div>
   <div class="sec-title">Where the markings meet the recordings</div>
   <div class="jchecks">${ck.map(c=>`<button class="card jck" data-go="j-bar-${c.bar}"><span class="label">m. ${c.bar}</span><span>${esc(c.label.replace(/^m\. \d+\s*/,''))}</span><b>${c.median_ratio}×</b><small>median of ${c.pianists_n} pianists · ${c['pianists_slower_than_0.9']} below 0.9×</small></button>`).join('')}</div>
   <div class="sec-title">Main tempo of each recording</div>
   <div class="card"><div class="arcs">${d3}</div></div>
   <div class="srcl" style="margin-top:6px">Eighth notes per minute, mm. 2–11. Years are album release dates, not recording dates.</div>
   <div class="sec-title">Pitch collections, bars per type</div>
   <div class="card jcoll">${Object.entries(coll).sort((a,b)=>b[1]-a[1]).map(([kk,v])=>`<div><span>${esc(kk)}</span><span class="meter"><i style="width:${v/JN*100}%"></i></span><b>${v}</b></div>`).join('')}</div>
   <div class="srcl" style="margin-top:6px">Best-fitting collection per bar, computed. The octatonic fits in mm. 33–43 and 51–61 are not named in the literature and still need checking by ear (C005).</div>
   <div class="sec-title">All computed findings</div>
   <div class="card jcl" style="padding:6px 20px">${JD.claims.filter(c=>jOrig(c)==='comp').map(c=>jClaim(c,true)).join('')}</div></div>`;
}

/* ---------- listening ---------- */
function jListen(){
  const mb=[...JD.mb].sort((a,b)=>(a.y||'9999').localeCompare(b.y||'9999'));
  const fmt=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
  return `<div class="view"><div class="vh"><h1>Listening</h1></div>
   <div class="sec-title" style="margin-top:0">Analysed bar by bar · 13 recordings</div>
   <div class="card">${JD.recs.map(r=>`<a class="lrow" href="${yt(r.artist+' Ravel Jeux d\'eau')}" target="_blank" rel="noopener"><b>${esc(r.artist)}<small class="jsm">${esc(r.album)} · ♪ ≈ ${r.main_tempo_eighth_bpm}</small></b><span>Listen ↗</span></a>`).join('')}</div>
   <div class="sec-title">MusicBrainz · ${JD.mb.length} recordings with a length</div>
   <div class="card jmb">${mb.map(r=>`<a href="${yt(r.a+' Ravel Jeux d\'eau')}" target="_blank" rel="noopener"><span class="mono">${esc(r.y||'—')}</span><b>${esc(r.a)}</b><span class="mono">${fmt(r.s)}</span></a>`).join('')}</div>
   <div class="srcl" style="margin-top:6px">Links open a YouTube search. Year: recording date where known, else first release. Reissues may appear twice.</div></div>`;
}

/* ---------- sources ---------- */
function jSources(){
  const used={};JD.claims.forEach(c=>used[c.source]=(used[c.source]||0)+1);
  const groups={};JD.sources.forEach(s=>{const g=/masterclass|lecture/.test(s.type)?'Masterclasses and lectures':/score/.test(s.type)?'Scores':/dataset|database/.test(s.type)?'Data':'Literature';(groups[g]=groups[g]||[]).push(s)});
  return `<div class="view"><div class="vh"><h1>Sources</h1></div>
   ${['Literature','Masterclasses and lectures','Scores','Data'].filter(g=>groups[g]).map(g=>`<div class="sec-title">${g}</div><div class="card srcg">${groups[g].map(s=>`<div class="s"><div>${esc(s.cite)}<small>${esc(s.type)} · ${esc(s.access)} · ${esc(s.status)}</small></div><span class="mono jn">${used[s.id]?used[s.id]+' claims':''}</span></div>`).join('')}</div>`).join('')}
   <div class="sec-title">Still missing</div>
   <div class="card srcg">${JD.glance.gaps.map(g=>`<div class="s"><div>${esc(g)}</div><span></span></div>`).join('')}</div></div>`;
}

const jBind={
  context(){document.querySelectorAll('[data-art]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById('art-'+a.dataset.art).scrollIntoView({behavior:'smooth'})})},
  perspectives(){
    document.querySelectorAll('[data-jq]').forEach(b=>b.onclick=()=>{const v=store.get('jqv',{}),id=b.dataset.jq,i=+b.dataset.i;v[id]=v[id]===i?undefined:i;store.set('jqv',v);const y=scrollY;route();scrollTo(0,y)});
    document.querySelectorAll('[data-jt]').forEach(b=>b.onclick=()=>{store.set('jteach',b.dataset.jt);const y=scrollY;route();scrollTo(0,y)});
  },
  other(){document.querySelectorAll('.jnode').forEach(g=>{const f=()=>jMapSel(g.dataset.n);g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});jMapSel('jde')}
};

/* fetch every score page up front so excerpts are never blank */
const PRELOAD=GEOM.I.map(pg=>{const im=new Image();im.src=`score/p${String(pg.p).padStart(2,'0')}.png`;return im});
route();
</script>
