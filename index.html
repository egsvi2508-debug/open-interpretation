<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Interpretation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: empty search → one result → tiles → windows. Score = all pages in one column, a marker above every bar.
   Bar window = excerpt + notes; connected bars shown as score excerpts to compare. Context = articles with a contents rail. */
:root{
  --paper:#F3F4F6; --surface:#FFFFFF; --sunk:#E9EBEF;
  --ink:#15171C; --muted:#5A6070; --faint:#8A90A0; --line:#D9DCE3;
  --pencil:#2347C8; --pencil-ink:#1B3AA8; --pencil-soft:rgba(35,71,200,.10); --pencil-mid:rgba(35,71,200,.24);
  --heat:#C98A0E; --heat-soft:rgba(217,162,27,.16);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --score-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101217; --surface:#171A21; --sunk:#1E222B; --ink:#E8EAF0; --muted:#A1A7B6; --faint:#727889; --line:#2A2F3B;
  --pencil:#8AA4FF; --pencil-ink:#A9BCFF; --pencil-soft:rgba(138,164,255,.12); --pencil-mid:rgba(138,164,255,.28);
  --heat:#E2B23C; --heat-soft:rgba(226,178,60,.16);
  --score-filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.95); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101217; --surface:#171A21; --sunk:#1E222B; --ink:#E8EAF0; --muted:#A1A7B6; --faint:#727889; --line:#2A2F3B;
  --pencil:#8AA4FF; --pencil-ink:#A9BCFF; --pencil-soft:rgba(138,164,255,.12); --pencil-mid:rgba(138,164,255,.28);
  --heat:#E2B23C; --heat-soft:rgba(226,178,60,.16);
  --score-filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.95); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit}
a{color:var(--pencil-ink)}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* home */
.home{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-top:22vh;padding-inline:16px}
.home .mark{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);font-weight:500;margin-bottom:26px}
.sform{width:100%;max-width:620px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.sform:focus-within{border-color:var(--pencil);box-shadow:0 0 0 4px var(--pencil-soft)}
.sform input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;padding:16px 8px 16px 24px;outline:none}
.sform input::-webkit-search-cancel-button{display:none}
.sform button{border:0;background:none;cursor:pointer;padding:12px 18px;color:var(--muted);display:grid;place-items:center}
.sform svg{width:20px;height:20px}
.res{width:100%;max-width:620px;margin-top:18px}
.res-item{display:flex;width:100%;text-align:left;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;cursor:pointer}
.res-item:hover{border-color:var(--pencil)}
.res-item b{font-family:var(--f-display);font-size:20px;font-weight:600;display:block}
.res-item span{color:var(--muted);font-size:14px}
.res-item i{margin-left:auto;font-style:normal;color:var(--pencil-ink);font-size:20px}
.res-none{color:var(--muted);padding:12px 4px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:12px;padding-block:10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--pencil)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:16px;height:16px}
.ptitle{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.ptitle b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{font-size:12px;color:var(--muted);display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button:hover{background:var(--sunk);color:var(--ink)}
.tabs button.on{background:var(--pencil-soft);color:var(--pencil-ink)}
.view{padding-block:28px 80px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,5vw,44px);line-height:1.05}

/* tiles */
.phead{padding-block:40px 28px}
.phead .comp{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil-ink);font-weight:600}
.phead h1{font-family:var(--f-display);font-weight:500;font-size:clamp(36px,7vw,64px);line-height:1.02;letter-spacing:-.02em;margin-top:8px}
.phead h1 em{font-style:italic;font-weight:400;color:var(--muted);font-size:.55em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--pencil);transform:translateY(-2px)}
.tile .num{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.tile b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.tile.big{grid-column:span 2;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tile.big .num{color:var(--paper);opacity:.6}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile{min-height:104px;padding:16px}.tile b{font-size:21px}}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--pencil-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;vertical-align:1px;text-decoration:none}
.chip:hover{border-color:var(--pencil);background:var(--pencil-soft)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wref{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--pencil);font-style:italic}
.wref:hover{color:var(--pencil-ink);background:var(--pencil-soft)}
.sec-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:30px 0 10px}

/* score */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:16px}
.seg button+button{border-left:1px solid var(--line)}
.mvhead{font-family:var(--f-display);font-size:26px;font-weight:600;margin:34px auto 12px;max-width:860px}
.mvhead:first-child{margin-top:0}
.sheet{position:relative;line-height:0;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:860px;margin:0 auto 16px}
.sheet img{width:100%;height:auto;display:block;filter:var(--score-filter)}
.bz{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:3px}
.bz:hover,.bz.flash{background:var(--pencil-soft);box-shadow:inset 0 0 0 1.5px var(--pencil)}
.mk{position:absolute;transform:translate(-1px,-40%);border:1px solid var(--pencil);background:var(--surface);color:var(--pencil-ink);border-radius:5px;padding:0 4px 1px;font-family:var(--f-mono);font-size:10.5px;line-height:1.35;cursor:pointer;display:flex;align-items:center;gap:2px;z-index:2}
.mk:hover{background:var(--pencil);color:var(--surface)}
.mk.has{background:var(--pencil);color:var(--surface)}
.mk i{width:5px;height:5px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--surface)}
@media (max-width:600px){.mk{font-size:8px;padding:0 2px}.mk i{width:3px;height:3px}}

/* excerpts */
.snip{position:relative;overflow:hidden;background:#fff;min-height:40px;border-radius:8px;border:1px solid var(--line);display:block;width:100%}
.snip img{position:absolute;display:block;max-width:none;filter:var(--score-filter)}
.snip .hl{position:absolute;top:0;bottom:0;background:var(--pencil-soft);box-shadow:inset 0 0 0 2px var(--pencil);border-radius:3px}
button.snipbtn{border:0;padding:0;background:none;cursor:pointer;text-align:left;display:block;width:100%}
button.snipbtn:hover .snip{border-color:var(--pencil)}
.cmp{display:grid;gap:14px}
.cmp-item .cap{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:14px}
.cmp-item .cap b{font-family:var(--f-mono);font-size:13px;font-weight:500}
.cmp-item .cap span{color:var(--muted)}

/* bar window */
.bhead h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1}
.bhead .sub{color:var(--muted);margin-top:6px}
.bnav{display:flex;gap:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
.box h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.box h4{font-family:var(--f-display);font-size:22px;font-weight:600;margin-bottom:8px}
.box .src{font-size:12px;color:var(--faint);font-family:var(--f-mono);margin-top:10px}
.ip{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ip:first-of-type{border-top:0;padding-top:0}
.ip b{font-size:14px}
.ip small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:480px){.ip{grid-template-columns:1fr;gap:2px}}
.mot{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.mot:first-of-type{border-top:0;padding-top:0;margin-top:0}
.mot-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mot-h b{display:flex;gap:8px;align-items:center;font-size:15px}
.mot-h b i{width:10px;height:10px;border-radius:50%}
.mot-h button{border:0;background:none;color:var(--pencil-ink);font-weight:600;font-size:14px;cursor:pointer;padding:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.thumbs .cap{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.none{color:var(--faint);font-size:14px}

/* comments */
.cmt{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cmt:first-of-type{border-top:0;padding-top:2px}
.vote{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;padding:5px 0 4px;height:fit-content}
.vote svg{width:11px;height:11px}
.vote span{font-family:var(--f-mono);font-size:13px}
.vote:hover{border-color:var(--pencil)}
.vote.on{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.by{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.by b{color:var(--ink)}
.role{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.cmt p{font-size:15px;margin-top:3px}
.replies{margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
.compose{display:flex;gap:8px;margin-top:12px}
.compose textarea{flex:1;min-width:0;min-height:44px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:var(--paper);color:var(--ink)}
.compose textarea:focus{outline:none;border-color:var(--pencil)}
.btn{border:0;border-radius:10px;background:var(--pencil);color:var(--surface);font-weight:700;padding:0 16px;cursor:pointer;font-size:14px}
.btn.line{background:var(--surface);color:var(--pencil-ink);border:1px solid var(--line);padding:8px 14px}

/* context articles */
.ctx{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:860px){.ctx{grid-template-columns:1fr;gap:16px}}
.toc{position:sticky;top:130px;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.toc{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}}
.toc a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;padding:6px 10px;border-radius:8px;border-left:2px solid transparent}
.toc a:hover{color:var(--ink);background:var(--sunk)}
@media (max-width:860px){.toc a{border:1px solid var(--line);background:var(--surface);font-size:13px;padding:4px 10px}}
.toc a .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:8px}
article.art{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px clamp(18px,4vw,36px);margin-bottom:18px;scroll-margin-top:130px}
article.art .kick{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
article.art h2{font-family:var(--f-display);font-weight:500;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:6px 0 16px}
article.art h3{font-size:15px;font-weight:700;margin:22px 0 8px}
article.art p{font-size:17px;line-height:1.7;max-width:68ch}
article.art p+p{margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.facts div{background:var(--paper);padding:10px 14px}
.facts span{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.facts b{font-weight:600;font-size:15px}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.art blockquote{margin:16px 0;padding:10px 18px;border-left:3px solid var(--pencil);font-family:var(--f-display);font-style:italic;font-size:19px}
.art blockquote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.art .rel{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.art .rel .label{margin-right:4px}
.art .srcl{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-top:10px}
.lines5{display:grid;gap:10px;margin-top:12px}
.lines5>div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lines5>div:first-child{border-top:0}
.lines5 b{font-family:var(--f-display);font-size:18px}
@media (max-width:520px){.lines5>div{grid-template-columns:1fr;gap:2px}}

/* structure, interp, connections, sources, discussion */
.fm{padding:18px}.fm+.fm{margin-top:14px}
.fm h3{font-family:var(--f-display);font-size:22px;font-weight:600;margin-bottom:12px}
.bands-x{overflow-x:auto}
.bands{display:flex;gap:2px;height:58px;min-width:620px}
.band{min-width:0;border:0;border-radius:5px;padding:6px 7px;text-align:left;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--sunk)}
.band:hover{outline:2px solid var(--pencil)}
.band b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.band small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band.g1{background:var(--pencil-soft)}.band.g2{background:var(--heat-soft)}.band.g3{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.q{margin-bottom:14px;overflow:hidden}
.q-h{padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.q-h b{font-size:18px}
.q-p{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.pos{padding:14px 20px;border-top:1px solid var(--line);border-right:1px solid var(--line);margin:-1px -1px 0 0;display:flex;flex-direction:column;gap:6px}
.pos .who{font-weight:700}
.pos .how{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pos p{font-size:15px;flex:1}
.agree{display:flex;align-items:center;gap:10px}
.agree button{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;flex:none}
.agree button.on{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.agree button svg{width:11px;height:11px}
.meter{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pencil)}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:36px;text-align:right}
.arcs{overflow-x:auto;padding:14px}
.arcs svg{display:block;min-width:700px;width:100%;height:auto}
.arc{fill:none;stroke-width:2;opacity:.75}
.node{cursor:pointer}
.mrow{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--pencil-soft)}
.mrow .mn{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.mrow .mn i{width:10px;height:10px;border-radius:50%}
.mrow .refs{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.mrow{grid-template-columns:1fr;gap:4px}}
.work{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.work:first-child{border-top:0}
.work b{display:block}.work span{font-size:14px;color:var(--muted)}
.srcg .s{padding:12px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}
.srcg .s:first-child{border-top:0}
.srcg .s small{display:block;color:var(--muted);font-size:13px}
.dl .cmt{padding:14px 18px}.dl .cmt:first-of-type{padding-top:14px}

/* map of music */
.mapwrap{max-width:860px;margin:0 auto}
.motif-card{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:center}
@media (max-width:700px){.motif-card{grid-template-columns:1fr}}
.motif-card p{font-size:16px}
.motif-card svg{width:100%;height:auto;display:block}
.point{margin-top:14px;padding:14px 18px;border-left:3px solid var(--pencil);background:var(--surface);border-radius:0 12px 12px 0;font-size:16px}
.point small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.tline{margin-top:26px;overflow-x:auto}

  c:[C('Ana T.','Musicologist',19,'This is Prokofiev’s “scherzo-ish” line in miniature: a perfectly correct cadence with a smirk on it.')]},
 {id:'I-107',mv:'I',from:107,to:116,title:'Brahmsian hemiolas',sec:'Development B3',tags:['metre','voicing'],
  a:'Theme 1 appears twice in the left hand while the right hand plays its opening in hemiolas. In mm. 109–110 the transition idea sounds in both hands, the left hand crossing over the right.',
  src:['Cho 2023, p. 25','Berman 2008, p. 85'],ip:[IP('Berman','book 2008','Hears this passage as Brahmsian, because of the hemiolas.')],links:['I-1'],
  c:[C('Daniel P.','Student',17,'Play Brahms Op. 118 No. 1 the same week. You’ll hear exactly what Berman means.')]},
 {id:'I-117',mv:'I',from:117,to:125,title:'Three steps to the climax',sec:'Development C',tags:['dynamics','pedal point'],
  a:'Subito piano, then three statements of themes 1 and 2 combined, rising C minor → E♭ minor → F♯ minor over a G pedal point.',
  src:['Cho 2023, pp. 26, 57–58'],ip:[IP('Berman','edition 2011','Adds dotted slurs to mark every motif derived from theme 1.'),IP('Sándor','edition 1967','No slurs added.')],links:['I-132'],
  c:[C('M. Hartl','Teacher',22,'Save the forte. Three steps up means three levels, not three times loud.')]},
 {id:'I-132',mv:'I',from:132,to:137,title:'Climax, silence, Neapolitan',sec:'Development C → recapitulation',tags:['silence','harmony'],
  a:'A grand climax on the dominant G (m. 132), two beats of silence, then four calmer bars. The first chord of m. 135 has a Neapolitan colour in C minor: a surprise that also prepares the final dominant.',
  src:['Cho 2023, pp. 27–28'],ip:[],links:['I-117','I-1'],
  c:[C('Sofia R.','Performer',41,'Count the silence. Every performer I admire holds it a little longer than written, but they all count it.')]},
 {id:'I-162',mv:'I',from:162,to:183,title:'Second theme, now in C major',sec:'Recapitulation',tags:['harmony','dynamics'],
  a:'The second theme returns in a clear C major, the grace notes now sweeping up to B, the leading tone. The dynamics are softer than in the exposition.',src:['Cho 2023, p. 28'],ip:[],links:['I-40'],c:[]},
 {id:'I-194',mv:'I',from:194,to:197,title:'An ironic last cadence',sec:'Closing',tags:['harmony','humour'],
  a:'A plain V–I with chromatic neighbour notes (C♯ and F♯) inside the chords. A dissonance in a consonant chord gives the ending an ironic edge.',src:['Cho 2023, p. 28'],ip:[],links:['I-61','III-222'],
  c:[C('Felix B.','Student',8,'Do you voice the C♯ or hide it? I’ve heard both.')]},
 // ---------- MOVEMENT II ----------
 {id:'II-1',mv:'II',from:1,to:4,title:'Theme A: how to play the left-hand thirds',sec:'Theme A',tags:['articulation','pedal','orchestration'],
  a:'A dark theme in A minor rises slowly from the bass. Under it, repeated thirds climb a step every bar. There are no articulation or pedal marks, so every pianist has to decide how the thirds sound. The composer left two clues: his own recording, and his orchestral version.',
  src:['Cho 2023, pp. 29, 58–59','Berman 2008, pp. 94–95'],
  ip:[IP('Prokofiev','own recording, 1935','Detached and short, no pedal.','comp'),
      IP('Op. 29 bis','orchestral version, 1934','Bassoons and contrabassoon, tenuto over staccato; double basses pizzicato.','orch'),
      IP('Sándor','recording','Short and without pedal, but not staccatissimo.'),
      IP('Berman','recording; edition','Detached but a bit longer. His edition suggests short, shallow pedal.'),
      IP('Cho','synthesis','Longer than staccato, clearly detached. If you pedal, change on every eighth.','syn')],
  links:['Q-thirds','II-5','III-83','N-andante'],
  c:[C('M. Hartl','Teacher',72,'Before you decide on pedal, listen to Prokofiev’s own 1935 recording. It is completely dry, like bassoons. Then decide.'),
     C('Lena K.','Student',40,'Thinking “bassoons” changed my touch completely. Less finger, more weight, then release.'),
     C('Imported · comment under the composer’s recording','Imported',26,'He starts around ♩ = 48 and then moves the tempo from section to section. It sounds more like speech than a fixed pulse.'),
     C('Jonas W.','Student',5,'Shallow pedal on a dry Bösendorfer and on a big Steinway are two different things. Try both in the hall.')]},
 {id:'II-5',mv:'II',from:5,to:9,title:'Stretto',sec:'Theme A',tags:['counterpoint','voicing'],
  a:'Before the theme has finished, a second statement enters in the left hand (m. 5), moving against it in contrary motion. It passes to the right hand at the high D (m. 7), and a third, incomplete statement begins in m. 8: a fugal device inside a lyrical melody.',
  src:['Cho 2023, pp. 29–30'],ip:[],links:['II-1','II-25'],
  c:[C('Ana T.','Musicologist',24,'Mark each entry with a different coloured pencil. You need to know who has the theme at every moment.'),C('Mira S.','Student',6,'The hand-over at m. 7 is so hard to make seamless.')]},
 {id:'II-10',mv:'II',from:10,to:12,title:'First arrival',sec:'Theme A',tags:['harmony','dynamics'],
  a:'The stretto ends in a dissonant chord that resolves to a G major triad in m. 10, repeated in m. 12: the dominant of C major, the relative major. Note the ff > p inside a single bar.',
  src:['Cho 2023, p. 30'],ip:[],links:['II-5'],
  c:[C('Sofia R.','Performer',11,'ff > p within one bar. The decay matters more than the attack.')]},
 {id:'II-13',mv:'II',from:13,to:14,title:'Variation 1: four layers',sec:'Variation 1',tags:['texture','pedal','fingering'],
  a:'Four layers at once: the melody on top, broken-chord sixteenths in the alto, staccato leaping octaves in the tenor, and a half-note bass.',
  src:['Cho 2023, pp. 30–31, 59–60'],
  ip:[IP('Sándor & Berman','recordings','Both connect melody and bass with the pedal while keeping each voice’s articulation clear.'),
      IP('Berman','edition 2011','Fingering for the alto that keeps it even and quiet.'),
      IP('Cho','synthesis','Pedal on each half note of the bass, half-change on the alto’s last eighth; connect the melody with the fingers.','syn')],
  links:['II-15'],
  c:[C('M. Hartl','Teacher',35,'Practise soprano and bass alone until they sing. Then add the alto at a whisper. The tenor comes last.'),C('Felix B.','Student',9,'This is the bar where I finally understood what half pedal is for.')]},
 {id:'II-15',mv:'II',from:15,to:17,title:'Theme in the left-hand octaves',sec:'Variation 1',tags:['voicing','pedal'],
  a:'The second statement moves into left-hand octaves (m. 16). The broken chords thicken and the leaping eighths change direction. Tension builds toward the climax in mm. 22–23.',
  src:['Cho 2023, p. 31'],ip:[],links:['II-13','II-22'],
  c:[C('Daniel P.','Student',7,'Hard to keep the octaves legato without a heavy sound. I change the pedal only with the bass.')]},
 {id:'II-22',mv:'II',from:22,to:23,title:'Climax: black keys against white',sec:'Variation 1',tags:['harmony'],
  a:'The tension peaks on D♭ major and bursts into D minor 9 (ii9 of C). Cho describes it as a contrast between black keys and white keys.',src:['Cho 2023, p. 32'],ip:[],links:['II-15'],c:[]},
 {id:'II-25',mv:'II',from:25,to:32,title:'Variation 2: a mirror',sec:'Variation 2',tags:['counterpoint','inversion'],
  a:'In G♯ minor the theme appears twice at once in contrary motion: once in the tenor, once inverted in the soprano. The lines approach, cross, and meet on G♯ (m. 29).',src:['Cho 2023, pp. 32–33'],ip:[],links:['II-5','II-33'],c:[]},
 {id:'II-33',mv:'II',from:33,to:35,title:'Quasi cadenza: the 12/8 question',sec:'Quasi cadenza',tags:['tempo','hand crossing'],
  a:'Forte octaves, trills, arpeggios and accented minor triads descending in the left hand. The metre suddenly changes to 12/8. How does the new pulse relate to the old one?',
  src:['Cho 2023, pp. 33, 60–61'],
  ip:[IP('Berman','edition 2011','♩ in 4/4 = ♩. in 12/8. Also marks sopra/sotto for the hand crossing in mm. 34–35.'),
      IP('Sándor','edition; recording','No indication in the edition; plays it much like Berman.'),
      IP('Prokofiev','own recording, 1935','Slower and heavier: about ♩. = 46 here, against ♩ ≈ 72 just before.','comp'),
      IP('Op. 29 bis','orchestral score','♩ = ♩., the same relation as Berman.','orch')],
  links:['Q-cadenza','II-1'],
  c:[C('Sofia R.','Performer',58,'The composer’s recording and the composer’s score disagree. To me that’s the most freeing fact on this whole page.'),
     C('M. Hartl','Teacher',31,'Berman’s sopra/sotto marks for the hand crossing save a lot of practice time.')]},
 {id:'II-36',mv:'II',from:36,to:38,title:'Bridge: two keys, very calm',sec:'Bridge',tags:['bitonality'],
  a:'molto tranquillo. The right hand plays a D minor chord (F–A–D) while the left hand plays G major (G–B–D), crossing over and back.',src:['Cho 2023, p. 34'],ip:[],links:['II-39'],c:[]},
 {id:'II-39',mv:'II',from:39,to:53,title:'Theme B: white keys, fairy tale',sec:'Theme B',tags:['tone','pedal'],
  a:'A long, contemplative melody over the broken chords of the bridge, almost entirely on white keys. Berman hears a Russian fairy-tale character. The closing chord in m. 53 (D♭ minor-major 7) leans into C major from a half step above.',
  src:['Cho 2023, pp. 34–35, 62–63','Berman 2008, p. 89'],
  ip:[IP('Sándor','edition 1967','Release the pedal after the third broken chord in m. 39, so the low F lingers without blurring.'),
      IP('Cho','synthesis','Slow pedal release or frequent half pedal; a large surface of the fingertip and a flexible wrist.','syn')],
  links:['II-71'],
  c:[C('Lena K.','Student',37,'Fairy tale is exactly it. My teacher made me read Afanasyev before this lesson.')]},
 {id:'II-71',mv:'II',from:71,to:80,title:'Themes A and B together',sec:'A + B combined',tags:['polymeter','pedal'],
  a:'Theme A in the left hand, theme B in the right, with 12/8 written for the right hand only against 4/4 in the left. Poco meno mosso, pp, tranquillissimo. For the first time Prokofiev writes a pedal mark.',
  src:['Cho 2023, pp. 37–38, 63–64','Berman 2008, p. 97'],
  ip:[IP('Sándor','edition','Half pedal.'),IP('Berman','edition; book','Writes non troppo legato; the low notes must not get heavy from continuous pedal.'),IP('Prokofiev','own recording','Sounds pedalled, yet every articulation stays clear: probably partial pedal.','comp')],
  links:['II-1','II-39'],c:[C('Mira S.','Student',13,'Practise the right hand’s leaps alone at the very end of the practice session, when the arm is warm.')]},
 {id:'II-81',mv:'II',from:81,to:88,title:'Coda: A minor or A minor 7?',sec:'Coda',tags:['text question','voicing'],
  a:'The coda reduces theme A to rolled seventh chords: FM7–G7–Am7, then F♯m7♭5–G♯m7♭5–Am(7). Does the last chord include the G?',
  src:['Cho 2023, pp. 39, 64–65'],
  ip:[IP('Sándor','edition 1967','Last chord: A minor, no G. Rolls the chords slowly and lights up the C♯ in m. 86.'),
      IP('Op. 29 bis','orchestral score','A minor, no G.','orch'),
      IP('Prokofiev','own recording, 1935','Plays A minor 7, with the G.','comp'),
      IP('Berman','edition 2011','Adds the G.')],
  links:['Q-coda'],
  c:[C('Ana T.','Musicologist',46,'A misprint that survived a hundred years, or a performer’s liberty? The recording is the only witness. This is why recordings belong next to editions.')]},
 // ---------- MOVEMENT III ----------
 {id:'III-1',mv:'III',from:1,to:1,title:'The opening flourish',sec:'A',tags:['gesture','history'],
  a:'A glissando-like run over almost three octaves, hands alternating. It recalls written-out improvisation in older keyboard music: Haydn’s Sonata Hob. XVI:50 (II), Mozart’s Fantasy K. 396, Bach’s Chromatic Fantasy BWV 903.',
  src:['Cho 2023, p. 41'],ip:[],links:['III-201','N-haydn'],
  c:[C('Sofia R.','Performer',34,'Curtain up. It’s not a scale, it’s a gesture. Practise it slowly with the arm only, then forget about the notes.'),C('Jonas W.','Student',12,'Hand alternation: I let the left hand start a hair early so the join never shows.')]},
 {id:'III-2',mv:'III',from:2,to:9,title:'Theme A: correct, with wrong notes',sec:'A · antecedent',tags:['harmony','fingering'],
  a:'A broken-chord accompaniment and a textbook I–N6–V–I progression, but appoggiaturas on the first beats produce “wrong notes”. In mm. 7–8 the wide arpeggios raise a fingering question.',
  src:['Cho 2023, pp. 41, 66','Berman 2008, p. 91'],
  ip:[IP('Sándor','edition 1967','Thumb on A♭ in m. 8: helps connect to the next chord.'),IP('Berman','edition 2011','Thumb earlier, on F: a smoother arpeggio.'),IP('Cho','synthesis','Choose by your hand; just avoid an accent where the thumb goes under.','syn')],
  links:['III-10'],
  c:[C('M. Hartl','Teacher',28,'The wrong notes must sound intentional. Play them as if you were proud of them.'),C('Mira S.','Student',10,'Small hands: Berman’s fingering worked for me, Sándor’s didn’t.')]},
 {id:'III-10',mv:'III',from:10,to:17,title:'Alberti bass in tenths',sec:'A · consequent',tags:['technique','left hand'],
  a:'A Classical Alberti bass, stretched to tenths. It has to stay even, with no accents caused by the distance the hand travels.',
  src:['Cho 2023, pp. 41, 66–67','Lhevinne, Basic Principles, pp. 34–35'],
  ip:[IP('Lhevinne','via Cho','Accuracy at speed comes from fingering and hand position. Practise the left hand alone.')],links:['III-18'],
  c:[C('Felix B.','Student',15,'Rotate, don’t stretch. Thinking of the tenth as a forearm rotation saved my wrist.')]},
 {id:'III-18',mv:'III',from:18,to:22,title:'Subito p, with grace notes',sec:'A · consequent repeated',tags:['dynamics','fingering'],
  a:'The consequent returns subito piano. Three grace notes are added on the second beat (mm. 18 and 20) and the Alberti pattern is spread an octave apart.',
  src:['Cho 2023, pp. 41, 67'],ip:[IP('Berman','edition 2011','A left-hand fingering that makes the leaps manageable.')],links:['III-10'],
  c:[C('Daniel P.','Student',9,'The subito p is the joke. Don’t prepare it.')]},
 {id:'III-25',mv:'III',from:25,to:39,title:'Bridge 1: a hidden pattern',sec:'Bridge 1',tags:['memory','harmony'],
  a:'The right hand’s groups of four rising sixteenths look irregular, but the first beats trace a whole-tone line (E–F♯–G♯–A♯–B♯–D…), every other arpeggio is a diminished chord, and the bass rises in major thirds (C–E–G♯). Knowing this makes the passage much easier to memorise.',
  src:['Cho 2023, p. 43'],ip:[],links:['III-153'],
  c:[C('Lena K.','Student',49,'This one paragraph saved me a week of memory work. Exactly the kind of thing a teacher tells you once and you never forget.')]},
 {id:'III-40',mv:'III',from:40,to:42,title:'An echo of the first movement',sec:'Bridge 1 → B',tags:['motif'],
  a:'Two oscillating notes in the left hand (D and E♭) lead into theme B. They seem to come from the opening murmur of the first movement.',src:['Cho 2023, p. 43'],ip:[],links:['I-up','III-43'],c:[]},
 {id:'III-43',mv:'III',from:43,to:66,title:'Theme B: uneasy',sec:'B',tags:['fingering','relaxation'],
  a:'An oscillating accompaniment and grace notes a ninth away from their main notes make this theme uneasy and anxious.',
  src:['Cho 2023, pp. 44, 67–68'],ip:[IP('Sándor & Berman','editions','Different fingerings for the oscillating left hand (mm. 45–46). Try both and combine them if needed.')],links:['III-40','III-178'],
  c:[C('Jonas W.','Student',6,'Relax the arm first, then worry about fingers.')]},
 {id:'III-83',mv:'III',from:83,to:95,title:'Theme C: A-flat Lydian',sec:'C',tags:['tempo','tone','mode'],
  a:'A simple, naive melody in four-bar phrases. The key signature says E♭ major, but it sounds like A♭ Lydian (there is no D♭). The repeated thirds of the accompaniment recall the slow movement.',
  src:['Cho 2023, pp. 46, 68'],ip:[IP('Sándor','edition 1967','Writes L’istesso tempo: don’t slow down for the lyrical theme.'),IP('Cho','synthesis','Legato with a large finger surface; a loose wrist for the repeated thirds.','syn')],
  links:['Q-ctheme','II-1','III-161'],
  c:[C('M. Hartl','Teacher',30,'Sándor’s L’istesso tempo is the best two words on this page. Everyone slows down here.')]},
 {id:'III-96',mv:'III',from:96,to:99,title:'Two lines in one hand',sec:'C',tags:['hand crossing','redistribution'],
  a:'The right hand plays two chromatic lines at once, one of them crossing over the left hand. Big hands can follow Berman’s fingering. Cho suggests redistributing instead: after the first C, the right hand takes the accompaniment and the left hand takes the lower melody.',
  src:['Cho 2023, pp. 68–69'],ip:[IP('Berman','edition 2011','Fingering for a true legato in both lines (for large hands).'),IP('Cho','thesis','Redistribute between the hands.','syn')],links:['III-83'],
  c:[C('Mira S.','Student',22,'Cho’s redistribution is the only version that works with my hand. Thank you, whoever put this here.')]},
 {id:'III-153',mv:'III',from:153,to:160,title:'Bridge 2: precipitato',sec:'Bridge 2',tags:['toccata','pedal'],
  a:'Fifteen groups of rising sixteenths (seven in bridge 1), marked precipitato and senza Pedale: Prokofiev’s Toccata line.',src:['Cho 2023, p. 50'],ip:[],links:['III-25','III-161','N-toccata'],c:[]},
 {id:'III-161',mv:'III',from:161,to:166,title:'A memory of theme C',sec:'Bridge 2',tags:['motif','humour'],
  a:'The rush is interrupted, whimsically, by theme C: the melody in the left hand, its inversion in the right.',src:['Cho 2023, p. 50'],ip:[],links:['III-83','III-153'],c:[]},
 {id:'III-178',mv:'III',from:178,to:201,title:'B′: the composer’s own fingerings',sec:'B′',tags:['fingering','power'],
  a:'The right hand takes the octave-leap accompaniment high up; the left hand has the ff melody. Prokofiev wrote his own fingerings here.',
  src:['Cho 2023, pp. 51, 70'],ip:[IP('Berman','edition 2011','Circles the fingerings that come from Prokofiev himself.'),IP('Cho','synthesis','Thumb on the first accented note, fifth finger for the octaves.','syn')],links:['III-43'],c:[]},
 {id:'III-201',mv:'III',from:201,to:207,title:'Five flourishes',sec:'A‴',tags:['pedal','tempo'],
  a:'The opening flourish returns five times, each one higher (C–D–E–F), delaying the theme until a fff top C.',
  src:['Cho 2023, pp. 51–52, 70–71'],ip:[IP('Sándor','edition 1967','Pedal on the flourishes and the octaves, for a fuller sound and a real crescendo.'),IP('Berman','recording','A surprisingly constant tempo.')],links:['III-1','III-222'],c:[]},
 {id:'III-222',mv:'III',from:222,to:223,title:'The stuttering ending',sec:'Final cadence',tags:['humour','tempo'],
  a:'V–I with a few added dissonances. The octave C arrives early, right after the V chord, so the ending seems to stutter in its hurry to finish.',

 {id:'notebooks',t:'From old notebooks',body:`
   <p>The French subtitle, <i>d’après des vieux cahiers</i>, is literal. As a student at the St. Petersburg Conservatory, Prokofiev filled notebooks with sonatas and sketches. In 1917, already a recognised composer, he went back to them. Two finished works came out of that search: the one-movement ${W('Sonata No. 3, Op. 28','Prokofiev Piano Sonata No.3')}, built on a student sonata of 1907, and the three-movement Sonata No. 4, built on a student sonata of 1908 and on the slow movement of an abandoned ${W('Symphony in E minor','Prokofiev Symphony E minor 1908')} from the same year.</p>
   <p>He did the same thing in other works of these years, for example the ${W('Ballade for cello and piano, Op. 15','Prokofiev Ballade Op.15')}. Reworking old material was not a sign of running out of ideas. 1917 was one of the most productive years of his life, and the notebooks gave him themes he still believed in, which he now set with an adult technique.</p>
   <p>You can hear the student origins in the Classical frame: an exposition with two clear themes in the first movement, a stretto in the Andante, an Alberti bass in the finale. You can hear the 1917 composer in what happens inside that frame: the bitonal pull of the second theme (${B('I',40,'I · m. 40')}) and the “wrong notes” of the finale.</p>`,
   rel:[W('Sonata No. 3, Op. 28','Prokofiev Piano Sonata No.3'),W('Ballade, Op. 15','Prokofiev Ballade Op.15'),W('Sonata No. 1, Op. 1','Prokofiev Piano Sonata No.1')],src:'Cho 2023, pp. 18–19; Prokofiev, Autobiography, p. 27'},

 {id:'schmidthof',t:'Maximilian Schmidthof',body:`
   <p>The sonata is dedicated to the memory of Maximilian (Max) Schmidthof, Prokofiev’s closest friend at the Conservatory. They shared a taste for argument, philosophy and chess, and Schmidthof pushed Prokofiev’s reading in new directions.</p>
   <p>In April 1913 Schmidthof shot himself in a forest in Finland. Before he died he sent Prokofiev a farewell letter. The loss stayed with Prokofiev for years. He dedicated four works to Schmidthof:</p>
   <ol class="tl">
    <li><span class="y">1912</span><span>${W('Sonata No. 2 in D minor, Op. 14','Prokofiev Piano Sonata No.2')}, written while his friend was alive</span></li>
    <li><span class="y">1913</span><span>One of the ${W('Ten Pieces, Op. 12','Prokofiev 10 Pieces Op.12')}</span></li>
    <li><span class="y">1913</span><span>${W('Piano Concerto No. 2 in G minor, Op. 16','Prokofiev Piano Concerto No.2')}, to his memory</span></li>
    <li><span class="y">1917</span><span>Sonata No. 4, to his memory</span></li></ol>
   <p>This helps explain why the first two movements are so dark and inward compared with the Third and Seventh sonatas. The Andante in particular, with its low, slow theme rising out of the bass, is often heard as an elegy.</p>`,
   rel:[W('Piano Concerto No. 2, Op. 16','Prokofiev Piano Concerto No.2'),W('Sonata No. 2, Op. 14','Prokofiev Piano Sonata No.2')],src:'Cho 2023, p. 18; Robinson 2002; Wikipedia articles on Op. 14 and Op. 16'},

 {id:'y1917',t:'1917: the year around the sonata',body:`
   <p>Prokofiev wrote Sonata No. 4 in the year of two revolutions, in February and October 1917. While Petrograd was in turmoil, he wrote some of his best-known music:</p>
   <ol class="tl">
    <li><span class="y">1916–17</span><span>${W('Symphony No. 1 “Classical”, Op. 25','Prokofiev Symphony No.1')}: Haydn’s manner in a modern voice, the same Classical line heard in this sonata’s finale</span></li>
    <li><span class="y">1915–17</span><span>${W('Visions fugitives, Op. 22','Prokofiev Visions fugitives')}: twenty miniatures</span></li>
    <li><span class="y">1917</span><span>${W('Violin Concerto No. 1, Op. 19','Prokofiev Violin Concerto No.1')}</span></li>
    <li><span class="y">1917</span><span>${W('Sonata No. 3, Op. 28','Prokofiev Piano Sonata No.3')} and Sonata No. 4, Op. 29</span></li>
    <li><span class="y">1917</span><span>Cantata ${W('Seven, They Are Seven, Op. 30','Prokofiev Seven They Are Seven')}</span></li>
    <li><span class="y">1917</span><span>First sketches of ${W('Piano Concerto No. 3, Op. 26','Prokofiev Piano Concerto No.3')}</span></li></ol>
   <p>Next to the Classical Symphony, the Fourth Sonata shows the other side of that year: the same respect for Classical form, but turned inward.</p>`,
   rel:[W('Classical Symphony, Op. 25','Prokofiev Symphony No.1'),W('Visions fugitives, Op. 22','Prokofiev Visions fugitives'),W('Violin Concerto No. 1, Op. 19','Prokofiev Violin Concerto No.1')],src:'Boosey & Hawkes biography; Robinson 2002'},

 {id:'premiere',t:'Premiere and departure, April 1918',body:`
   <p>Prokofiev played the first performance himself in Petrograd on 17 April 1918. In the same weeks the Classical Symphony was premiered there under his baton. Shortly afterwards he left for Moscow and took the Trans-Siberian railway east, through Japan to the United States. He expected to be away for a few months. He stayed abroad for about nine years and settled in the Soviet Union for good only in 1936.</p>
   <p>The sonata therefore belongs to the last music he presented in Russia before emigrating. A. Gutheil published it in 1918. The copy used on this site carries a 1921 Breitkopf &amp; Härtel copyright line and is edited by F. H. Schneider.</p>
   <ol class="tl">
    <li><span class="y">17.4.1918</span><span>Premiere of Sonata No. 4, Petrograd</span></li>
    <li><span class="y">April 1918</span><span>Premiere of the ${W('Classical Symphony','Prokofiev Symphony No.1')}, Petrograd</span></li>
    <li><span class="y">May 1918</span><span>Leaves via Siberia and Japan for the USA</span></li>
    <li><span class="y">1936</span><span>Returns to the Soviet Union for good</span></li></ol>`,
   rel:[W('Classical Symphony, Op. 25','Prokofiev Symphony No.1')],src:'Cho 2023, p. 18; Symphony No. 1 histories'},

 {id:'andante',t:'The Andante’s double life',body:`
   <p>The slow movement began as orchestral music. In a diary entry of April 1917, Prokofiev describes looking for a new Andante for the sonata, failing to find a lost manuscript, and then remembering the Andante of his E-minor Symphony. He thought it would work on the piano too, and doubted the symphony itself would ever be revived.</p>
   <p>In 1934 he turned the movement back into orchestral music, published as ${W('Andante for orchestra, Op. 29 bis','Prokofiev Andante Op.29bis')}. A year later, in 1935, he recorded the piano version himself. These two documents are the strongest evidence we have for how he heard the movement:</p>
   <ol class="tl">
    <li><span class="y">Op. 29 bis</span><span>The repeated left-hand thirds go to bassoons (tenuto-staccato) and pizzicato basses ${B('II',1,'II · m. 1')}. In the Quasi cadenza the quarter note of 4/4 equals the dotted quarter of 12/8 ${B('II',33,'II · m. 33')}.</span></li>
    <li><span class="y">1935</span><span>Prokofiev plays the thirds short and dry, starts around ♩ = 48, takes the 12/8 slower than his own orchestral score, and plays the final chord as A minor 7 ${B('II',81,'II · m. 81')}.</span></li></ol>
   <p>A pianist working on this movement can therefore compare the score, the composer’s orchestration and the composer’s own playing. They do not always agree. See the Interpretations window.</p>`,
   rel:[W('Andante, Op. 29 bis','Prokofiev Andante Op.29bis'),W('Symphony in E minor (1908)','Prokofiev Symphony E minor')],src:'Cho 2023, pp. 18, 58–65; Berman 2008, pp. 94–97'},

 {id:'lines',t:'Prokofiev’s five lines',body:`
   <p>In his autobiography Prokofiev described his music through five “lines”. All five meet in this sonata.</p>
   <div class="lines5">
    <div><b>Classical</b><p>Forms, textures and cadences of Haydn, Mozart and Beethoven, whose sonatas his mother played to him. Here: sonata form in I, stretto in II ${B('II',5,'II · m. 5')}, sonata-rondo and Alberti bass in III ${B('III',10,'III · m. 10')}. Compare ${W('Classical Symphony','Prokofiev Symphony No.1')}.</p></div>
    <div><b>Modern</b><p>Bitonality, abrupt modulations, “wrong notes”. Here: E♭ major against G minor ${B('I',40,'I · m. 40')}, D minor over G major ${B('II',36,'II · m. 36')}, appoggiaturas on the beat ${B('III',2,'III · m. 2')}. Compare ${W('Sarcasms, Op. 17','Prokofiev Sarcasms')}.</p></div>
    <div><b>Toccata</b><p>Motoric repeated patterns, inspired by ${W('Schumann’s Toccata, Op. 7','Schumann Toccata Op.7')}. Here: the precipitato second bridge of the finale ${B('III',153,'III · m. 153')}. Compare ${W('Toccata, Op. 11','Prokofiev Toccata Op.11')} and ${W('Suggestion diabolique, Op. 4 No. 4','Prokofiev 4 Pieces Op.4')}.</p></div>
    <div><b>Lyrical</b><p>Long contemplative melodies, or simple naive ones. Here: both themes of the Andante ${B('II',39,'II · m. 39')} and theme C of the finale ${B('III',83,'III · m. 83')}. Compare the first theme of ${W('Sonata No. 8, Op. 84','Prokofiev Piano Sonata No.8')}.</p></div>
    <div><b>Scherzo-ish</b><p>Prokofiev disliked the word “grotesque” and preferred whimsy, laughter, mockery. Here: the smirking cadence ${B('I',61,'I · m. 61')}, the stuttering last bars ${B('III',222,'III · m. 222')}.</p></div></div>`,
   rel:[W('Toccata, Op. 11','Prokofiev Toccata Op.11'),W('Schumann, Toccata Op. 7','Schumann Toccata Op.7'),W('Sonata No. 8, Op. 84','Prokofiev Piano Sonata No.8')],src:'Prokofiev, Autobiography, pp. 36–37; Cho 2023, ch. 2; Berman 2008, p. 11'},

 {id:'models',t:'Echoes of older music',body:`
   <p>The sonata is full of references to the keyboard tradition Prokofiev grew up with.</p>
   <ol class="tl">
    <li><span class="y">III · m. 1</span><span>The opening flourish resembles written-out improvisation in ${W('Haydn, Sonata in C, Hob. XVI:50','Haydn Piano Sonata Hob.XVI:50')}, ${W('Mozart, Fantasia in C minor, K. 396','Mozart Fantasia K.396')} and ${W('Bach, Chromatic Fantasia and Fugue, BWV 903','Bach Chromatic Fantasia BWV 903')} ${B('III',1,'open')}</span></li>
    <li><span class="y">I · m. 107</span><span>Berman hears the hemiolas of the development as Brahmsian ${B('I',107,'open')}</span></li>
    <li><span class="y">II</span><span>Robinson hears an impressionistic, almost shapeless quality reminiscent of Schumann</span></li>
    <li><span class="y">III</span><span>The motoric second bridge follows the Toccata line that Prokofiev traced back to ${W('Schumann’s Toccata','Schumann Toccata Op.7')} ${B('III',153,'open')}</span></li></ol>`,
   rel:[W('Haydn, Hob. XVI:50','Haydn Piano Sonata Hob.XVI:50'),W('Mozart, K. 396','Mozart Fantasia K.396'),W('Bach, BWV 903','Bach Chromatic Fantasia BWV 903')],src:'Cho 2023, pp. 25, 41; Berman 2008, p. 85; Robinson 2002, p. 133'},

 {id:'performers',t:'Performers and recordings',body:`
   <h3>Three schools on this page</h3>
   <ol class="tl">
    <li><span class="y">Prokofiev</span><span>Premiered the sonata in 1918 and recorded the Andante in 1935 (Naxos Historical 8.110670).</span></li>
    <li><span class="y">Sándor</span><span>György Sándor (1912–2005), Budapest, pupil of Bartók and Kodály. Recorded all of Prokofiev’s solo piano music (Vox) and edited the sonatas (MCA, 1967).</span></li>
    <li><span class="y">Berman</span><span>Boris Berman (b. 1948), Moscow, pupil of Lev Oborin; Yale. Complete recording (Chandos, 1998), edition (Shanghai, 2011), book (Yale, 2008).</span></li></ol>
   <h3>Other recordings</h3>
   <p>Sviatoslav Richter championed the sonata and is reported to have learned it in four days. Complete cycles of the nine sonatas include Yefim Bronfman, Frederic Chiu, Peter Donohoe, Bernd Glemser, Yakov Kasman, Oleg Marshev, Vladimir Ovchinnikov, Matti Raekallio and Natalia Trull. Nikolai Lugansky and Alexandra Silocea have also recorded No. 4.</p>`,
   rel:[`<a class="wref" href="https://www.youtube.com/results?search_query=Richter+Prokofiev+Sonata+No.+4" target="_blank" rel="noopener">Richter on YouTube</a>`,`<a class="wref" href="https://www.youtube.com/results?search_query=Prokofiev+plays+Andante+Sonata+No.+4+1935" target="_blank" rel="noopener">Prokofiev, 1935</a>`],src:'Cho 2023, pp. 2, 15–17; classicalconnect.com'},

 {id:'reception',t:'Reception',body:`
   <p>Among the nine sonatas, No. 4 is one of the least played. The Third and Seventh dominate concert programmes, and the three “War Sonatas” (Nos. 6–8) have received most of the scholarly attention. The Fourth, with the Fifth and Ninth, has been comparatively neglected.</p>
   <p>Yet critics and performers have rated it highly. In 1948 the English pianist Frank Merrick counted Prokofiev’s sonatas among “true sonatas” in the line of Haydn, Mozart and Beethoven. Harlow Robinson notes that the work is less exhibitionistic than Prokofiev’s other piano music. Some consider it the masterpiece of the nine.</p>
   <p>Its quietness may be one reason for its neglect. The first two movements avoid display, and the brilliance arrives only in the finale. For a student it is a rare chance to play a Prokofiev sonata whose difficulties are mainly musical: voicing, pedalling and phrasing rather than speed.</p>`,
   rel:[W('Sonata No. 3, Op. 28','Prokofiev Piano Sonata No.3'),W('Sonata No. 7, Op. 83','Prokofiev Piano Sonata No.7')],src:'Merrick 1948; Robinson 2002, p. 133; Cho 2023, pp. 3–4'}
];}

function route(){
  const h=location.hash.replace('#','');
  let m;
  if(!h||h==='home'){window.scrollTo(0,0);return home()}
  if(m=h.match(/^w-(\w+)$/)){window.scrollTo(0,0);return workPage(m[1])}
  if(h==='piece'){window.scrollTo(0,0);return shell('',pieceHome())}
  if(m=h.match(/^bar-I+-(\d+)$/)){window.scrollTo(0,0);return shell('score',barView('I',+m[1]),()=>bindBar('I',+m[1]))}
  if(m=h.match(/^motif-(\w+)$/)){window.scrollTo(0,0);return shell('connections',motifView(m[1]))}
  if(h.startsWith('score')){shell('score',scoreView(),bindScore);return}
  const fns={context:contextView,perspectives:perspView,structure:structureView,connections:connView,other:otherView,stats:statsView,listening:listenView,sources:sourcesView};
  window.scrollTo(0,0);

  home();
}

  const prev=b>0?`bar-I-${b-1}`:null, next=b<TOTAL.I?`bar-I-${b+1}`:null;

  const oth=OTHER.filter(o=>o.bar&&a&&o.bar[1]>=a.from&&o.bar[1]<=a.to||o.bar&&o.bar[1]===b);

   <div class="vh bhead"><div><div class="label">${esc(sec[0])}${sec[3]?' · '+esc(sec[3]):''}</div><h1>${b===0?'Upbeat':'Bar '+b}</h1></div>
     <div class="bnav"><button class="iconbtn" ${prev?`data-go="${prev}"`:'disabled'} aria-label="Previous bar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg></button>
       <button class="btn line" id="onScore">Score</button>
       <button class="iconbtn" ${next?`data-go="${next}"`:'disabled'} aria-label="Next bar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></button></div></div>

const STOP=new Set(['in','minor','major','no','op','the','of','on','a','c','d','e','b','s','j','and','sonata','variations','symphony']);
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function findWorks(n){
  const toks=n.split(/[^a-z0-9]+/).filter(t=>t&&!STOP.has(t));
  if(!toks.length) return [];
  return WORKS.filter(w=>{const words=(w.comp+' '+w.t+' '+w.al).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(Boolean);
    return toks.every(t=>words.some(x=>x===t||(t.length>=4&&(x.startsWith(t)||lev(t,x)<=2))))});
}
function formulaSvg(){

  s+=`<text x="14" y="40" font-size="30" fill="var(--ink)" font-family="serif">𝄢</text>`;
  xs.forEach((x,i)=>{const y=56-steps[i]*5;
    if(names[i].includes('♭')) s+=`<text x="${x-17}" y="${y+5}" font-size="16" fill="var(--ink)" font-family="serif">♭</text>`;
    if(y>=56) s+=`<line x1="${x-10}" x2="${x+10}" y1="66" y2="66" stroke="var(--muted)"/>`;

    <div class="card wbox"><p>${w.ctx}</p></div>
    <div class="sec-title">The idea it shares</div>
    <div class="card wbox idea"><div><h3>The descending chromatic fourth</h3><p>A bass that falls by semitones from the tonic to the dominant. For Rosen it is a common tool of tonal music, not a symbol with a fixed meaning: it sounds serious in many pieces, but what it expresses depends on the music around it.</p></div>${formulaSvg()}</div>
    <div class="sec-title">Linked pieces</div>
    <div class="card">${w.links.map(([id,why])=>`<button class="mrow" data-go="w-${id}"><span class="mn">${wById[id].comp.split(' ').pop()} · ${wById[id].t}</span><span class="refs" style="font-family:var(--f-body);font-size:14px">${why}</span></button>`).join('')}</div>
    <div class="srcl">Charles Rosen, Music and Sentiment (Yale University Press, 2010), pp. 24–27</div>
   </div></main>`;
}

/* fetch every score page up front so excerpts are never blank */
const PRELOAD=GEOM.I.map(pg=>{const im=new Image();im.src=`score/p${String(pg.p).padStart(2,'0')}.png`;return im});
route();
</script>
