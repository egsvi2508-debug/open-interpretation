<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Interpretation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: empty search → one result → piece home of window tiles → each window full-page; bar windows reached from markers above every bar. */
:root{
  --paper:#F3F4F6; --surface:#FFFFFF; --sunk:#E9EBEF;
  --ink:#15171C; --muted:#5A6070; --faint:#8A90A0; --line:#D9DCE3;
  --pencil:#2347C8; --pencil-ink:#1B3AA8; --pencil-soft:rgba(35,71,200,.10); --pencil-mid:rgba(35,71,200,.24);
  --heat:#D9A21B; --heat-soft:rgba(217,162,27,.16);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --score-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101217; --surface:#171A21; --sunk:#1E222B; --ink:#E8EAF0; --muted:#A1A7B6; --faint:#727889; --line:#2A2F3B;
  --pencil:#8AA4FF; --pencil-ink:#A9BCFF; --pencil-soft:rgba(138,164,255,.12); --pencil-mid:rgba(138,164,255,.28);
  --heat:#E2B23C; --heat-soft:rgba(226,178,60,.16);
  --score-filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.95); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101217; --surface:#171A21; --sunk:#1E222B; --ink:#E8EAF0; --muted:#A1A7B6; --faint:#727889; --line:#2A2F3B;
  --pencil:#8AA4FF; --pencil-ink:#A9BCFF; --pencil-soft:rgba(138,164,255,.12); --pencil-mid:rgba(138,164,255,.28);
  --heat:#E2B23C; --heat-soft:rgba(226,178,60,.16);
  --score-filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.95); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit}
a{color:var(--pencil-ink)}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* home */
.home{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-top:22vh;padding-inline:16px}
.home .mark{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);font-weight:500;letter-spacing:-.01em;margin-bottom:26px}
.sform{width:100%;max-width:620px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;transition:border-color .15s,box-shadow .15s}
.sform:focus-within{border-color:var(--pencil);box-shadow:0 0 0 4px var(--pencil-soft)}
.sform input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;padding:16px 8px 16px 24px;outline:none}
.sform input::-webkit-search-cancel-button{display:none}
.sform button{border:0;background:none;cursor:pointer;padding:12px 18px;color:var(--muted);display:grid;place-items:center}
.sform button:hover{color:var(--pencil-ink)}
.sform svg{width:20px;height:20px}
.res{width:100%;max-width:620px;margin-top:18px}
.res-item{display:flex;width:100%;text-align:left;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;cursor:pointer}
.res-item:hover{border-color:var(--pencil)}
.res-item b{font-family:var(--f-display);font-size:20px;font-weight:600;display:block}
.res-item span{color:var(--muted);font-size:14px}
.res-item i{margin-left:auto;font-style:normal;color:var(--pencil-ink);font-size:20px}
.res-none{color:var(--muted);padding:12px 4px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:center;gap:12px;padding-block:10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--pencil)}
.iconbtn svg{width:16px;height:16px}
.ptitle{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.ptitle b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{font-size:12px;color:var(--muted);display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button:hover{background:var(--sunk);color:var(--ink)}
.tabs button.on{background:var(--pencil-soft);color:var(--pencil-ink)}

.view{padding-block:28px 80px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,5vw,44px);line-height:1.05}

/* piece home */
.phead{padding-block:40px 28px}
.phead .comp{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil-ink);font-weight:600}
.phead h1{font-family:var(--f-display);font-weight:500;font-size:clamp(36px,7vw,64px);line-height:1.02;letter-spacing:-.02em;margin-top:8px}
.phead h1 em{font-style:italic;font-weight:400;color:var(--muted);font-size:.55em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--pencil);transform:translateY(-2px)}
.tile .num{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.tile b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.tile.big{grid-column:span 2;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tile.big .num{color:var(--paper);opacity:.6}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile{min-height:104px;padding:16px}.tile b{font-size:21px}}

/* generic cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.kv{display:grid;grid-template-columns:180px 1fr;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv>div{padding:14px 18px}
.kv>div:first-child{color:var(--muted);font-size:14px;font-weight:600}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv>div:first-child{padding-bottom:0}}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--pencil-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--pencil);background:var(--pencil-soft)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:30px 0 10px}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:16px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}

/* score */
.sheet{position:relative;line-height:0;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:860px;margin:0 auto}
.sheet img{width:100%;height:auto;display:block;filter:var(--score-filter)}
.bz{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:3px}
.bz:hover,.bz.flash{background:var(--pencil-soft);box-shadow:inset 0 0 0 1.5px var(--pencil)}
.mk{position:absolute;transform:translate(-2px,-55%);border:1px solid var(--pencil);background:var(--surface);color:var(--pencil-ink);border-radius:6px;padding:1px 5px 2px;font-family:var(--f-mono);font-size:11px;line-height:1.3;cursor:pointer;display:flex;align-items:center;gap:3px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mk:hover{background:var(--pencil);color:var(--surface)}
.mk.has{background:var(--pencil);color:var(--surface)}
.mk i{width:6px;height:6px;border-radius:50%;display:inline-block;border:1px solid var(--surface)}
@media (max-width:600px){.mk{font-size:9px;padding:0 3px}.mk i{width:4px;height:4px}}

/* bar window */
.bnav{display:flex;gap:8px;align-items:center}
.bhead h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1}
.bhead .sub{color:var(--muted);margin-top:6px}
.snip{position:relative;overflow:hidden;background:#fff;border-radius:10px;border:1px solid var(--line);margin-top:18px}
.snip img{position:absolute;display:block;max-width:none;filter:var(--score-filter)}
.snip .hl{position:absolute;top:0;bottom:0;background:var(--pencil-soft);box-shadow:inset 0 0 0 2px var(--pencil);border-radius:3px}
.bgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:18px;align-items:start}
@media (max-width:860px){.bgrid{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.box+.box{margin-top:16px}
.box h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.box h4{font-family:var(--f-display);font-size:22px;font-weight:600;margin-bottom:8px}
.box .src{font-size:12px;color:var(--faint);font-family:var(--f-mono);margin-top:10px}
.ip{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ip:first-of-type{border-top:0;padding-top:0}
.ip b{font-size:14px}
.ip small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:480px){.ip{grid-template-columns:1fr;gap:2px}}
.mrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mrow .mn{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.mrow .mn i{width:10px;height:10px;border-radius:50%}
.none{color:var(--faint);font-size:14px}

/* comments */
.cmt{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cmt:first-of-type{border-top:0;padding-top:2px}
.vote{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;padding:5px 0 4px;height:fit-content}
.vote svg{width:11px;height:11px}
.vote span{font-family:var(--f-mono);font-size:13px}
.vote:hover{border-color:var(--pencil)}
.vote.on{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.by{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.by b{color:var(--ink)}
.role{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.cmt p{font-size:15px;margin-top:3px}
.replies{margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
.compose{display:flex;gap:8px;margin-top:12px}
.compose textarea{flex:1;min-width:0;min-height:44px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:var(--paper);color:var(--ink)}
.compose textarea:focus{outline:none;border-color:var(--pencil)}
.btn{border:0;border-radius:10px;background:var(--pencil);color:var(--surface);font-weight:700;padding:0 16px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--pencil-ink)}
.btn.line{background:var(--surface);color:var(--pencil-ink);border:1px solid var(--line);padding:8px 14px}

/* structure */
.fm{padding:18px}
.fm+.fm{margin-top:14px}
.fm h3{font-family:var(--f-display);font-size:22px;font-weight:600;margin-bottom:12px}
.bands-x{overflow-x:auto}
.bands{display:flex;gap:2px;height:58px;min-width:620px}
.band{min-width:0;border:0;border-radius:5px;padding:6px 7px;text-align:left;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--sunk)}
.band:hover{outline:2px solid var(--pencil)}
.band b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.band.g1{background:var(--pencil-soft)}.band.g2{background:var(--heat-soft)}.band.g3{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.band small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* interpretations */
.q{margin-bottom:14px;overflow:hidden}
.q-h{padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.q-h b{font-size:18px}
.q-p{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.pos{padding:14px 20px;border-top:1px solid var(--line);border-right:1px solid var(--line);margin:-1px -1px 0 0;display:flex;flex-direction:column;gap:6px}
.pos .who{font-weight:700}
.pos .how{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pos p{font-size:15px;flex:1}
.agree{display:flex;align-items:center;gap:10px}
.agree button{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;flex:none}
.agree button.on{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.agree button svg{width:11px;height:11px}
.meter{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pencil)}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:36px;text-align:right}

/* connections */
.arcs{overflow-x:auto;padding:14px}
.arcs svg{display:block;min-width:700px;width:100%;height:auto}
.arc{fill:none;stroke-width:2;opacity:.75;cursor:pointer}
.arc:hover{opacity:1;stroke-width:3.5}
.dim .arc{opacity:.12}.dim .arc.on{opacity:1;stroke-width:3}
.node{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.legend button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.legend button.on{border-color:var(--ink)}
.legend i{width:9px;height:9px;border-radius:50%}
.mlist .mrow{padding:12px 18px}
.mlist .mrow:first-of-type{padding-top:12px}
.work{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.work:first-child{border-top:0}
.work b{display:block}
.work span{font-size:14px;color:var(--muted)}

/* sources */
.srcg{padding:6px 0}
.srcg .s{padding:12px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}
.srcg .s:first-child{border-top:0}
.srcg .s small{display:block;color:var(--muted);font-size:13px}

/* discussion */
.dl .cmt{padding:14px 18px}
.dl .cmt:first-of-type{padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60}
</style>
</head>

  links:['I-1','I-61','III-40'],
  c:[C('Lena K.','Student',61,'I think of it as a cello section tuning in the dark, not a piano figure. Fingers stay on the keys, no accent on the first note.'),
     C('M. Hartl','Teacher',44,'Count the upbeat as two real beats. Students rush it because it looks like an ornament, and then the theme starts in the wrong place.',[C('Jonas W.','Student',9,'This fixed my entry. I was treating it as a pickup flourish.')]),
     C('Imported · comment under a live recording','Imported',23,'My teacher studied in Moscow and called this opening “the floorboards creaking”. It has stuck with me for twenty years.')]},
 {id:'I-1',mv:'I',from:1,to:3,title:'Theme 1, first phrase',sec:'First theme · antecedent 1',tags:['phrasing','metre','tempo'],
  a:'Theme 1 is built from two pairs of question-and-answer phrases (mm. 1–4, 4–7, 7–12, 12–17). Every phrase is made of two-beat slurs written against a 3/4 bar, so the metre is constantly blurred. The first cadence (mm. 3–4) puts its accent on the second-to-last chord, while the inner voice falls B♭–A♭–G.',
  src:['Cho 2023, pp. 19–21, 54–55'],
  ip:[IP('Sándor','recording, Vox 1993','Separates every phrase: ritenuto and diminuendo into each cadence, then a clear breath.'),
      IP('Berman','recording, Chandos 1998; book 2008','Hardly separates the phrases in sound, but his book asks for the cadences in mm. 4, 7, 12 and 17 to be finished smoothly.'),
      IP('Both','tempo','Play the movement at about ♩ = 88–90.','syn'),
      IP('Cho','synthesis','Keep the two-beat slurs legato, let the four phrases breathe, and make each one sound different.','syn')],
  links:['I-4','I-107','Q-phrasing'],
  c:[C('Sofia R.','Performer',52,'The two-beat slurs are a trap. If you lift after every slur it turns into hiccups. I play the slurs with the fingers and the phrase with the arm.'),
     C('Daniel P.','Student',31,'Listening to Sándor and Berman back to back is the best lesson for this bar. Same notes, a completely different idea of where the phrase ends.'),
     C('Ana T.','Musicologist',18,'The 2-against-3 writing prepares the hemiolas in the development (mm. 107–109), which Berman calls Brahmsian. You can hear the seed here.')]},
 {id:'I-4',mv:'I',from:4,to:6,title:'Theme 1, the answer',sec:'First theme · consequent 1',tags:['voicing','cadence'],
  a:'The same melody as the first phrase with a different ending. Now the accent falls on the last chord and the inner voice climbs A♯–B–C, so the cadence leans forward into the next phrase instead of settling.',
  src:['Cho 2023, p. 21'],ip:[IP('Cho','thesis','Make the difference audible: the first cadence sinks, the second lifts.','syn')],links:['I-1'],
  c:[C('M. Hartl','Teacher',27,'Play only the inner voice of mm. 3–4 and then of mm. 6–7. Falling, then rising. Then put the melody back on top.'),
     C('Felix B.','Student',6,'Is the accent on the last chord a real accent or just weight? In my edition it looks almost like a tenuto.')]},
 {id:'I-7',mv:'I',from:7,to:11,title:'Theme 1, second pair',sec:'First theme · antecedent 2',tags:['phrasing'],
  a:'The second question phrase stretches to five bars (mm. 7–12). The risk here is losing the long line: the two-beat slurs should never break the larger shape.',
  src:['Cho 2023, pp. 20, 55'],ip:[IP('Sándor','recording','A clear breath before m. 7.'),IP('Berman','recording','Lets m. 7 grow out of the previous cadence without a gap.')],links:['I-1','I-12'],
  c:[C('Lena K.','Student',12,'Colour-coding the four phrases, like Cho does in her Example 5.1, was the first thing that helped me memorise this page.')]},
 {id:'I-12',mv:'I',from:12,to:16,title:'Last phrase, poco rit. and the 4/4 bar',sec:'First theme · consequent 2',tags:['tempo','metre'],
  a:'The last phrase of the theme (mm. 12–17). Watch the written poco rit. and the a tempo pp right after it, and the single 4/4 bar (m. 16) that stretches the final cadence before the transition.',

  c:[C('Jonas W.','Student',14,'The 4/4 bar is the strangest moment on the page. One extra beat and the music seems to hold its breath.'),
     C('Sofia R.','Performer',9,'Don’t make the poco rit. too big. Prokofiev writes it and cancels it one bar later.')]},
 {id:'I-17',mv:'I',from:17,to:18,title:'Transition: the grace notes',sec:'Transition',tags:['ornaments','character'],
  a:'The transition combines three ideas: stepwise lines decorated with slurred grace notes, a two-note sigh turned upside down (the second note rises and takes the stress), and the oscillating sixteenths from the opening, now leaning on G.',
  src:['Cho 2023, pp. 21, 55–56','Sándor, On Piano Playing, p. 207'],
  ip:[IP('Sándor','edition 1967; book 1981','Slurred grace notes belong to the main note, so they go on the beat. His recording makes the transition dramatic.'),
      IP('Berman','book 2008','The slurred grace notes should be melodic. He plays the whole transition softly.'),
      IP('Cho','synthesis','Melodic, but let the sf and the articulation mark the change of character.','syn')],
  links:['Q-grace','I-19','I-37'],
  c:[C('Daniel P.','Student',38,'I tried Sándor’s on-the-beat grace notes and the passage suddenly sounded like Bartók. Makes sense, given who his teacher was.'),
     C('Ana T.','Musicologist',21,'Worth knowing: the rule “slurred = on the beat, unslurred = before the beat” comes from Sándor’s own book, not from Prokofiev.'),
     C('Mira S.','Student',4,'espress. and mp in m. 17 feel closer to Berman’s reading to me.')]},
 {id:'I-19',mv:'I',from:19,to:20,title:'The sf accents',sec:'Transition',tags:['dynamics','character'],
  a:'Two sf marks in a row (mm. 19 and 20, again in 25–26), inside an mp, espressivo passage. How hard should they be? Note also that the bass staff is empty here: the right hand alone carries the texture.',
  src:['Cho 2023, p. 56'],ip:[IP('Sándor','recording','Stresses the sf strongly, to set the transition apart from the gentle first theme.'),IP('Berman','recording','Keeps them inside a soft, melodic transition.')],
  links:['I-17','Q-grace'],
  c:[C('M. Hartl','Teacher',33,'An sf in mp is not an sf in f. Think of a sudden pang, not a hit.',[C('Daniel P.','Student',11,'I disagree a bit. Prokofiev wrote sf, not sfp. I think he wanted the shock.')])]},
 {id:'I-21',mv:'I',from:21,to:22,title:'Transition continues',sec:'Transition',tags:['tempo'],
  a:'Still no left hand. The sixteenth-note groups in the right hand begin to drive the music toward G, the dominant, where the oscillating figure of the opening returns.',
  src:['Cho 2023, p. 21'],ip:[],links:['I-up','I-37'],
  c:[C('Jonas W.','Student',7,'Without the left hand this is where it’s easiest to rush. I practise with the metronome on beats 2 and 3 only.')]},
 {id:'I-37',mv:'I',from:37,to:39,title:'Arriving in E-flat',sec:'Transition → second theme',tags:['tempo','harmony'],
  a:'The transition wanders through unstable keys before the second theme lands in E♭ major. Both pianists prepare the arrival.',
  src:['Cho 2023, pp. 21, 57'],ip:[IP('Sándor','recording','Slows down from m. 37 and plants the bass E♭ clearly.'),IP('Berman','recording; edition 2011','Calms tempo and dynamics and places the E♭ carefully.')],links:['I-40'],
  c:[C('Sofia R.','Performer',15,'The E♭ in the bass is the whole point. Everything before it should sound like searching.')]},
 {id:'I-40',mv:'I',from:40,to:60,title:'Second theme: two keys pulling',sec:'Second theme',tags:['harmony','ornaments','bitonality'],
  a:'Over an E♭ bass, the sweeping grace notes lead to D, so the music pulls between E♭ major and G minor at once. The chromatic left hand, marked il basso pesante, blurs the key further.',
  src:['Cho 2023, pp. 21, 56'],ip:[IP('Sándor','book 1981','These grace notes connect two notes and go before the beat.'),IP('Cho','synthesis','Relaxed fingers, attention in the fingertips, so the three or four grace notes sound even and brisk.','syn')],links:['I-37','I-162'],
  c:[C('Lena K.','Student',29,'Bitonal, but it shouldn’t sound “modern”. My teacher said: two memories playing at once.')]},
 {id:'I-61',mv:'I',from:61,to:70,title:'Closing section with a smirk',sec:'Closing',tags:['rhythm','humour'],
  a:'Ascending pairs of chords stress the third beat (rhythmic displacement). The left hand moves V–I while the right hand plays ii–V7 pairs. From m. 65 the opening murmur joins in. The final tonic chord gets a tiny neighbour grace note (D): a tongue-in-cheek ending.',
  src:['Cho 2023, p. 22'],ip:[],links:['I-up','I-194'],
  c:[C('Ana T.','Musicologist',19,'This is Prokofiev’s “scherzo-ish” line in miniature: a perfectly correct cadence with a smirk on it.')]},
 {id:'I-107',mv:'I',from:107,to:116,title:'Brahmsian hemiolas',sec:'Development B3',tags:['metre','voicing'],
  a:'Theme 1 appears twice in the left hand while the right hand plays its opening in hemiolas. In mm. 109–110 the transition idea sounds in both hands, the left hand crossing over the right.',
  src:['Cho 2023, p. 25','Berman 2008, p. 85'],ip:[IP('Berman','book 2008','Hears this passage as Brahmsian, because of the hemiolas.')],links:['I-1'],
  c:[C('Daniel P.','Student',17,'Play Brahms Op. 118 No. 1 the same week. You’ll hear exactly what Berman means.')]},
 {id:'I-117',mv:'I',from:117,to:125,title:'Three steps to the climax',sec:'Development C',tags:['dynamics','pedal point'],

 {id:'I-132',mv:'I',from:132,to:137,title:'Climax, silence, Neapolitan',sec:'Development C → recapitulation',tags:['silence','harmony'],

  c:[C('Sofia R.','Performer',41,'Count the silence. Every performer I admire holds it a little longer than written, but they all count it.')]},
 {id:'I-162',mv:'I',from:162,to:183,title:'Second theme, now in C major',sec:'Recapitulation',tags:['harmony','dynamics'],
  a:'The second theme returns in a clear C major, the grace notes now sweeping up to B, the leading tone. The dynamics are softer than in the exposition.',src:['Cho 2023, p. 28'],ip:[],links:['I-40'],c:[]},
 {id:'I-194',mv:'I',from:194,to:197,title:'An ironic last cadence',sec:'Closing',tags:['harmony','humour'],
  a:'A plain V–I with chromatic neighbour notes (C♯ and F♯) inside the chords. A dissonance in a consonant chord gives the ending an ironic edge.',src:['Cho 2023, p. 28'],ip:[],links:['I-61','III-222'],

 {id:'II-1',mv:'II',from:1,to:4,title:'Theme A: how to play the left-hand thirds',sec:'Theme A',tags:['articulation','pedal','orchestration'],
  a:'A dark theme in A minor rises slowly from the bass. Under it, repeated thirds climb a step every bar. There are no articulation or pedal marks, so every pianist has to decide how the thirds sound. The composer left two clues: his own recording, and his orchestral version.',
  src:['Cho 2023, pp. 29, 58–59','Berman 2008, pp. 94–95'],
  ip:[IP('Prokofiev','own recording, 1935','Detached and short, no pedal.','comp'),
      IP('Op. 29 bis','orchestral version, 1934','Bassoons and contrabassoon, tenuto over staccato; double basses pizzicato.','orch'),
      IP('Sándor','recording','Short and without pedal, but not staccatissimo.'),
      IP('Berman','recording; edition','Detached but a bit longer. His edition suggests short, shallow pedal.'),
      IP('Cho','synthesis','Longer than staccato, clearly detached. If you pedal, change on every eighth.','syn')],
  links:['Q-thirds','II-5','III-83','N-andante'],
  c:[C('M. Hartl','Teacher',72,'Before you decide on pedal, listen to Prokofiev’s own 1935 recording. It is completely dry, like bassoons. Then decide.'),
     C('Lena K.','Student',40,'Thinking “bassoons” changed my touch completely. Less finger, more weight, then release.'),
     C('Imported · comment under the composer’s recording','Imported',26,'He starts around ♩ = 48 and then moves the tempo from section to section. It sounds more like speech than a fixed pulse.'),
     C('Jonas W.','Student',5,'Shallow pedal on a dry Bösendorfer and on a big Steinway are two different things. Try both in the hall.')]},
 {id:'II-5',mv:'II',from:5,to:9,title:'Stretto',sec:'Theme A',tags:['counterpoint','voicing'],
  a:'Before the theme has finished, a second statement enters in the left hand (m. 5), moving against it in contrary motion. It passes to the right hand at the high D (m. 7), and a third, incomplete statement begins in m. 8: a fugal device inside a lyrical melody.',
  src:['Cho 2023, pp. 29–30'],ip:[],links:['II-1','II-25'],
  c:[C('Ana T.','Musicologist',24,'Mark each entry with a different coloured pencil. You need to know who has the theme at every moment.'),C('Mira S.','Student',6,'The hand-over at m. 7 is so hard to make seamless.')]},
 {id:'II-10',mv:'II',from:10,to:12,title:'First arrival',sec:'Theme A',tags:['harmony','dynamics'],
  a:'The stretto ends in a dissonant chord that resolves to a G major triad in m. 10, repeated in m. 12: the dominant of C major, the relative major. Note the ff > p inside a single bar.',
  src:['Cho 2023, p. 30'],ip:[],links:['II-5'],
  c:[C('Sofia R.','Performer',11,'ff > p within one bar. The decay matters more than the attack.')]},
 {id:'II-13',mv:'II',from:13,to:14,title:'Variation 1: four layers',sec:'Variation 1',tags:['texture','pedal','fingering'],
  a:'Four layers at once: the melody on top, broken-chord sixteenths in the alto, staccato leaping octaves in the tenor, and a half-note bass.',
  src:['Cho 2023, pp. 30–31, 59–60'],
  ip:[IP('Sándor & Berman','recordings','Both connect melody and bass with the pedal while keeping each voice’s articulation clear.'),
      IP('Berman','edition 2011','Fingering for the alto that keeps it even and quiet.'),
      IP('Cho','synthesis','Pedal on each half note of the bass, half-change on the alto’s last eighth; connect the melody with the fingers.','syn')],
  links:['II-15'],
  c:[C('M. Hartl','Teacher',35,'Practise soprano and bass alone until they sing. Then add the alto at a whisper. The tenor comes last.'),C('Felix B.','Student',9,'This is the bar where I finally understood what half pedal is for.')]},
 {id:'II-15',mv:'II',from:15,to:17,title:'Theme in the left-hand octaves',sec:'Variation 1',tags:['voicing','pedal'],

 {id:'II-22',mv:'II',from:22,to:23,title:'Climax: black keys against white',sec:'Variation 1',tags:['harmony'],
  a:'The tension peaks on D♭ major and bursts into D minor 9 (ii9 of C). Cho describes it as a contrast between black keys and white keys.',src:['Cho 2023, p. 32'],ip:[],links:['II-15'],c:[]},
 {id:'II-25',mv:'II',from:25,to:32,title:'Variation 2: a mirror',sec:'Variation 2',tags:['counterpoint','inversion'],

 {id:'II-33',mv:'II',from:33,to:35,title:'Quasi cadenza: the 12/8 question',sec:'Quasi cadenza',tags:['tempo','hand crossing'],
  a:'Forte octaves, trills, arpeggios and accented minor triads descending in the left hand. The metre suddenly changes to 12/8. How does the new pulse relate to the old one?',

      IP('Prokofiev','own recording, 1935','Slower and heavier: about ♩. = 46 here, against ♩ ≈ 72 just before.','comp'),

  links:['Q-cadenza','II-1'],

 {id:'II-36',mv:'II',from:36,to:38,title:'Bridge: two keys, very calm',sec:'Bridge',tags:['bitonality'],

 {id:'II-39',mv:'II',from:39,to:53,title:'Theme B: white keys, fairy tale',sec:'Theme B',tags:['tone','pedal'],

 {id:'II-71',mv:'II',from:71,to:80,title:'Themes A and B together',sec:'A + B combined',tags:['polymeter','pedal'],

 {id:'II-81',mv:'II',from:81,to:88,title:'Coda: A minor or A minor 7?',sec:'Coda',tags:['text question','voicing'],

  ip:[IP('Sándor','edition 1967','Last chord: A minor, no G. Rolls the chords slowly and lights up the C♯ in m. 86.'),

 {id:'III-1',mv:'III',from:1,to:1,title:'The opening flourish',sec:'A',tags:['gesture','history'],
  a:'A glissando-like run over almost three octaves, hands alternating. It recalls written-out improvisation in older keyboard music: Haydn’s Sonata Hob. XVI:50 (II), Mozart’s Fantasy K. 396, Bach’s Chromatic Fantasy BWV 903.',
  src:['Cho 2023, p. 41'],ip:[],links:['III-201','N-haydn'],
  c:[C('Sofia R.','Performer',34,'Curtain up. It’s not a scale, it’s a gesture. Practise it slowly with the arm only, then forget about the notes.'),C('Jonas W.','Student',12,'Hand alternation: I let the left hand start a hair early so the join never shows.')]},
 {id:'III-2',mv:'III',from:2,to:9,title:'Theme A: correct, with wrong notes',sec:'A · antecedent',tags:['harmony','fingering'],
  a:'A broken-chord accompaniment and a textbook I–N6–V–I progression, but appoggiaturas on the first beats produce “wrong notes”. In mm. 7–8 the wide arpeggios raise a fingering question.',

 {id:'III-10',mv:'III',from:10,to:17,title:'Alberti bass in tenths',sec:'A · consequent',tags:['technique','left hand'],

 {id:'III-25',mv:'III',from:25,to:39,title:'Bridge 1: a hidden pattern',sec:'Bridge 1',tags:['memory','harmony'],
  a:'The right hand’s groups of four rising sixteenths look irregular, but the first beats trace a whole-tone line (E–F♯–G♯–A♯–B♯–D…), every other arpeggio is a diminished chord, and the bass rises in major thirds (C–E–G♯). Knowing this makes the passage much easier to memorise.',

  c:[C('Lena K.','Student',49,'This one paragraph saved me a week of memory work. Exactly the kind of thing a teacher tells you once and you never forget.')]},

 {id:'III-43',mv:'III',from:43,to:66,title:'Theme B: uneasy',sec:'B',tags:['fingering','relaxation'],

 {id:'III-83',mv:'III',from:83,to:95,title:'Theme C: A-flat Lydian',sec:'C',tags:['tempo','tone','mode'],

    const l=(x0-cx)/cw*100,t=(sys.y[0]-cy)/ch*100,w=(x1-x0)/cw*100,h=(sys.y[1]-sys.y[0])/ch*100;
    const mot=motifsAt(scoreMv,b), has=!!annFor(scoreMv,b);
    m+=`<button class="bz" id="bz-${b}" data-go="bar-${scoreMv}-${b}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%" aria-label="${one(b)}"></button>`;
    m+=`<button class="mk${has?' has':''}" data-go="bar-${scoreMv}-${b}" style="left:${l+0.6}%;top:${t}%">${b===0?'up':b}${mot.map(x=>`<i style="background:${x.col}"></i>`).join('')}</button>`;
  }});
  return `<div class="view"><div class="vh"><h1>Score</h1><div class="seg">${MV.map(v=>`<button class="${v===scoreMv?'on':''}" data-go="score-${v}">${v}</button>`).join('')}</div></div>
    <div class="sheet"><img src="${S.img}" alt="Score, movement ${scoreMv}" width="${cw}" height="${ch}">${m}</div></div>`;
}
let flashBar=null;
function bindScore(){if(flashBar&&flashBar[0]===scoreMv){const el=document.getElementById('bz-'+flashBar[1]);if(el){el.classList.add('flash');el.scrollIntoView({block:'center'});setTimeout(()=>el.classList.remove('flash'),1600)}}flashBar=null}

/* ---------- bar window ---------- */
function barView(mv,b){
  const total=SCORE[mv].total, min=mv==='I'?0:1;
  b=Math.max(min,Math.min(total,b));
  const a=annFor(mv,b), sec=secAt(mv,b), mot=motifsAt(mv,b), g=geom(mv,b);
  let snip='';
  if(g){const S=SCORE[mv],[cx,cy,cw,ch]=S.crop,sx0=g.sys.xs[0],sx1=g.sys.xs.at(-1),sy0=g.sys.y[0],sy1=g.sys.y[1],W=sx1-sx0,H=sy1-sy0;
    snip=`<div class="snip" style="aspect-ratio:${W}/${H}"><img src="${S.img}" alt="" style="width:${cw/W*100}%;left:${-(sx0-cx)/W*100}%;top:${-(sy0-cy)/H*100}%"><div class="hl" style="left:${(g.x0-sx0)/W*100}%;width:${(g.x1-g.x0)/W*100}%"></div></div>`}
  const prev=b>min?`bar-${mv}-${b-1}`:null, next=b<total?`bar-${mv}-${b+1}`:null;
  // connections
  const conn=mot.map(m=>{const others=m.refs.filter(r=>!(r[0]===mv&&b>=r[1]&&b<=r[2]));return `<div class="mrow"><span class="mn"><i style="background:${m.col}"></i>${m.name}</span><div class="chips">${others.map(r=>chip(r[0],r[1],m.col)).join('')}</div></div>`}).join('');
  const linked=a?a.links.filter(l=>annById[l]).map(l=>chip(annById[l].mv,annById[l].from)).join(''):'';
  const qs=a?a.links.filter(l=>l.startsWith('Q-')).map(l=>QUESTIONS.find(q=>q.id===l)).filter(Boolean):[];
  const sorted=a?[...a.c].sort((x,y)=>voteVal(y)-voteVal(x)):[];
  return `<div class="view">
   <div class="vh bhead"><div><div class="label">Movement ${mv}</div><h1>${b===0?'Upbeat':'Bar '+b}</h1><div class="sub">${esc(sec[0])}${sec[3]?' · '+esc(sec[3]):''}</div></div>
     <div class="bnav"><button class="iconbtn" ${prev?`data-go="${prev}"`:'disabled'} aria-label="Previous bar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg></button>
       <button class="btn line" id="onScore">Score</button>
       <button class="iconbtn" ${next?`data-go="${next}"`:'disabled'} aria-label="Next bar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></button></div></div>
   ${snip}
   <div class="bgrid"><div>
     <div class="box"><h3><span>Analysis</span>${a&&a.a?`<span class="mono">${bl(a.from,a.to)}</span>`:''}</h3>${a&&a.a?`<h4>${esc(a.title)}</h4><p>${esc(a.a)}</p><div class="src">${a.src.map(esc).join(' · ')}</div>`:'<p class="none">—</p>'}</div>
     <div class="box"><h3>Interpretations</h3>${a&&a.ip.length?a.ip.map(p=>`<div class="ip"><div><b>${esc(p.who)}</b><small>${esc(p.how)}</small></div><p>${esc(p.t)}</p></div>`).join(''):'<p class="none">—</p>'}
       ${qs.length?`<div class="chips" style="margin-top:12px">${qs.map(q=>`<button class="chip" data-go="interpretations">${esc(q.title)}</button>`).join('')}</div>`:''}</div>
     <div class="box"><h3><span>Discussion</span><span class="mono">${sorted.length}</span></h3><div id="cl">${sorted.map(c=>cmt(c)).join('')||''}</div>
       <div class="compose"><textarea id="nc" aria-label="Comment"></textarea><button class="btn" id="post">Post</button></div></div>
   </div><div>
     <div class="box"><h3>Connected bars</h3>${conn||linked?'' :'<p class="none">—</p>'}${conn}${linked?`<div class="mrow"><span class="mn">See also</span><div class="chips">${linked}</div></div>`:''}</div>
     <div class="box"><h3>Position</h3>
       <div class="mrow"><span class="mn">Movement</span><span>${esc(FORMS[mv].title)}</span></div>
       <div class="mrow"><span class="mn">Section</span><span>${esc(sec[0])} (mm. ${sec[1]}–${sec[2]})</span></div>
       ${sec[3]?`<div class="mrow"><span class="mn">Key</span><span>${esc(sec[3])}</span></div>`:''}</div>
   </div></div></div>`;
}
function cmt(c){return `<div class="cmt"><button class="vote${voted.has(c.key)?' on':''}" data-key="${c.key}" aria-label="Upvote">${upSvg}<span>${voteVal(c)}</span></button><div><div class="by"><b>${esc(c.u)}</b><span class="role">${esc(c.r)}</span></div><p>${esc(c.t)}</p>${c.replies&&c.replies.length?`<div class="replies">${c.replies.map(cmt).join('')}</div>`:''}</div></div>`}
function bindBar(mv,b){
  $('#onScore').onclick=()=>{flashBar=[mv,b];go('score-'+mv)};
  $('#post').onclick=()=>{const t=$('#nc').value.trim();if(!t)return;
    let a=annFor(mv,b); if(!a){const id=`${mv}-b${b}`;a=annById[id]||{id,mv,from:b,to:b,title:'',tags:[],a:'',src:[],ip:[],links:[],c:[]};if(!annById[id]){ANN.push(a);annById[id]=a}}
    const c={u:'You',r:'You',v:1,t,replies:[],key:a.id+'#u'+Date.now()};a.c.push(c);(userC[a.id]=userC[a.id]||[]).push(c);store.set('ucmt',userC);route()};
}

/* ---------- interpretations ---------- */
function interpView(){
  return `<div class="view"><div class="vh"><h1>Interpretations</h1></div>${QUESTIONS.map(q=>{const my=qvotes[q.id];const n=q.pos.map((p,i)=>p[3]+(my===i?1:0));const tot=n.reduce((x,y)=>x+y,0);
   return `<div class="card q"><div class="q-h"><b>${esc(q.title)}</b>${chip(q.bar[0],q.bar[1])}</div><div class="q-p">${q.pos.map((p,i)=>`<div class="pos"><span class="who">${esc(p[0])}</span><span class="how">${esc(p[1])}</span><p>${esc(p[2])}</p><div class="agree"><button class="${my===i?'on':''}" data-q="${q.id}" data-i="${i}" aria-label="Vote">${upSvg}</button><span class="meter"><i style="width:${Math.round(n[i]/tot*100)}%"></i></span><span class="pct">${Math.round(n[i]/tot*100)}%</span></div></div>`).join('')}</div></div>`}).join('')}</div>`;
}
const binders={interpretations(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const id=b.dataset.q,i=+b.dataset.i;qvotes[id]=qvotes[id]===i?undefined:i;store.set('qvotes',qvotes);const y=window.scrollY;route();window.scrollTo(0,y)})},connections:bindConn};

/* ---------- connections ---------- */
function connView(){
  const W=1000,H=300,base=240,pad=24,gap=26,tot=SCORE.I.total+1+SCORE.II.total+SCORE.III.total,k=(W-2*pad-2*gap)/tot;
  const off={I:pad,II:pad+(SCORE.I.total+1)*k+gap,III:pad+(SCORE.I.total+1+SCORE.II.total)*k+2*gap};
  const X=(mv,b)=>off[mv]+(mv==='I'?b:b-1)*k;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Connections between bars"><g id="ag">`;
  MOTIFS.forEach(m=>{for(let i=0;i<m.refs.length-1;i++){const r1=m.refs[i],r2=m.refs[i+1],x1=X(r1[0],r1[1]),x2=X(r2[0],r2[1]),h=Math.min(220,Math.abs(x2-x1)*.6+16);
    s+=`<path class="arc" data-m="${m.k}" stroke="${m.col}" d="M${x1},${base} C${x1},${base-h} ${x2},${base-h} ${x2},${base}"/>`}});
  s+='</g>';
  MV.forEach(mv=>{const x0=X(mv,mv==='I'?0:1),x1=X(mv,SCORE[mv].total);
    s+=`<line x1="${x0}" y1="${base}" x2="${x1}" y2="${base}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><text x="${x0}" y="${base+28}" fill="var(--ink)" font-family="var(--f-display)" font-size="18" font-weight="600">${mv}</text>`});
  MOTIFS.forEach(m=>m.refs.forEach(r=>{s+=`<circle class="node" data-go="bar-${r[0]}-${r[1]}" data-m="${m.k}" cx="${X(r[0],r[1])}" cy="${base}" r="5" fill="${m.col}" stroke="var(--surface)" stroke-width="1.5"><title>${m.name} · ${r[0]} ${bl(r[1],r[2])}</title></circle>`}));
  s+='</svg>';
  return `<div class="view"><div class="vh"><h1>Connections</h1></div>
   <div class="card"><div class="arcs" id="arcs">${s}</div><div class="legend">${MOTIFS.map(m=>`<button data-m="${m.k}"><i style="background:${m.col}"></i>${m.name}</button>`).join('')}</div></div>
   <div class="sec-title">Between bars</div>
   <div class="card mlist">${MOTIFS.map(m=>`<div class="mrow"><span class="mn"><i style="background:${m.col}"></i>${m.name}</span><div class="chips">${m.refs.map(r=>chip(r[0],r[1],m.col)).join('')}</div></div>`).join('')}</div>
   <div class="sec-title">Other works</div>
   <div class="card">${NET.map(n=>`<div class="work"><div><b>${esc(n.t)}</b><span>${esc(n.d)}</span></div>${n.bar?chip(n.bar[0],n.bar[1]):''}</div>`).join('')}</div></div>`;
}
function bindConn(){
  const arcs=$('#arcs');
  document.querySelectorAll('.legend button').forEach(b=>b.onclick=()=>{const on=b.classList.toggle('on');document.querySelectorAll('.legend button').forEach(o=>{if(o!==b)o.classList.remove('on')});arcs.classList.toggle('dim',on);arcs.querySelectorAll('.arc').forEach(p=>p.classList.toggle('on',on&&p.dataset.m===b.dataset.m))});
}

/* ---------- discussion ---------- */
function discView(){
  const all=[];ANN.forEach(a=>a.c.forEach(c=>all.push({a,c})));all.sort((x,y)=>voteVal(y.c)-voteVal(x.c));
  return `<div class="view"><div class="vh"><h1>Discussion</h1><span class="label">Example data</span></div><div class="card dl">${all.map(({a,c})=>`<div class="cmt"><button class="vote${voted.has(c.key)?' on':''}" data-key="${c.key}" aria-label="Upvote">${upSvg}<span>${voteVal(c)}</span></button><div><div class="by"><b>${esc(c.u)}</b><span class="role">${esc(c.r)}</span>${chip(a.mv,a.from)}</div><p>${esc(c.t)}</p></div></div>`).join('')}</div></div>`;
}

/* ---------- sources ---------- */
function sourcesView(){
  return `<div class="view"><div class="vh"><h1>Sources</h1></div>${Object.entries(SOURCES).map(([g,l])=>`<div class="sec-title">${g}</div><div class="card srcg">${l.map(s=>`<div class="s"><div>${s[0]}<small>${esc(s[1])}</small></div>${s[3]?`<a class="chip" href="${s[3]}" target="_blank" rel="noopener">Open ↗</a>`:'<span></span>'}</div>`).join('')}</div>`).join('')}</div>`;
}

route();
</script>

</body>
</html>
